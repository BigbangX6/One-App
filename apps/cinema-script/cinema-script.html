<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cinema Script</title>
<meta name="oneapp-icon" content="🎬">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Cinema Script v4.
   En haut (défile) : titre, PDF, Premiere Pro, affichage normal / cahier.
   Barre collée : Scénario | Tournage, recherche, claquette. La claquette ouverte remplace la barre
   (téléphone : en haut ; ordinateur : colonne de gauche). Deux habillages sur le même contenu :
   normal (cartes) et cahier (mise en page de scénario de tournage). */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --panel-2: #f1f3f5; --line: #e1e4e8; --text: #16181b; --muted: #6b7178;
  --accent: #1f6feb; --on-accent: #ffffff; --orange: #e8890c; --teal: #1fa98a; --red: #d93036;
  --av-master: #2e9b4f; --av-ok: #1c74c9; --av-moyen: #8e44ad; --av-bof: #e8890c; --av-ko: #795548; --av-verif: #d6336c;
  --slate: #15171a; --slate-text: #f6f6f4; --hl: #fff4c2; --shadow: 0 8px 28px rgba(16,24,40,.14);
  --font: system-ui, -apple-system, "Segoe UI", sans-serif; --type: "Courier Prime", "Courier New", Courier, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1113; --panel: #1a1d20; --panel-2: #22262a; --line: #2d3236; --text: #eef1f3; --muted: #8e979e; --accent: #4c9aff; --on-accent: #06172e;
  --av-ko: #a1887f; --slate: #050607; --hl: #3a3313; --shadow: 0 8px 28px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0f1113; --panel: #1a1d20; --panel-2: #22262a; --line: #2d3236; --text: #eef1f3; --muted: #8e979e; --accent: #4c9aff; --on-accent: #06172e; --av-ko: #a1887f; --slate: #050607; --hl: #3a3313; --shadow: 0 8px 28px rgba(0,0,0,.5); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cs-dragging, .cs-dragging * { user-select: none; -webkit-user-select: none; cursor: grabbing !important; }
.page { max-width: 780px; margin: 0 auto; padding: 14px 14px calc(150px + env(safe-area-inset-bottom, 0px)); }

/* --- Haut de page --- */
.top { display: grid; gap: 10px; padding-bottom: 12px; }
.top h1 { margin: 0; font-size: 1.45rem; line-height: 1.2; }
.top-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 600px) { .top-actions { display: flex; flex-wrap: wrap; } }
.tbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 10px; font-weight: 700; font-size: .9rem; line-height: 1.25; }
.tbtn.pdf1 { background: var(--orange); border-color: var(--orange); color: #111; }
.tbtn.pdf2 { background: var(--teal); border-color: var(--teal); color: #071c17; }
.tbtn.pr { background: #2a0a4a; border-color: #2a0a4a; color: #e8c6ff; font-family: var(--font); letter-spacing: .02em; }

/* --- Barre collée --- */
.stick { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 6px 0 10px; }
.bar { display: flex; gap: 8px; align-items: stretch; }
.seg { flex: 1; display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; min-width: 0; }
.seg button { border: none; background: none; padding: 9px 4px; border-radius: 9px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.ic { width: 46px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 1.15rem; }
.ic.on { border-color: var(--accent); }
.ic.slate-btn { background: var(--slate); border-color: var(--slate); background-image: linear-gradient(var(--slate), var(--slate)), repeating-linear-gradient(-45deg, var(--slate-text) 0 5px, var(--slate) 5px 10px); background-size: 100% calc(100% - 9px), 100% 9px; background-position: bottom, top; background-repeat: no-repeat; }
.search { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-top: 8px; }
.search input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.search small { color: var(--muted); }
body.clap .stick { display: none; }

/* --- Claquette --- */
.clapper { display: none; }
body.clap .clapper { display: block; position: sticky; top: 0; z-index: 25; padding: 6px 0 10px; background: var(--bg); }
.cl { background: var(--slate); color: var(--slate-text); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.cl-stripes { position: relative; height: 26px; background: repeating-linear-gradient(-45deg, var(--slate-text) 0 13px, var(--slate) 13px 26px); }
.cl.impro .cl-stripes { background: repeating-linear-gradient(-45deg, var(--orange) 0 13px, var(--slate) 13px 26px); }
.cl-x { position: absolute; right: 6px; top: 3px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--slate-text); background: var(--slate); color: var(--slate-text); font-weight: 700; z-index: 1; }
.cl-body { padding: 10px 12px 12px; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.cl-nums { display: flex; align-items: flex-end; gap: 14px; }
.cl-nums div { display: grid; }
.cl-nums small { font-size: .62rem; letter-spacing: .14em; opacity: .65; }
.cl-nums b { font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cl-nums .take b { color: #ffd54a; }
.cl-impro { margin-left: auto; border: 1px solid var(--orange); background: none; color: var(--orange); border-radius: 14px; padding: 5px 10px; font-weight: 700; font-size: .82rem; }
.cl-text { font-size: .95rem; line-height: 1.35; opacity: .9; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cl-more { display: none; }
.cl-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.cl-clap { border: none; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 800; padding: 0 16px; font-size: 1.05rem; }
.cl-row input { min-width: 0; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); padding: 10px 12px; color: var(--slate-text); }
.cl-avis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.av { --av: #888; border: 2px solid var(--av); background: rgba(255,255,255,.06); color: var(--slate-text); border-radius: 10px; display: grid; justify-items: center; padding: 5px 0; min-height: 50px; }
.av span { font-size: 1.2rem; line-height: 1.1; }
.av b { font-size: .64rem; color: var(--av); }
.av:active, .cl-clap:active { transform: scale(.96); }
.cl-empty { opacity: .8; font-size: .95rem; padding: 4px 0; }
.k-master { --av: var(--av-master); } .k-ok { --av: var(--av-ok); } .k-moyen { --av: var(--av-moyen); } .k-bof { --av: var(--av-bof); } .k-ko { --av: var(--av-ko); } .k-verif { --av: var(--av-verif); }
.cl-takes { display: grid; gap: 4px; }
.cl-takes div { display: flex; gap: 8px; align-items: baseline; font-size: .88rem; border-left: 3px solid var(--av); padding-left: 8px; }
.cl-takes small { opacity: .7; }
/* Ordinateur : la claquette devient une colonne à gauche, la page se décale */
@media (min-width: 900px) {
  body.clap .clapper { position: fixed; left: 0; top: 0; bottom: 0; width: 360px; padding: 14px; overflow-y: auto; }
  body.clap .page { margin-left: 380px; }
  body.clap .cl-text { -webkit-line-clamp: unset; display: block; font-size: 1.05rem; }
  body.clap .cl-more { display: grid; gap: 10px; }
  .cl-nums b { font-size: 2.4rem; }
  .cl-avis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .av { min-height: 62px; }
  .cl-row { grid-template-columns: minmax(0, 1fr); }
  .cl-clap { padding: 14px; font-size: 1.2rem; }
}

/* --- Listes (habillage normal) --- */
.seq { margin-bottom: 22px; }
.seq-head { background: var(--panel); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; border-top: 4px solid var(--c); }
.lbl { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { display: flex; align-items: center; gap: 8px; }
.num .n { font-size: 1.25rem; color: var(--c); }
.num .k, .snum.r { display: none; }
.seq-head .cs-edit { font-weight: 700; font-size: 1.1rem; }
.plans { display: grid; gap: 8px; margin: 8px 0 0 14px; }
.plan { background: var(--panel); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; border-left: 4px solid var(--c); }
.plan.impro { box-shadow: inset 0 -3px 0 var(--orange); }
.tools { display: none; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
.plan:focus-within .tools, .seq-head:focus-within .tools { display: flex; }
.tool { border: 1px solid var(--line); background: var(--panel-2); border-radius: 18px; padding: 6px 12px; font-size: .85rem; font-weight: 600; }
.tool.danger { color: var(--red); }
.cs-edit { width: 100%; border: none; background: transparent; padding: 2px 0; resize: none; overflow: hidden; line-height: 1.5; font-size: 1.06rem; }
.cs-edit:focus { outline: none; }
.ro { white-space: pre-wrap; line-height: 1.5; font-size: 1.06rem; padding: 2px 0; }
.seq-head .ro { font-weight: 700; font-size: 1.1rem; }
.vid { display: inline-flex; gap: 8px; align-items: center; border: none; background: var(--panel-2); border-radius: 8px; padding: 4px 10px 4px 4px; font-size: .85rem; max-width: 100%; min-width: 0; overflow: hidden; justify-self: start; text-align: left; }
.pmain, .smain, .rtext { min-width: 0; }
.vid i { width: 40px; height: 24px; border-radius: 4px; background: linear-gradient(135deg, #0f2027, #2c5364); color: #fff; display: grid; place-items: center; font-style: normal; font-size: .7rem; flex: none; }
.vid span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vid img { width: 48px; height: 28px; border-radius: 4px; object-fit: cover; flex: none; background: #000; }
.vid span { min-width: 0; }
.cs-video { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; width: 100%; border-radius: 12px; background: #000 center / cover no-repeat; text-decoration: none; overflow: hidden; }
.cs-video .play { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; font-size: 1.6rem; padding-left: 4px; box-shadow: 0 0 0 3px rgba(255,255,255,.85); }
.cs-video:active .play { transform: scale(.94); }
.cs-vname { color: var(--text) !important; font-weight: 700; overflow-wrap: anywhere; }
.cs-vhint { font-size: .9rem; }
/* Prises d'un plan */
.takes-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 14px; padding: 2px 8px; font-size: .78rem; font-weight: 700; color: var(--text); }
.cs-takes { display: grid; gap: 8px; }
.cs-take { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; border-left: 4px solid var(--av); background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.cs-take-main { display: grid; gap: 2px; min-width: 0; }
.cs-take-main small { color: var(--muted); overflow-wrap: anywhere; }
.cs-del { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; width: 40px; height: 40px; font-size: 1.1rem; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--av); }
.empty { color: var(--muted); font-style: italic; padding: 8px 2px; }
.tag { font-size: .75rem; font-weight: 700; color: var(--accent); display: block; }
.tag.next { color: var(--teal); }
/* Plan pris en claquette */
body.clap .plan, body.clap .row { cursor: pointer; }
.plan.cur, .row.cur { outline: 3px solid var(--accent); outline-offset: -1px; }
.plan.done, .row.done { opacity: .72; }

/* Feuille de service : journées repliables */
.day { margin-bottom: 16px; }
.day-head { background: var(--panel); border-radius: 12px; padding: 8px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 2px 8px; align-items: center; border-top: 4px solid var(--orange); }
.day-head .cs-edit, .day-head .dname { font-weight: 700; font-size: 1.1rem; }
.day-head small { grid-column: 2 / -1; color: var(--muted); font-size: .82rem; }
.mini { width: 34px; height: 34px; border: none; background: none; color: var(--muted); border-radius: 8px; }
.rows { display: grid; gap: 8px; margin: 8px 0 0 10px; }
.row { background: var(--panel); border-radius: 12px; padding: 10px 12px 10px 4px; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px; align-items: start; border-left: 4px solid var(--c); }
.row.impro { box-shadow: inset 0 -3px 0 var(--orange); }
.handle { touch-action: none; user-select: none; border: none; background: none; color: var(--muted); font-size: 1.3rem; padding: 2px 4px; cursor: grab; }
.code { font-weight: 800; color: var(--c); min-width: 40px; padding-top: 2px; display: grid; gap: 4px; }
.rtext { line-height: 1.45; font-size: 1.04rem; white-space: pre-wrap; }
.rtext small { display: block; color: var(--muted); font-size: .8rem; }
.temps { width: 84px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: .85rem; }
.temps.ro { border-color: transparent; background: none; text-align: right; color: var(--muted); padding: 2px; }

/* --- Boutons de création (à glisser) --- */
.adders { position: fixed; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; gap: 8px; }
body.clap .adders, body.typing .adders { display: none; }
.adder { border: none; border-radius: 22px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); touch-action: none; cursor: grab; }
.adder.alt { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
.adder.wiggle { animation: wiggle .6s ease; }
@keyframes wiggle { 0%, 100% { transform: none; } 20% { transform: translateY(-8px) rotate(-4deg); } 40% { transform: translateY(0) rotate(4deg); } 60% { transform: translateY(-4px) rotate(-2deg); } 80% { transform: rotate(1deg); } }
.drag-hint { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 75; background: var(--accent); color: var(--on-accent); padding: 10px 14px; border-radius: 12px; font-weight: 600; max-width: min(92vw, 440px); text-align: center; box-shadow: var(--shadow); animation: drop .2s ease-out; }
@keyframes drop { from { transform: translate(-50%, -12px); opacity: 0; } }

/* --- Glisser, fenêtres --- */
.cs-ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -100%); background: var(--panel); border: 2px solid var(--accent); border-radius: 20px; padding: 6px 12px; font-weight: 700; box-shadow: var(--shadow); white-space: nowrap; }
.cs-line { position: fixed; z-index: 55; pointer-events: none; height: 4px; background: var(--accent); border-radius: 2px; }
.cs-line span { position: absolute; left: 10px; top: -14px; background: var(--accent); color: var(--on-accent); font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
.cs-into { outline: 3px dashed var(--accent) !important; outline-offset: 2px; }
.cs-flash { animation: fl 1.5s ease-out; }
@keyframes fl { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } }
@media (prefers-reduced-motion: reduce) { .cs-flash, .adder.wiggle, .drag-hint { animation: none; } }
.cs-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 14px; display: flex; gap: 14px; align-items: center; max-width: min(92vw, 480px); box-shadow: var(--shadow); }
.cs-toast button { border: none; background: none; color: var(--accent); font-weight: 800; text-transform: uppercase; }
.cs-modal-back { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.cs-modal { background: var(--panel); width: min(600px, 100%); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 88vh; overflow-y: auto; }
.cs-modal h3 { margin: 0; font-size: 1.15rem; }
.cs-modal p { margin: 0; color: var(--muted); line-height: 1.45; }
.cs-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.cs-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 11px 16px; font-weight: 700; }
.cs-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cs-btn.danger { background: var(--red); color: #fff; border-color: var(--red); }
.cs-btn.impro { background: var(--orange); color: #000; border-color: var(--orange); }
.cs-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-size: 1.1rem; }
.cs-error { color: var(--red) !important; font-weight: 600; }
.cs-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cs-chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 16px; padding: 7px 12px; font-weight: 700; }
.cs-chip.on { background: var(--orange); border-color: var(--orange); color: #000; }
.move-num { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 800; }
.move-num input { width: 7rem; font-size: 1.3rem; font-weight: 800; }
.pr-steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.pr-steps li { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; align-items: start; color: var(--muted); line-height: 1.45; }
.pr-steps li b { color: var(--text); }
.pr-steps .ico { font-size: 1.3rem; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.legend div { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.legend i { width: 18px; height: 18px; border-radius: 4px; background: var(--av); flex: none; }
.back { display: inline-block; margin-top: 30px; font-size: .8rem; color: var(--muted); }

/* --- Habillage « cahier » : même contenu, mise en page de scénario de tournage --- */
body.cahier { --bg: #e7e7e3; --panel: #ffffff; --panel-2: #f2f2ee; --line: #d6d6d0; --text: #141414; --muted: #6c6c68; --accent: #141414; --on-accent: #ffffff; font-family: var(--type); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.cahier { --bg: #0b0b0b; --panel: #161616; --panel-2: #1f1f1f; --line: #2e2e2c; --text: #ecebe6; --muted: #9a9a94; --accent: #ecebe6; --on-accent: #111; } }
:root[data-theme="dark"] body.cahier { --bg: #0b0b0b; --panel: #161616; --panel-2: #1f1f1f; --line: #2e2e2c; --text: #ecebe6; --muted: #9a9a94; --accent: #ecebe6; --on-accent: #111; }
body.cahier .page { background: var(--panel); min-height: 100vh; box-shadow: 0 0 0 1px var(--line); padding-left: 18px; padding-right: 18px; }
@media (min-width: 700px) { body.cahier .page { padding-left: 48px; padding-right: 48px; } }
body.cahier .top h1 { text-align: center; text-transform: uppercase; text-decoration: underline; text-underline-offset: 5px; font-size: 1.1rem; letter-spacing: .06em; }
@media (min-width: 600px) { body.cahier .top-actions { justify-content: center; } }
body.cahier .tbtn { border-radius: 0; border: 1px solid var(--text); background: none; color: var(--text); font-weight: 400; text-transform: uppercase; font-size: .78rem; }
body.cahier .stick, body.cahier.clap .clapper { background: var(--panel); }
body.cahier .seg, body.cahier .ic { border-radius: 0; border-color: var(--text); }
body.cahier .seg button { border-radius: 0; text-transform: uppercase; font-weight: 400; letter-spacing: .02em; font-size: .85rem; }
body.cahier .seg button.on { background: var(--text); color: var(--panel); }
body.cahier .seq-head, body.cahier .plan, body.cahier .row, body.cahier .day-head { background: none; border: none; border-radius: 0; box-shadow: none; padding-left: 0; padding-right: 0; }
body.cahier .seq-head { grid-template-columns: 3.4rem minmax(0, 1fr) 3.4rem; align-items: start; }
body.cahier .snum.r { display: block; text-align: right; font-weight: 700; padding-top: 2px; }
body.cahier .num .lbl { display: none; }
body.cahier .num { align-items: flex-start; flex-direction: column; gap: 3px; }
body.cahier .num .n { color: var(--text); font-size: 1rem; }

<body>
<!--
CINEMA SCRIPT v4 (version One App). Source : BigbangX6/One-App › apps/cinema-script, copiée dans
BigbangX6/cinema_script › oneapp/. Fonctionnement, format et clap : README.md à côté.
Structure de app_data (CONTRAT avec l'extension Premiere : ne pas renommer ces champs) :
{
  v: 1,
  sequences:    [ { id, info } ],
  plans:        [ { seqId, id, impro: 0|1, info, temps, video: null | { id, name, thumb } } ],
  takes:        [ { uid, seqId, planId, prise, avis, com, timestamp } ],
  tournageList: [ { type: "plan", seqId, planId } | { type: "sep", text } ],
  ui:           { style: "normal"|"cahier", view: "scenario"|"tournage", clap: bool, active: { seqId, planId } | null }
}
- ui : là où on en était (affichage, liste, claquette, plan en cours), ignoré par l'extension.
- Les libellés d'avis sont lus par l'extension. La classe DigitalClapper est une copie exacte de l'original.
- video : vidéo de référence choisie dans Google Drive (OneAppAPI.pickDriveFile) : id du fichier Drive,
  nom, miniature (data:URL JPEG ~320 px, ou null). Lien d'ouverture calculé à l'affichage
  (OneAppAPI.driveFileLink : app Google Drive, y compris hors-ligne ; schéma spécial sur iPhone).
- Clap : signal codé (classe d'origine, intouchable) PUIS, après une pause, un claquement audible
  (playSlateSound). Le décodeur s'arrête au « * » final du signal : le claquement ne le gêne pas.
-->

<script>
/*
 * Cinema Script v4 · noyau (données, numérotation, clap, glisser, clavier, PDF).
 * Hors de One App, un projet d'exemple s'affiche (aperçu) et rien n'est enregistré.
 * Données (même format que l'app, contrat avec l'extension Premiere), numérotation, clap audio,
 * glisser-déposer, clavier sur téléphone, PDF. L'affichage est plus bas, dans la page.
 * app_data.ui garde l'affichage (normal / cahier), la liste ouverte, la claquette et le plan en cours :
 * après un rechargement on revient au même endroit. L'extension Premiere ignore ce champ.
 *
 * Règles de numérotation (phase de préparation) :
 * - les plans d'une séquence sont toujours 1, 2, 3… (insérer, supprimer, changer un numéro décale les autres) ;
 * - les séquences peuvent avoir des trous (préparer la 10 sans les autres) : une séquence insérée prend
 *   « précédente + 1 » et ne décale que les numéros qui se suivent ;
 * - les numéros de prise ne sont jamais renumérotés (prise suivante = max + 1) ;
 * - on ne prévient que si des prises déjà tournées changeraient de numéro (leur clap garde l'ancien).
 */
(function () {
"use strict";
const CS = (window.CS = {});

// --- AVIS (libellés lus par l'extension : ne pas modifier) ---
const AVIS = ["❓ À vérifier", "✅ OK (Bonne)", "⭐ MASTER (Parfaite)", "😐 Moyen", "😕 Bof", "❌ KO (Ratée)"];
CS.AVIS = AVIS;
CS.AVIS_BUTTONS = [
  { label: AVIS[2], e: "⭐", s: "Master", k: "master" }, { label: AVIS[1], e: "✅", s: "OK", k: "ok" },
  { label: AVIS[3], e: "😐", s: "Moyen", k: "moyen" }, { label: AVIS[4], e: "😕", s: "Bof", k: "bof" },
  { label: AVIS[5], e: "❌", s: "KO", k: "ko" }, { label: AVIS[0], e: "❓", s: "À vérifier", k: "verif" }
];
CS.avisKey = function (a) {
  a = a || "";
  if (a.includes("MASTER")) return "master";
  if (a.includes("OK")) return "ok";
  if (a.includes("Moyen")) return "moyen";
  if (a.includes("Bof")) return "bof";
  if (a.includes("KO")) return "ko";
  return "verif";
};
CS.avisShort = (a) => (CS.AVIS_BUTTONS.find((b) => b.label === a) || CS.AVIS_BUTTONS[5]);

// --- CLAP AUDIO (copie exacte de l'original, ne pas modifier) ---
class DigitalClapper {
    constructor() {
        this.audioCtx = null;
        this.dtmfFreqs = {
            //'1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
            //'4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
            //'7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
            //'*': [941, 1209], '0': [941, 1336], '#': [941, 1477]

            '1': [10697, 12209], '2': [10697, 12336], '3': [10697, 12477],
            '4': [10770, 12209], '5': [10770, 12336], '6': [10770, 12477],
            '7': [10852, 12209], '8': [10852, 12336], '9': [10852, 12477],
            '*': [10941, 12209], '0': [10941, 12336], '#': [10941, 12477]
        };
    }
    play(scene, shot, take) {
        if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }
        const payload = `*${scene}*${shot}*${take}#*`;
        const now = this.audioCtx.currentTime;
        
        //this._playTransient(now);
        
        let timeCursor = now + 0.065;
        const toneDuration = 0.080;
        const pauseDuration = 0.120;
        for (let i = 0; i < payload.length; i++) {
            const char = payload[i];
            if (this.dtmfFreqs[char]) {
                this._playDTMF(this.dtmfFreqs[char][0], this.dtmfFreqs[char][1], timeCursor, toneDuration);
                timeCursor += toneDuration + pauseDuration;
            }
        }
        
    }
    _playTransient(startTime) {
        const clickOsc = this.audioCtx.createOscillator();
        const clickGain = this.audioCtx.createGain();
        clickOsc.type = 'square';
        clickOsc.frequency.value = 1000;
        clickGain.gain.setValueAtTime(0, startTime);
        clickGain.gain.linearRampToValueAtTime(1, startTime + 0.001);
        clickGain.gain.setValueAtTime(1, startTime + 0.010);
        clickGain.gain.linearRampToValueAtTime(0, startTime + 0.015);
        clickOsc.connect(clickGain);
        clickGain.connect(this.audioCtx.destination);
        clickOsc.start(startTime);
        clickOsc.stop(startTime + 0.020);
    }
    _playDTMF(f1, f2, startTime, duration) {
        const osc1 = this.audioCtx.createOscillator();
        const osc2 = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();
        osc1.frequency.value = f1;
        osc2.frequency.value = f2;
        osc1.type = 'sine';
        osc2.type = 'sine';
        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(0.75, startTime + 0.005);
        gainNode.gain.setValueAtTime(0.75, startTime + duration - 0.005);
        gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);
        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration);
        osc2.stop(startTime + duration);
    }
}

CS.clapper = new DigitalClapper();

// --- CLAQUEMENT (après le signal codé) ---
// Le signal de synchronisation est joué par DigitalClapper, sans aucune modification. On calcule
// sa fin (même horloge, mêmes durées que la classe), on laisse une pause, puis on joue un vrai
// « clac » de claquette : bruit bref filtré (≤ 7 kHz, loin des 10–12 kHz du signal) + corps boisé.
CS.SLATE_PAUSE = 0.5; // secondes de silence entre la fin du signal et le claquement
CS.signalEnd = function (start, scene, shot, take) {
  // play() : début à +65 ms, puis 80 ms de son + 120 ms de silence par caractère de *S*P*T#*
  return start + 0.065 + String("*" + scene + "*" + shot + "*" + take + "#*").length * (0.080 + 0.120);
};
function playSlateSound(ctx, t) {
  const rate = ctx.sampleRate, len = Math.floor(rate * 0.3);
  const buf = ctx.createBuffer(1, len, rate), d = buf.getChannelData(0);
  let seed = 12345; // bruit pseudo-aléatoire fixe : le même claquement à chaque fois
  const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 1073741824) - 1;
  for (let i = 0; i < len; i++) {
    const s = i / rate;
    d[i] = rnd() * (Math.exp(-s / 0.012) + 0.35 * Math.exp(-Math.max(0, s - 0.004) / 0.05) * (s > 0.004 ? 1 : 0));
  }
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const band = ctx.createBiquadFilter(); band.type = "bandpass"; band.frequency.value = 2200; band.Q.value = 0.6;
  const low = ctx.createBiquadFilter(); low.type = "lowpass"; low.frequency.value = 7000;
  const ng = ctx.createGain(); ng.gain.value = 1.0;
  noise.connect(band); band.connect(low); low.connect(ng); ng.connect(ctx.destination);
  noise.start(t);
  // Corps : le bois des deux lattes qui se rencontrent
  const body = ctx.createOscillator(), bg = ctx.createGain();
  body.type = "triangle";
  body.frequency.setValueAtTime(260, t);
  body.frequency.exponentialRampToValueAtTime(120, t + 0.09);
  bg.gain.setValueAtTime(0.0001, t);
  bg.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
  bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  body.connect(bg); bg.connect(ctx.destination);
  body.start(t); body.stop(t + 0.18);
}
CS.playSlateSound = playSlateSound;
CS.clap = function () {
  const a = CS.active;
  if (!a) return;
  const take = CS.nextTake(a.seqId, a.planId);
  CS.clapper.play(a.seqId, a.planId, take);           // signal de synchronisation : intouché
  const ctx = CS.clapper.audioCtx;
  if (ctx) playSlateSound(ctx, CS.signalEnd(ctx.currentTime, a.seqId, a.planId, take) + CS.SLATE_PAUSE);
};

// --- Projet d'exemple (utilisé seulement hors de One App) ---
function demoData() {
  const S = (id, info) => ({ id, info });
  const P = (seqId, id, info, temps, video) => ({ seqId, id, impro: 0, info, temps, video: video ? { id: "demo", name: video } : null });
  const sequences = [
    S(1, "INT. CUISINE – JOUR\nMarie, Paul"), S(2, "INT. SALON – JOUR\nMarie, Paul"),
    S(5, "EXT. RUE DEVANT L'IMMEUBLE – NUIT\nPaul"), S(6, "INT. CAGE D'ESCALIER – NUIT\nMarie, la voisine"),
    S(7, "INT. APPARTEMENT DE LA VOISINE – NUIT\nMarie, la voisine"), S(9, "EXT. TOIT DE L'IMMEUBLE – AUBE\nMarie, Paul")
  ];
  const plans = [
    P(1, 1, "PL fixe. Marie entre, pose les courses. Paul lit sans lever les yeux.", "20 min"),
    P(1, 2, "PM travelling. Les mains de Marie rangent, jusqu'au frigo vide.", "30 min", "repetition_cuisine_1-2.mp4"),
    P(1, 3, "GP. Paul lève enfin les yeux de son journal.", "15 min"),
    P(1, 4, "Champ-contrechamp : « Tu as encore oublié le pain. »", "40 min"),
    P(2, 1, "PE. Le salon en désordre, Marie traverse.", "20 min"),
    P(2, 2, "PR. Paul au téléphone, dos à la fenêtre.", "25 min"),
    P(2, 3, "Insert. La photo de mariage retournée.", "10 min"),
    P(5, 1, "PE grue. Paul sort de l'immeuble, la rue est vide.", "45 min", "demo_grue_5-1.mp4"),
    P(5, 2, "PA épaule. Paul allume une cigarette, hésite.", "25 min"),
    P(5, 3, "Insert. Le briquet qui ne s'allume pas.", "10 min"),
    P(5, 4, "PL. Paul s'éloigne sous les réverbères.", "20 min"),
    P(6, 1, "PM panoramique. La voisine entrouvre sa porte.", "30 min"),
    P(6, 2, "GP. Marie, essoufflée, s'arrête sur le palier.", "20 min"),
    P(6, 3, "Plongée. La cage d'escalier vue du dernier étage.", "25 min"),
    P(7, 1, "PE. L'appartement encombré de plantes.", "20 min"),
    P(7, 2, "Champ-contrechamp. La voisine sert le thé.", "45 min"),
    P(9, 1, "PL. Le jour se lève sur les toits.", "30 min", "reperage_toit_9-1.mp4"),
    P(9, 2, "PM. Marie et Paul assis côte à côte.", "30 min"),
    P(9, 3, "GP. La main de Paul cherche celle de Marie.", "15 min")
  ];
  const sep = (text) => ({ type: "sep", text });
  const pl = (k) => { const [s, p] = k.split(".").map(Number); return { type: "plan", seqId: s, planId: p }; };
  const tournageList = [
    sep("Lundi 14 · matin · Appartement"), ...["1.1", "1.2", "1.3", "2.1", "2.2", "1.4", "2.3"].map(pl),
    sep("Lundi 14 · après-midi · Cage d'escalier"), ...["6.1", "6.2", "7.1", "6.3", "7.2"].map(pl),
    sep("Mardi 15 · nuit · Rue"), ...["5.1", "5.2", "5.3", "5.4"].map(pl),
    sep("Mercredi 16 · aube · Toit"), ...["9.1", "9.2", "9.3"].map(pl)
  ];
  const takes = [];
  let t = Date.parse("2026-10-14T06:40:00Z");
  const T = (k, avis, com) => {
    const [s, p] = k.split(".").map(Number);
    t += 7 * 60000;
    takes.push({ uid: "demo" + takes.length, seqId: s, planId: p, prise: takes.filter((x) => x.seqId === s && x.planId === p).length + 1, avis, com: com || "", timestamp: new Date(t).toISOString() });
  };
  T("1.1", AVIS[5], "Perche dans le champ"); T("1.1", AVIS[1]); T("1.1", AVIS[2], "La bonne");
  T("1.2", AVIS[4], "Bruit de frigo"); T("1.2", AVIS[1]);
  T("1.3", AVIS[3], "Regard trop tôt"); T("1.3", AVIS[2]);
  T("2.1", AVIS[1]);
  T("2.2", AVIS[5], "Texte oublié"); T("2.2", AVIS[3], "Point flou en fin de plan");
  return { v: 1, sequences, plans, takes, tournageList };
}

CS.demoData = demoData;

window.OneAppAPI = window.OneAppAPI || {
  loadData: async () => ({ app_data: demoData(), readOnly: false }),
  saveData: () => {},
  onDataChange: () => {},
  onModeChange: () => {},
  getFileName: () => "Le Dernier Métro (exemple)",
  onNameChange: () => {}
};

// --- DONNÉES ---
const DEFAULT_STATE = { v: 1, sequences: [{ id: 1, info: "" }], plans: [{ seqId: 1, id: 1, impro: 0, info: "", temps: "", video: null }], takes: [], tournageList: [{ type: "plan", seqId: 1, planId: 1 }] };
function newUid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
CS.normalize = function (data) {
  // Nouveau document ([]) : état par défaut, qui passe aussi par la suite (ui compris)
  if (!data || Array.isArray(data) || typeof data !== "object") data = {};
  const s = { ...structuredClone(DEFAULT_STATE), ...data };
  ["sequences", "plans", "takes", "tournageList"].forEach((k) => { if (!Array.isArray(s[k])) s[k] = []; });
  s.takes.forEach((t) => { if (!t.uid) t.uid = newUid(); });
  s.plans.forEach((p) => { if (p.video === undefined) p.video = null; });
  s.plans.forEach((p) => {
    if (!s.tournageList.some((i) => i.type === "plan" && i.seqId === p.seqId && i.planId === p.id)) s.tournageList.push({ type: "plan", seqId: p.seqId, planId: p.id });
  });
  const ui = s.ui && typeof s.ui === "object" && !Array.isArray(s.ui) ? s.ui : {};
  s.ui = { style: ui.style === "cahier" ? "cahier" : "normal", view: ui.view === "tournage" ? "tournage" : "scenario", clap: !!ui.clap, active: ui.active || null };
  s.v = 1;
  return s;
};
CS.state = CS.normalize(null);
CS.readOnly = false;
CS.active = null;            // plan en cours de tournage { seqId, planId }

// --- ENREGISTREMENT ---
let renderFn = () => {};
let saveTimer = null;
CS.render = () => renderFn();
function save() { S().ui.active = CS.active; OneAppAPI.saveData(CS.state); }
CS.commit = function () { if (CS.readOnly) return; clearTimeout(saveTimer); saveTimer = null; renderFn(); save(); };
// Affichage (claquette, liste, style, plan pris) : simple changement d'écran, rien n'est envoyé
// à Drive. L'état d'affichage part avec la prochaine vraie modification du projet.
CS.setUI = function (patch) { Object.assign(S().ui, patch); renderFn(); };
CS.saveSoon = function () { if (CS.readOnly) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; save(); }, 800); };
CS.saveNow = function () { if (!saveTimer) return; clearTimeout(saveTimer); saveTimer = null; if (!CS.readOnly) save(); };
CS.projectName = () => (OneAppAPI.getFileName && OneAppAPI.getFileName()) || "Projet";

// --- LECTURE ---
const S = () => CS.state;
CS.key = (p) => p.seqId + "." + p.id;
CS.seqs = () => [...S().sequences].sort((a, b) => a.id - b.id);
CS.seq = (id) => S().sequences.find((s) => s.id === id);
CS.plansOf = (seqId) => S().plans.filter((p) => p.seqId === seqId).sort((a, b) => a.id - b.id);
CS.plan = (seqId, id) => S().plans.find((p) => p.seqId === seqId && p.id === id);
CS.takesOf = (seqId, planId) => S().takes.filter((t) => t.seqId === seqId && t.planId === planId).sort((a, b) => a.prise - b.prise);
CS.nextTake = (seqId, planId) => CS.takesOf(seqId, planId).reduce((m, t) => Math.max(m, t.prise), 0) + 1;
CS.isActive = (p) => !!CS.active && CS.active.seqId === p.seqId && CS.active.planId === p.id;
CS.activePlan = () => (CS.active ? CS.plan(CS.active.seqId, CS.active.planId) : null);
CS.seqTitle = (id) => { const s = CS.seq(id); return s && s.info ? s.info.split("\n")[0] : ""; };
CS.seqColor = function (seqId) {
  const i = CS.seqs().findIndex((s) => s.id === seqId);
  return "hsl(" + ((Math.max(0, i) * 67 + 205) % 360) + " 62% 58%)";
};
CS.minutes = function (s) {
  s = String(s || "").toLowerCase().replace(/\s/g, "");
  let m = s.match(/(\d+)h(\d+)?/);
  if (m) return +m[1] * 60 + (+m[2] || 0);
  m = s.match(/(\d+)/);
  return m ? +m[1] : 0;
};
CS.fmtMin = (m) => (m < 60 ? m + " min" : Math.floor(m / 60) + " h" + (m % 60 ? " " + String(m % 60).padStart(2, "0") : ""));
CS.lastTake = () => S().takes.reduce((b, t) => (!b || (t.timestamp || "") > (b.timestamp || "") ? t : b), null);
// Premier plan sans prise après celui de la dernière prise (dans l'ordre de tournage)
CS.nextToShoot = function () {
  const last = CS.lastTake(), list = S().tournageList;
  const start = last ? list.findIndex((i) => i.type === "plan" && i.seqId === last.seqId && i.planId === last.planId) + 1 : 0;
  for (let k = Math.max(0, start); k < list.length; k++) {
    const i = list[k];
    if (i.type === "plan" && CS.plan(i.seqId, i.planId) && !CS.takesOf(i.seqId, i.planId).length) return CS.plan(i.seqId, i.planId);
  }
  return null;
};
// Journées : les séparateurs du plan de travail et les plans qui les suivent
CS.days = function () {
  const groups = [];
  let g = null;
  S().tournageList.forEach((item, index) => {
    if (item.type === "sep") { g = { sep: item, index, items: [] }; groups.push(g); return; }
    if (!g) { g = { sep: null, index: -1, items: [] }; groups.push(g); }
    const p = CS.plan(item.seqId, item.planId);
    if (p) g.items.push({ index, p });
  });
  return groups;
};
CS.dayEnd = function (sepIndex) {
  const n = S().tournageList.findIndex((i, k) => k > sepIndex && i.type === "sep");
  return n === -1 ? S().tournageList.length : n;
};
CS.dayOf = (p) => CS.days().find((g) => g.items.some((x) => x.p === p)) || null;
CS.orderIndex = (p) => S().tournageList.findIndex((i) => i.type === "plan" && i.seqId === p.seqId && i.planId === p.id);
CS.dayMinutes = (g) => g.items.reduce((a, { p }) => a + CS.minutes(p.temps), 0);

// --- RECHERCHE ---
CS.fold = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
CS.parseQuery = function (q) {
  q = CS.fold(q).trim();
  if (!q) return null;
  let m = q.match(/^(\d+)$/);
  if (m) return { seq: +m[1] };
  m = q.match(/^(\d+)\s*[.\-\/ ]\s*(\d+)$/);
  if (m) return { seq: +m[1], plan: +m[2] };
  return { text: q };
};
CS.matches = function (p, q) {
  if (!q) return true;
  if (q.seq !== undefined) return p.seqId === q.seq && (q.plan === undefined || p.id === q.plan);
  return CS.fold([p.info, p.temps, (CS.seq(p.seqId) || {}).info, p.video && p.video.name].join(" ")).includes(q.text);
};

// --- MODIFICATIONS ---
CS.confirmRenumber = (affected) => (affected
  ? CS.ask("Prises déjà tournées", "Des prises existent sur les plans renumérotés : leur clap garde l'ancien numéro, la synchronisation au montage ne les retrouvera plus.", "Renuméroter quand même", true)
  : Promise.resolve(true));

// Change les numéros de plans (Map plan → { seqId, id }) ; prises, plan de travail et plan en cours suivent
CS.applyMoves = function (moves) {
  const byOld = new Map();
  moves.forEach((to, p) => byOld.set(CS.key(p), to));
  const map = (o, sk, pk) => { const to = byOld.get(o[sk] + "." + o[pk]); if (to) { o[sk] = to.seqId; o[pk] = to.id; } };
  S().takes.forEach((t) => map(t, "seqId", "planId"));
  S().tournageList.forEach((i) => { if (i.type === "plan") map(i, "seqId", "planId"); });
  if (CS.active) map(CS.active, "seqId", "planId");
  moves.forEach((to, p) => { p.seqId = to.seqId; p.id = to.id; });
};
// Mouvements pour que chaque liste soit numérotée 1, 2, 3… dans sa séquence
function movesFor(lists) {
  const m = new Map();
  lists.forEach(({ seqId, order }) => order.forEach((p, i) => { if (p.seqId !== seqId || p.id !== i + 1) m.set(p, { seqId, id: i + 1 }); }));
  return m;
}
const tookShots = (moves) => [...moves.keys()].filter((p) => p.id && CS.takesOf(p.seqId, p.id).length);
CS.renumberPlans = async function (seqId, order) {
  const m = movesFor([{ seqId, order }]);
  if (!m.size) return true;
  if (!(await CS.confirmRenumber(tookShots(m).length > 0))) return false;
  CS.applyMoves(m);
  return true;
};

function contiguousFrom(ids, start) { const run = []; for (let n = start; ids.includes(n); n++) run.push(n); return run; }
function shiftSeq(n, d) {
  S().sequences.find((s) => s.id === n).id = n + d;
  S().plans.forEach((p) => { if (p.seqId === n) p.seqId = n + d; });
  S().takes.forEach((t) => { if (t.seqId === n) t.seqId = n + d; });
  S().tournageList.forEach((i) => { if (i.type === "plan" && i.seqId === n) i.seqId = n + d; });
  if (CS.active && CS.active.seqId === n) CS.active.seqId = n + d;
}

// Nouvelle séquence après la séquence afterId (0 = en tête) ; renvoie son numéro
CS.insertSeq = async function (afterId) {
  const id = (afterId || 0) + 1;
  const run = contiguousFrom(S().sequences.map((s) => s.id), id);
  if (run.length && !(await CS.confirmRenumber(S().takes.some((t) => run.includes(t.seqId))))) return null;
  [...run].reverse().forEach((n) => shiftSeq(n, 1));
  S().sequences.push({ id, info: "" });
  CS.lastShift = { seqs: run.map((n) => n + 1) };
  CS.commit();
  return id;
};
// Nouveau plan au rang pos (0 = premier) de la séquence ; renvoie le plan
CS.insertPlan = async function (seqId, pos) {
  const plans = CS.plansOf(seqId);
  pos = Math.max(0, Math.min(pos, plans.length));
  const prev = pos > 0 ? plans[pos - 1] : null;
  const np = { seqId, id: 0, impro: 0, info: "", temps: "", video: null };
  const order = [...plans];
  order.splice(pos, 0, np);
  if (!(await CS.renumberPlans(seqId, order))) return null;
  S().plans.push(np);
  const prevIdx = prev ? CS.orderIndex(prev) : -1;
  S().tournageList.splice(prevIdx === -1 ? S().tournageList.length : prevIdx + 1, 0, { type: "plan", seqId, planId: np.id });
  CS.commit();
  return np;
};
// Changer le numéro d'une séquence : "" = fait, texte = erreur, null = annulé
CS.setSeqNum = async function (oldId, str) {
  const newId = parseInt(str, 10);
  if (newId === oldId) return "";
  if (isNaN(newId) || newId <= 0) return "Numéro invalide.";
  if (CS.seq(newId)) return "La séquence " + newId + " existe déjà.";
  if (!(await CS.confirmRenumber(S().takes.some((t) => t.seqId === oldId)))) return null;
  shiftSeq(oldId, newId - oldId);
  CS.commit();
  return "";
};
// Déplacer un plan à « séquence.plan » (ex. 2.3) : les plans des deux séquences se renumérotent.
// "" = fait, texte = erreur à afficher, null = annulé.
CS.movePlanTo = async function (p, str) {
  str = String(str || "").trim();
  const m = str.match(/^(\d+)\s*[.,\-\/ ]\s*(\d+)$/) || str.match(/^(\d+)$/);
  if (!m) return "Écrivez le nouveau numéro sous la forme séquence.plan, par exemple 2.3.";
  const seqId = m[2] ? +m[1] : p.seqId;
  let pos = m[2] ? +m[2] : +m[1];
  if (pos < 1) return "Numéro invalide.";
  if (!CS.seq(seqId)) return "La séquence " + seqId + " n'existe pas encore.";
  const same = seqId === p.seqId;
  const src = CS.plansOf(p.seqId).filter((x) => x !== p);
  const dst = same ? src : CS.plansOf(seqId);
  pos = Math.min(pos, dst.length + 1);
  if (same && pos === p.id) return "";
  const order = [...dst];
  order.splice(pos - 1, 0, p);
  const moves = movesFor(same ? [{ seqId, order }] : [{ seqId: p.seqId, order: src }, { seqId, order }]);
  const shot = tookShots(moves), target = seqId + "." + pos;
  if (shot.length) {
    if (!(await CS.ask("Des prises ont déjà été tournées",
      "Ce changement modifie le numéro de plans déjà tournés (" + shot.map(CS.key).join(", ") + ") : leur clap garde l'ancien numéro, la synchronisation au montage ne les retrouvera plus.",
      "Déplacer quand même", true))) return null;
  } else if (pos <= dst.length) {
    if (!(await CS.ask("Le plan " + target + " existe déjà",
      "Placer " + CS.key(p) + " en " + target + " et décaler les suivants (" + target + " devient " + seqId + "." + (pos + 1) + "…) ?",
      "Décaler et placer"))) return null;
  }
  CS.applyMoves(moves);
  CS.commit();
  return "";
};
CS.deleteSeq = function (seqId) {
  S().sequences = S().sequences.filter((s) => s.id !== seqId);
  S().plans = S().plans.filter((p) => p.seqId !== seqId);
  S().takes = S().takes.filter((t) => t.seqId !== seqId);
  S().tournageList = S().tournageList.filter((i) => !(i.type === "plan" && i.seqId === seqId));
  if (CS.active && CS.active.seqId === seqId) CS.active = null;
  CS.commit();
};
CS.deletePlan = async function (seqId, planId) {
  S().plans = S().plans.filter((p) => !(p.seqId === seqId && p.id === planId));
  S().takes = S().takes.filter((t) => !(t.seqId === seqId && t.planId === planId));
  S().tournageList = S().tournageList.filter((i) => !(i.type === "plan" && i.seqId === seqId && i.planId === planId));
  if (CS.active && CS.active.seqId === seqId && CS.active.planId === planId) CS.active = null;
  await CS.renumberPlans(seqId, CS.plansOf(seqId));
  CS.commit();
};
CS.insertDay = function (at, text) { S().tournageList.splice(at, 0, { type: "sep", text: text || "" }); CS.commit(); return at; };
CS.deleteDay = function (index) { S().tournageList.splice(index, 1); CS.commit(); };
CS.moveItem = function (from, at) {
  const item = S().tournageList.splice(from, 1)[0];
  const to = at > from ? at - 1 : at;
  S().tournageList.splice(to, 0, item);
  CS.commit();
  return to;
};
CS.moveDay = function (from, at) {
  const end = CS.dayEnd(from);
  if (at >= from && at <= end) return from;
  const block = S().tournageList.splice(from, end - from);
  const to = at > from ? at - block.length : at;
  S().tournageList.splice(to, 0, ...block);
  CS.commit();
  return to;
};
// Plan improvisé : numéroté en fin de séquence, placé dans l'ordre de tournage en « at » (ou après le plan actif)
CS.addImpro = function (seqId, at, info) {
  const id = CS.plansOf(seqId).reduce((m, p) => Math.max(m, p.id), 0) + 1;
  const p = { seqId, id, impro: 1, info: info || "", temps: "", video: null };
  S().plans.push(p);
  if (at === null || at === undefined) {
    const a = CS.activePlan();
    at = a ? CS.orderIndex(a) + 1 : S().tournageList.length;
  }
  S().tournageList.splice(at, 0, { type: "plan", seqId, planId: id });
  CS.active = { seqId, planId: id };
  CS.commit();
  return p;
};
// Enregistre une prise sur le plan actif (confirmation visuelle + Annuler)
CS.saveTake = function (avis, com) {
  const p = CS.activePlan();
  if (CS.readOnly || !p) return null;
  CS.saveNow();
  const t = { uid: newUid(), seqId: p.seqId, planId: p.id, prise: CS.nextTake(p.seqId, p.id), avis, com: (com || "").trim(), timestamp: new Date().toISOString() };
  S().takes.push(t);
  CS.commit();
  CS.toast("Prise " + t.prise + " enregistrée · " + avis, () => { S().takes = S().takes.filter((x) => x.uid !== t.uid); CS.commit(); });
  return t;
};
CS.deleteTake = function (uid) { S().takes = S().takes.filter((t) => t.uid !== uid); CS.commit(); };
// Vidéo de référence : choisie dans Google Drive (sélecteur de One App) → { id, name, thumb }
CS.pickVideo = async function (p) {
  if (CS.readOnly) return;
  CS.saveNow();
  let file;
  try { file = await OneAppAPI.pickDriveFile({ type: "video" }); }
  catch (e) { return CS.toast(e.message || "Impossible d'ouvrir Google Drive."); }
  if (!file) return;
  p.video = { id: file.id, name: file.name || "Vidéo", thumb: file.thumb || null };
  CS.commit();
  CS.toast("Vidéo de référence ajoutée au plan " + CS.key(p));
};
CS.videoLink = (v) => (OneAppAPI.driveFileLink ? OneAppAPI.driveFileLink(v.id) : "https://drive.google.com/file/d/" + encodeURIComponent(v.id) + "/view");
// Vignette de la vidéo : ouvre sa fenêtre (miniature, lecture dans Google Drive, changer, retirer)
CS.videoChip = function (p, extra) {
  const v = p.video;
  return CS.el("button", { class: "vid", type: "button", title: v.name, style: extra || null,
      onclick: (e) => { e.stopPropagation(); CS.previewVideo(p); } },
    v.thumb ? CS.el("img", { src: v.thumb, alt: "" }) : CS.el("i", { text: "▶" }), CS.el("span", { text: v.name }));
};
// Fenêtre de la vidéo : ▶ ouvre la vidéo dans l'app Google Drive (hors-ligne si elle y est disponible)
CS.previewVideo = function (p) {
  const v = p.video;
  CS.modal("Plan " + CS.key(p) + " · vidéo de référence", (close) => [
    CS.el("a", { class: "cs-video", href: CS.videoLink(v), target: "_blank", rel: "noopener", "aria-label": "Lire la vidéo dans Google Drive",
        style: v.thumb ? "background-image:url(" + JSON.stringify(v.thumb) + ")" : null },
      CS.el("span", { class: "play", text: "▶" })),
    CS.el("p", { class: "cs-vname", text: v.name }),
    CS.el("p", { class: "cs-vhint", text: "▶ ouvre la vidéo dans Google Drive." }),
    CS.el("div", { class: "cs-actions" },
      CS.readOnly ? null : CS.el("button", { class: "cs-btn danger", type: "button", text: "Retirer", onclick: () => { close(); CS.removeVideo(p); } }),
      CS.readOnly ? null : CS.el("button", { class: "cs-btn", type: "button", text: "Changer", onclick: () => { close(); CS.pickVideo(p); } }),
      CS.el("button", { class: "cs-btn primary", type: "button", text: "Fermer", onclick: close }))
  ]);
};
// Prises d'un plan : liste, et suppression (avec avertissement)
CS.takesDialog = function (p) {
  CS.modal("Plan " + CS.key(p) + " · prises", (close) => {
    const list = CS.el("div", { class: "cs-takes" });
    const fill = () => {
      const takes = CS.takesOf(p.seqId, p.id);
      list.replaceChildren(...(takes.length ? takes.map((t) => CS.el("div", { class: "cs-take", style: "--av:var(--av-" + CS.avisKey(t.avis) + ")" },
        CS.el("b", { text: "Prise " + t.prise }),
        CS.el("div", { class: "cs-take-main" }, CS.el("span", { text: t.avis }),
          t.com ? CS.el("small", { text: t.com }) : null,
          t.timestamp ? CS.el("small", { class: "when", text: new Date(t.timestamp).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }) : null),
        CS.readOnly ? null : CS.el("button", { class: "cs-del", type: "button", "aria-label": "Supprimer la prise " + t.prise, title: "Supprimer la prise " + t.prise, text: "🗑",
          onclick: async () => {
            const ok = await CS.ask("Supprimer la prise " + t.prise + " ?",
              "Son avis et son commentaire seront effacés. Les autres prises gardent leur numéro (leur clap a déjà été joué). Au montage, un rush de cette prise ne retrouvera plus ses notes.",
              "Supprimer la prise", true);
            if (ok) { CS.deleteTake(t.uid); fill(); }
          } })))
        : [CS.el("p", { class: "empty", text: "Pas encore de prise." })]));
    };
    fill();
    return [list, CS.el("div", { class: "cs-actions" }, CS.el("button", { class: "cs-btn primary", type: "button", text: "Fermer", onclick: close }))];
  });
};
CS.removeVideo = function (p) { p.video = null; CS.commit(); };

// --- ÉLÉMENTS D'INTERFACE ---
CS.el = function (tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  children.flat(Infinity).forEach((c) => { if (c !== null && c !== undefined && c !== false) e.append(c); });
  return e;
};
const el = CS.el;
CS.autoResize = (t) => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
// Texte modifiable sur place, enregistré après une pause
CS.textField = function (obj, key, placeholder, cls, single) {
  const f = el(single ? "input" : "textarea", {
    class: "cs-edit " + (cls || ""), placeholder: CS.readOnly ? "" : placeholder, value: obj[key] || "", readonly: CS.readOnly, rows: single ? null : 1,
    "aria-label": placeholder, type: single ? "text" : null,
    oninput: (e) => { obj[key] = e.target.value; if (!single) CS.autoResize(e.target); CS.saveSoon(); },
    onchange: CS.saveNow
  });
  if (!single) requestAnimationFrame(() => CS.autoResize(f));
  return f;
};
let toastTimer = null;
CS.toast = function (msg, undo) {
  clearTimeout(toastTimer);
  document.querySelectorAll(".cs-toast").forEach((t) => t.remove());
  const t = el("div", { class: "cs-toast", role: "status" }, el("span", { text: msg }),
    undo ? el("button", { type: "button", text: "Annuler", onclick: () => { undo(); t.remove(); } }) : null);
  document.body.append(t);
  toastTimer = setTimeout(() => t.remove(), undo ? 6000 : 3500);
};
CS.modal = function (title, build) {
  const close = () => back.remove();
  const back = el("div", { class: "cs-modal-back", onclick: (e) => { if (e.target === back) close(); } },
    el("div", { class: "cs-modal", role: "dialog", "aria-label": title }, title ? el("h3", { text: title }) : null, build(close)));
  document.body.append(back);
  const first = back.querySelector("input");
  if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 30);
  return close;
};
CS.ask = (title, message, okLabel, danger) => new Promise((resolve) => {
  CS.modal(title, (close) => [
    el("p", { text: message }),
    el("div", { class: "cs-actions" },
      el("button", { class: "cs-btn", type: "button", text: "Annuler", onclick: () => { close(); resolve(false); } }),
      el("button", { class: "cs-btn " + (danger ? "danger" : "primary"), type: "button", text: okLabel || "Continuer", onclick: () => { close(); resolve(true); } }))
  ]);
});
// Saisie d'un numéro dans une petite fenêtre (séquence ou plan)
CS.askNumber = function (title, value, hint, apply) {
  CS.modal(title, (close) => {
    const err = el("p", { class: "cs-error", hidden: true });
    const input = el("input", { class: "cs-input", type: "number", inputmode: "numeric", min: "1", value: String(value), "aria-label": title });
    const go = async () => {
      const r = await apply(input.value);
      if (r === "" || r === null) close();
      else { err.textContent = r; err.hidden = false; input.focus(); }
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    return [hint ? el("p", { text: hint }) : null, input, err,
      el("div", { class: "cs-actions" },
        el("button", { class: "cs-btn", type: "button", text: "Annuler", onclick: close }),
        el("button", { class: "cs-btn primary", type: "button", text: "Valider", onclick: go }))];
  });
};
// Choix de la séquence d'un plan improvisé
CS.improDialog = function (defaultSeq, at, after) {
  const seqs = CS.seqs();
  if (!seqs.length) return;
  let seqId = defaultSeq !== null && defaultSeq !== undefined && CS.seq(defaultSeq) ? defaultSeq : seqs[0].id;
  CS.modal("⚡ Plan improvisé", (close) => {
    const chips = el("div", { class: "cs-chips" });
    const info = el("p");
    const desc = el("input", { class: "cs-input", type: "text", placeholder: "Ce qu'on tourne (facultatif)", "aria-label": "Description du plan improvisé" });
    const go = el("button", { class: "cs-btn impro", type: "button" });
    const refresh = () => {
      chips.replaceChildren(...seqs.map((s) => el("button", { class: "cs-chip" + (s.id === seqId ? " on" : ""), type: "button", text: "SÉQ " + s.id, onclick: () => { seqId = s.id; refresh(); } })));
      const n = seqId + "." + (CS.plansOf(seqId).length + 1);
      info.textContent = "Numéroté " + n + ", à la fin de la séquence " + seqId + " : les autres plans gardent leur numéro.";
      go.textContent = "Créer " + n;

  });
};

// --- GLISSER (bouton flottant ou poignée) ---
// opt.resolve(x, y, under) renvoie { rect, before, text, run, into, hoverKey, hoverOpen } ou null.
let drag = null;
CS.dragging = () => !!drag;
CS.beginDrag = function (e, opt) {
  if (CS.readOnly || (e.button !== undefined && e.button !== 0)) return;

<script>

}

// ---------- BOUTONS DE CRÉATION : à glisser ----------
function renderAdders() {
  const box = $("adders");

  const B = (label, cls, opt) => {
    const b = el("button", { class: "adder " + cls, type: "button", text: label, title: "Maintenez et glissez dans la liste", onpointerdown: (e) => CS.beginDrag(e, { ...opt, onTap: () => nudge(b, label) }) });

// Un simple appui ne crée rien : le bouton bouge et un message explique le geste
let hintTimer = null;
function nudge(btn, label) {
  btn.classList.remove("wiggle"); void btn.offsetWidth; btn.classList.add("wiggle");

  const h = el("div", { class: "drag-hint", role: "status", text: "Maintenez « " + label + " » et faites-le glisser dans la liste, à l'endroit voulu." });
  document.body.append(h);

}
const topInset = () => $("stick").offsetHeight;
const bottomInset = () => 70;
