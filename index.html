<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One App</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* --- VARIABLES CSS (Gestion automatique Clair/Sombre) --- */
        :root {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #d2d2d7;
            --accent-color: #0071e3;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --surface-color: #1c1c1e;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --border-color: #38383a;
                --shadow: 0 4px 24px rgba(0,0,0,0.4);
            }
        }

        /* --- STYLES GLOBAUX --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .app-container {
            background-color: var(--surface-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            margin: 20px;
        }

        .logo-svg {
            color: var(--accent-color);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin: 0 0 32px 0;
        }

        /* --- VUES --- */
        #authenticated-view {
            display: none; /* Masqué par défaut */
        }

        .empty-state {
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 16px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            margin-top: 24px;
        }

        /* Conteneur pour centrer le bouton Google */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="unauthenticated-view" class="app-container">
        <svg class="logo-svg" viewBox="0 0 24 24" width="64" height="64">
            <path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
        </svg>
        
        <h1>One App</h1>
        <p class="subtitle">Votre Personal Cloud</p>

        <div id="g_id_onload"
             data-client_id="1053233256059-m7f20fggtrdl7utd8hpanr5vsb49i3vk.apps.googleusercontent.com" 
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-btn-wrapper">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <div id="authenticated-view" class="app-container">
        <svg class="logo-svg" viewBox="0 0 24 24" width="48" height="48">
            <path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>

        <h1 id="user-greeting">Bonjour !</h1>
        <p class="subtitle" id="user-email">email@google.com</p>

        <div class="empty-state">
            Aucune One App installée.
        </div>
    </div>

    <script>
        // Cette fonction est appelée automatiquement par Google une fois la connexion réussie
        function handleCredentialResponse(response) {
            // response.credential contient le jeton d'accès (JWT) chiffré par Google
            
            // 1. On déchiffre le jeton pour récupérer le nom et l'email
            const responsePayload = decodeJwtResponse(response.credential);
            
            // 2. On met à jour l'interface avec les données de l'utilisateur
            document.getElementById('user-greeting').innerText = "Bonjour, " + responsePayload.given_name;
            document.getElementById('user-email').innerText = responsePayload.email;
            
            // 3. On bascule l'affichage : on cache la vue déconnectée, on affiche la vue connectée
            document.getElementById('unauthenticated-view').style.display = 'none';
            document.getElementById('authenticated-view').style.display = 'block';

            // Plus tard : C'est ici que nous coderons la lecture de l'URL pour charger un .oneapp
        }

        // Fonction utilitaire pour lire le jeton Google (Standard de l'industrie)
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
