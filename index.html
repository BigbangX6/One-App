<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One App - Personal Cloud</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* --- VARIABLES CSS (Thème clair et sombre automatique) --- */
        :root {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #d2d2d7;
            --accent-color: #8b5cf6; /* Violet vibrant (fini le bleu Microsoft) */
            --accent-hover: #7c3aed;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --surface-color: #1c1c1e;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --border-color: #38383a;
                --shadow: 0 4px 24px rgba(0,0,0,0.4);
            }
        }

        /* --- STYLES GLOBAUX --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .app-container {
            background-color: var(--surface-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            margin: 20px;
        }

        .logo-svg {
            color: var(--accent-color);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin: 0 0 32px 0;
        }

        /* --- VUES --- */
        #authenticated-view {
            display: none; /* Masqué par défaut tant que l'utilisateur n'est pas connecté */
            text-align: left;
        }

        .empty-state {
            padding: 30px 20px;
            color: var(--text-secondary);
            font-size: 15px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* Styles pour la vue connectée (Profil et liste) */
        .user-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .user-info h2 {
            font-size: 16px;
            margin: 0;
        }

        .user-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div id="unauthenticated-view" class="app-container">
        <svg class="logo-svg" viewBox="0 0 24 24" width="64" height="64">
            <path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
        </svg>
        
        <h1>One App</h1>
        <p class="subtitle">Votre Personal Cloud décentralisé</p>

        <div id="g_id_onload"
             data-client_id="TON_CLIENT_ID_ICI.apps.googleusercontent.com" 
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-btn-wrapper">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <div id="authenticated-view" class="app-container">
        <div class="user-header">
            <svg class="logo-svg" viewBox="0 0 24 24" width="36" height="36" style="margin:0;">
                <path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <div class="user-info">
                <h2 id="user-greeting">Mon Compte</h2>
                <p id="user-email">email@google.com</p>
            </div>
        </div>

        <div class="section-title">Espace de travail</div>
        <div class="empty-state">
            Aucune One App installée pour le moment.
        </div>
    </div>

    <script>
        // Fonction appelée automatiquement par Google lors de la connexion réussie
        function handleCredentialResponse(response) {
            // 1. Décodage du jeton JWT renvoyé par Google pour récupérer les infos de l'utilisateur
            const responsePayload = decodeJwtResponse(response.credential);
            
            // 2. Mise à jour dynamique de l'interface
            document.getElementById('user-greeting').innerText = responsePayload.name || responsePayload.given_name;
            document.getElementById('user-email').innerText = responsePayload.email;
            
            // 3. Bascule des vues (Single Page Application)
            document.getElementById('unauthenticated-view').style.display = 'none';
            document.getElementById('authenticated-view').style.display = 'block';

            // Prochaine étape : Analyser l'URL (ex: ?id=...) et interroger l'API Drive ici
            checkUrlForSharedFile();
        }

        // Utilitaire standard pour décoder le jeton de sécurité Google
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Vérification de l'URL pour la gestion du "Lien Magique" (?id=...)
        function checkUrlForSharedFile() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');
            if (fileId) {
                console.log("Lien magique détecté ! ID du fichier cible :", fileId);
                // Ici, le Moteur déclenchera plus tard le téléchargement du .onefile via l'API Drive
            }
        }
    </script>
</body>
</html>
