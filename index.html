<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One App - Personal Cloud</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js"></script>

    <style>
        /* --- VARIABLES CSS --- */
        :root {
            --bg-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #d2d2d7;
            --accent-color: #8b5cf6; 
            --accent-hover: #7c3aed;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --surface-color: #1c1c1e;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --border-color: #38383a;
                --shadow: 0 4px 24px rgba(0,0,0,0.4);
            }
        }

        /* --- STYLES GLOBAUX --- */
        body, html {
            margin: 0;
            padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-color); color: var(--text-primary);
            display: flex; justify-content: center; align-items: flex-start;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding-top: 40px; box-sizing: border-box;
        }

        .app-container {
            background-color: var(--surface-color);
            border-radius: 20px;
            box-shadow: var(--shadow); padding: 40px; width: 100%; max-width: 600px;
            border: 1px solid var(--border-color); box-sizing: border-box;
        }

        /* --- VUES --- */
        #unauthenticated-view { text-align: center; }
        #authenticated-view { display: none; }
        
        .logo-svg { color: var(--accent-color); margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px 0; }
        p.subtitle { color: var(--text-secondary); font-size: 15px; margin: 0 0 32px 0; }

        .custom-btn {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 12px; width: 100%;
            transition: background 0.2s;
        }
        .custom-btn:hover { background-color: var(--bg-color); }
        
        .primary-btn {
            background-color: var(--accent-color);
            color: white; border: none;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .primary-btn:hover { background-color: var(--accent-hover); }

        .loader { display: none; color: var(--accent-color); margin-top: 15px; font-weight: bold; text-align: center;}

        /* --- TABLEAU DE BORD --- */
        .user-header {
            display: flex;
            align-items: center; gap: 12px; margin-bottom: 24px;
            padding-bottom: 16px; border-bottom: 1px solid var(--border-color);
        }
        .user-info h2 { font-size: 16px; margin: 0; }
        .user-info p { font-size: 13px; color: var(--text-secondary); margin: 0; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin: 0;}

        /* Grille des applications */
        #app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px; margin-bottom: 24px;
        }
        .app-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px 10px; text-align: center; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
        }
        .app-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent-color); }
        .app-card svg { color: var(--accent-color); margin-bottom: 10px; }
        .app-card span { display: block; font-size: 13px; font-weight: 600; }

        /* Sous-menu App (Espace de travail) */
        .app-submenu { grid-column: 1 / -1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: none; flex-direction: column; gap: 15px; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .submenu-header { display: flex; gap: 10px; }
        .submenu-search { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--surface-color); color: var(--text-primary); outline: none; }
        .submenu-search:focus { border-color: var(--accent-color); }
        .file-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .file-item { display: flex; align-items: center; padding: 10px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: 0.1s; }
        .file-item:hover { border-color: var(--accent-color); }
        .file-item-name { flex: 1; font-size: 14px; font-weight: 500; }
        .file-item-date { font-size: 11px; color: var(--text-secondary); }

        /* Modal d'installation */
        #install-section {
            display: none;
            background: var(--bg-color); padding: 20px; border-radius: 12px;
            border: 1px solid var(--border-color); margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 150px; background: var(--surface-color); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 10px;
            font-family: monospace; font-size: 12px; resize: vertical; margin-bottom: 10px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="unauthenticated-view" class="app-container">
        <svg class="logo-svg" viewBox="0 0 24 24" width="64" height="64"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        <h1>One App</h1>
        <p class="subtitle">Votre Personal Cloud décentralisé</p>
        <button class="custom-btn" onclick="authorizeAndConnect()">Se connecter avec Google Drive</button>
    </div>

    <div id="authenticated-view" class="app-container">
        <div class="user-header">
            <svg class="logo-svg" viewBox="0 0 24 24" width="36" height="36" style="margin:0;"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
            <div class="user-info">
                <h2 id="user-greeting">Mon Compte</h2>
                <p id="user-email">Chargement...</p>
            </div>
        </div>

        <div class="header-actions">
            <div class="section-title">Mes Applications</div>
            <button class="primary-btn" onclick="toggleInstallSection()">+ Installer</button>
        </div>

        <div id="app-grid">
            </div>
        <div id="loading-apps" class="loader" style="display:block;">Recherche de vos One Apps...</div>

        <div id="install-section">
            <div class="section-title" style="margin-bottom: 10px;">Coller le manifeste (.oneapp)</div>
            <textarea id="json-input" placeholder='{"app_metadata": {"name": "Super Block Note"...}}'></textarea>
            <button class="primary-btn" onclick="installAppFromJson()" style="width:100%;">Créer l'Application</button>
            <div id="install-loader" class="loader">Création du dossier et du fichier en cours...</div>
        </div>
    </div>

    <div id="execution-view" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-color); z-index: 1000; flex-direction: column;">
        <header style="background: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); box-shadow: var(--shadow);">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="color: var(--accent-color);"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
                <h2 id="running-app-title" style="margin: 0; font-size: 18px;">Application</h2>
            </div>
            <button class="custom-btn" onclick="closeApp()" style="width: auto; padding: 8px 16px; border-color: #ef4444; color: #ef4444;">Fermer l'App</button>
        </header>
        <div id="iframe-container" style="flex: 1; overflow: hidden; background: #fff;">
            </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Sécurisation : On vérifie que config.js a bien été chargé
        const CLIENT_ID = (typeof ONEAPP_CONFIG !== 'undefined') ? ONEAPP_CONFIG.GOOGLE_CLIENT_ID : null;
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        const DRIVE_API_URL = "https://www.googleapis.com/drive/v3/files";
        const UPLOAD_API_URL = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";

        let tokenClient;
        let globalAccessToken;
        let rootFolderId = null; // Stocke l'ID du dossier racine "One App"

        // 1. Initialisation Google OAuth (Sécurisée et persistante)
        window.onload = function() {
            const savedToken = localStorage.getItem('oneapp_gdrive_token');
            const savedExpire = localStorage.getItem('oneapp_gdrive_expire');

            if (savedToken && savedExpire) {
                if (Date.now() < parseInt(savedExpire)) {
                    console.log("Jeton Drive actif trouvé !");
                    globalAccessToken = savedToken;
                    document.getElementById('unauthenticated-view').style.display = 'none';
                    document.getElementById('authenticated-view').style.display = 'block';
                    document.getElementById('user-email').innerText = "Connecté à Google Drive (Session active)";
                    initializeAppSystem();
                } else {
                    console.log("Jeton expiré. Changement de l'interface.");
                    document.querySelector('#unauthenticated-view .subtitle').innerText = "Votre session de sécurité (1h) a expiré.";
                    document.querySelector('#unauthenticated-view button').innerHTML = "Renouveler la session en 1 clic";
                }
            }
        };

        function authorizeAndConnect() {
            if (!CLIENT_ID) {
                alert("Erreur : Le fichier config.js est introuvable ou mal écrit. Videz le cache de votre navigateur (Hard Reload).");
                return;
            }
            if (typeof google === 'undefined') {
                alert("Erreur : Le script Google ne s'est pas chargé. Désactivez votre bloqueur de publicités ou vérifiez votre connexion.");
                return;
            }

            if (!tokenClient) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            globalAccessToken = tokenResponse.access_token;
                            
                            // Sauvegarde du jeton en local (Il est valide 1 heure)
                            const expireTime = Date.now() + (tokenResponse.expires_in * 1000);
                            localStorage.setItem('oneapp_gdrive_token', globalAccessToken);
                            localStorage.setItem('oneapp_gdrive_expire', expireTime.toString());

                            document.getElementById('unauthenticated-view').style.display = 'none';
                            document.getElementById('authenticated-view').style.display = 'block';
                            document.getElementById('user-email').innerText = "Connecté à Google Drive";
                            
                            initializeAppSystem();
                        }
                    }
                });
            }
            
            // On retire le "prompt: 'consent'" forcé. 
            // Si l'utilisateur a déjà consenti par le passé, Google renouvellera le jeton de manière quasi-invisible.
            tokenClient.requestAccessToken();
        }

        // --- LOGIQUE DU MOTEUR (Système de Fichiers) ---

        async function initializeAppSystem() {
            // 1. Trouver ou créer le dossier racine
            rootFolderId = await getOrCreateFolder("One App", "root");
            // 2. Lister les applications
            await listInstalledApps();
        }

        // Utilitaire : Trouver ou créer un dossier
        async function getOrCreateFolder(folderName, parentId) {
            const query = encodeURIComponent(`name = '${folderName}' and mimeType = 'application/vnd.google-apps.folder' and '${parentId}' in parents and trashed = false`);
            let response = await fetch(`${DRIVE_API_URL}?q=${query}`, { headers: { 'Authorization': `Bearer ${globalAccessToken}` }});
            let data = await response.json();
            
            if (data.files && data.files.length > 0) {
                return data.files[0].id; // Dossier trouvé
            } else {
                // Création du dossier
                const metadata = { name: folderName, mimeType: "application/vnd.google-apps.folder", parents: [parentId] };
                let createRes = await fetch(DRIVE_API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${globalAccessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(metadata)
                });
                let newFolder = await createRes.json();
                return newFolder.id;
            }
        }

        // Chercher tous les fichiers .oneapp dans le Drive de l'utilisateur
        async function listInstalledApps() {
            document.getElementById('loading-apps').style.display = 'block';
            document.getElementById('app-grid').innerHTML = '';
            if(activeSubmenu) activeSubmenu = null; // Reset submenu state

            // On cherche les .oneapp ET on récupère leur dossier parent (parents)
            const query = encodeURIComponent("name contains '.oneapp' and trashed = false");
            let response = await fetch(`${DRIVE_API_URL}?q=${query}&fields=files(id, name, parents)`, { 
                headers: { 'Authorization': `Bearer ${globalAccessToken}` }
            });
            let data = await response.json();
            
            document.getElementById('loading-apps').style.display = 'none';

            if (data.files && data.files.length > 0) {
                data.files.forEach(file => {
                    let displayName = file.name.replace('.oneapp', '');
                    let parentFolderId = file.parents ? file.parents[0] : null;
                    let card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
                        <span>${displayName}</span>
                    `;
                    // Le clic ouvre désormais le sous-menu de l'Espace de travail
                    card.onclick = () => toggleAppMenu(card, file.id, displayName, parentFolderId);
                    document.getElementById('app-grid').appendChild(card);
                });
            } else {
                document.getElementById('app-grid').innerHTML = '<p style="grid-column: 1 / -1; color: var(--text-secondary); text-align:center; padding: 20px; border: 1px dashed var(--border-color); border-radius: 8px;">Aucune application trouvée.</p>';
            }
        }

        let activeSubmenu = null;

        async function toggleAppMenu(cardElement, appFileId, appName, appFolderId) {
            // Fermer si déjà ouvert sur la même app
            if (activeSubmenu && activeSubmenu.dataset.appId === appFileId) {
                activeSubmenu.remove();
                activeSubmenu = null;
                return;
            }
            if (activeSubmenu) activeSubmenu.remove();

            const submenu = document.createElement('div');
            submenu.className = 'app-submenu';
            submenu.dataset.appId = appFileId;
            submenu.dataset.appName = appName;
            submenu.dataset.folderId = appFolderId;
            submenu.style.display = 'flex';

            submenu.innerHTML = `
                <div style="font-weight:bold; color:var(--accent-color);">${appName} - Fichiers</div>
                <div class="submenu-header">
                    <input type="text" id="submenu-search" class="submenu-search" placeholder="Rechercher un fichier...">
                    <button class="primary-btn" onclick="createNewFile('${appFileId}', '${appName.replace(/'/g, "\\'")}', '${appFolderId}')">+ Nouveau</button>
                </div>
                <div class="loader" id="submenu-loader" style="display:block; margin-top:5px;">Chargement des fichiers récents...</div>
                <div class="file-list" id="submenu-file-list"></div>
            `;

            document.getElementById('app-grid').appendChild(submenu);
            activeSubmenu = submenu;

            // Fonctionnalité de recherche (Filtre visuel)
            document.getElementById('submenu-search').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.file-item').forEach(item => {
                    const name = item.querySelector('.file-item-name').innerText.toLowerCase();
                    item.style.display = name.includes(term) ? 'flex' : 'none';
                });
            });

            loadAppFiles(appFolderId, appFileId, appName);
        }

        async function loadAppFiles(folderId, appFileId, appName) {
            // Recherche des .onefile dans le dossier de cette application spécifique
            const query = encodeURIComponent(`'${folderId}' in parents and name contains '.onefile' and trashed = false`);
            try {
                let response = await fetch(`${DRIVE_API_URL}?q=${query}&fields=files(id, name, modifiedTime)&orderBy=modifiedTime desc`, {
                    headers: { 'Authorization': `Bearer ${globalAccessToken}` }
                });
                let data = await response.json();
                
                const listContainer = document.getElementById('submenu-file-list');
                document.getElementById('submenu-loader').style.display = 'none';

                if (data.files && data.files.length > 0) {
                    data.files.forEach(f => {
                        let dateObj = new Date(f.modifiedTime);
                        let dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        let fName = f.name.replace('.onefile', '');
                        
                        let item = document.createElement('div');
                        item.className = 'file-item';
                        item.innerHTML = `<div class="file-item-name">${fName}</div><div class="file-item-date">${dateStr}</div>`;
                        item.onclick = () => openAppEnvironment(appFileId, appName, f.id, fName);
                        listContainer.appendChild(item);
                    });
                } else {
                    listContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:13px; padding:10px;">Aucun fichier récent. Créez-en un nouveau !</div>';
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function createNewFile(appFileId, appName, folderId) {
            let fileName = prompt("Nom du nouveau fichier :");
            if (!fileName || fileName.trim() === "") return;

            document.getElementById('submenu-loader').style.display = 'block';
            
            // Création du JSON .onefile vierge standardisé
            const newOneFile = {
                oneapp_metadata: {
                    app_name: appName,
                    source_app_drive_id: appFileId,
                    version_timestamp: new Date().toISOString()
                },
                app_data: []
            };

            const fullFileName = `${fileName}.onefile`;
            const boundary = '-------314159265358979323846';
            const delimiter = "\r\n--" + boundary + "\r\n";
            const close_delim = "\r\n--" + boundary + "--";

            const metadata = { name: fullFileName, mimeType: "application/json", parents: [folderId] };
            const multipartRequestBody =
                delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata) +
                delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(newOneFile) + close_delim;

            try {
                let response = await fetch(UPLOAD_API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${globalAccessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
                    body: multipartRequestBody
                });
                let createdFile = await response.json();
                // Ouverture immédiate de l'application avec ce nouveau fichier
                openAppEnvironment(appFileId, appName, createdFile.id, fileName);
            } catch(e) {
                console.error(e);
                alert("Erreur lors de la création du fichier sur Drive.");
            }
        }

        // --- LE PONT DE COMMUNICATION ET LE SANDBOX (ABSTRACTION OS) ---
        const apiBridgeScript = "window.OneAppAPI = { loadData: function() { return new Promise((resolve) => { const listener = (event) => { if(event.data.type === 'LOAD_DATA_RESPONSE') { window.removeEventListener('message', listener); resolve(event.data.payload); } }; window.addEventListener('message', listener); window.parent.postMessage({ type: 'LOAD_DATA_REQUEST' }, '*'); }); }, saveData: function(data) { window.parent.postMessage({ type: 'SAVE_DATA_REQUEST', payload: data }, '*'); }, askGemini: function(promptText) { window.parent.postMessage({ type: 'ASK_GEMINI_REQUEST', payload: promptText }, '*'); } };";

        let currentRunningApp = null;
        let currentActiveOneFileId = null;
        let currentOneFileMetadata = null;

        // Le "Gardien" du Moteur : Écoute les requêtes du Sandbox
        window.addEventListener('message', async (event) => {
            if (!document.querySelector('#iframe-container iframe') || event.source !== document.querySelector('#iframe-container iframe').contentWindow) return;

            if (event.data.type === 'LOAD_DATA_REQUEST') {
                console.log("MOTEUR : L'application demande ses données.");
                // Le Moteur injecte les données du .onefile précédemment téléchargé
                event.source.postMessage({
                    type: 'LOAD_DATA_RESPONSE',
                    payload: { readOnly: false, app_data: window.currentLoadedAppData || [] }
                }, '*');
            } 
            else if (event.data.type === 'SAVE_DATA_REQUEST') {
                console.log("MOTEUR : Demande de sauvegarde interceptée !");
                saveActiveOneFile(event.data.payload);
            }
        });

        // --- LE MOTEUR DE SYNCHRONISATION GOOGLE DRIVE ---
        async function saveActiveOneFile(appDataPayload) {
            if (!currentActiveOneFileId || !currentOneFileMetadata) return;

            // On met à jour l'horodatage de la modification
            currentOneFileMetadata.version_timestamp = new Date().toISOString();

            // On reconstitue le fichier standard .onefile
            const updatedOneFile = {
                oneapp_metadata: currentOneFileMetadata,
                app_data: appDataPayload
            };

            // L'API Google Drive utilise la méthode PATCH pour écraser/mettre à jour un fichier existant
            const url = `https://www.googleapis.com/upload/drive/v3/files/${currentActiveOneFileId}?uploadType=media`;

            try {
                await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${globalAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedOneFile)
                });
                console.log("MOTEUR : Fichier synchronisé avec succès sur Google Drive !");
            } catch (e) {
                console.error("Erreur de sauvegarde Cloud :", e);
            }
        }

        // --- LE CHARGEUR D'APPLICATION ---
        async function openAppEnvironment(appFileId, appName, oneFileId, oneFileName) {
            console.log(`Lancement du Sandbox : ${appName} - Fichier : ${oneFileName}`);
            
            document.getElementById('loading-apps').innerText = "Construction de l'espace de travail...";
            document.getElementById('loading-apps').style.display = 'block';

            try {
                // 1. Télécharger le logiciel (.oneapp)
                let appRes = await fetch(DRIVE_API_URL + '/' + appFileId + '?alt=media', { headers: { 'Authorization': 'Bearer ' + globalAccessToken } });
                let appJson = await appRes.json();

                // 2. Télécharger les données (.onefile)
                let dataRes = await fetch(DRIVE_API_URL + '/' + oneFileId + '?alt=media', { headers: { 'Authorization': 'Bearer ' + globalAccessToken } });
                let oneFileJson = await dataRes.json();

                currentActiveOneFileId = oneFileId;
                currentOneFileMetadata = oneFileJson.oneapp_metadata;
                window.currentLoadedAppData = oneFileJson.app_data || []; // Stockage temporaire en RAM pour le pont de communication

                // 3. Injection et Isolement (La Fusion)
                const fullHTML = "<!DOCTYPE html><html><head><style>" + 
                    (appJson.frontend.css || "") + 
                    "</style><script>" + 
                    apiBridgeScript + 
                    "<\/script></head><body>" + 
                    (appJson.frontend.html || "") + 
                    "<script>" + 
                    (appJson.logic || "") + 
                    "<\/script></body></html>";

                const iframe = document.createElement('iframe');
                iframe.sandbox = "allow-scripts"; 
                iframe.srcdoc = fullHTML;
                iframe.style.width = "100%"; iframe.style.height = "100%"; iframe.style.border = "none";

                const container = document.getElementById('iframe-container');
                container.innerHTML = ''; container.appendChild(iframe);
                
                document.getElementById('running-app-title').innerText = `${appName} - ${oneFileName}`;
                document.getElementById('authenticated-view').style.display = 'none';
                document.getElementById('execution-view').style.display = 'flex';
                
                currentRunningApp = appJson;

            } catch (error) {
                console.error(error);
                alert("Erreur critique lors du téléchargement des fichiers.");
            } finally {
                document.getElementById('loading-apps').style.display = 'none';
                document.getElementById('loading-apps').innerText = "Recherche de vos One Apps...";
            }
        }

        function closeApp() {
            document.getElementById('execution-view').style.display = 'none';
            document.getElementById('iframe-container').innerHTML = ''; // Nettoyer la RAM et détruire l'iframe
            document.getElementById('authenticated-view').style.display = 'block';
            currentRunningApp = null;
            currentActiveOneFileId = null;
            currentOneFileMetadata = null;

            // Rafraîchir la liste des fichiers du sous-menu actif pour afficher les nouveaux fichiers
            if (activeSubmenu) {
                const appId = activeSubmenu.dataset.appId;
                const appName = activeSubmenu.dataset.appName;
                const folderId = activeSubmenu.dataset.folderId;
                
                document.getElementById('submenu-loader').style.display = 'block';
                document.getElementById('submenu-file-list').innerHTML = '';
                loadAppFiles(folderId, appId, appName);
            }
        }

        // --- LOGIQUE D'INSTALLATION (Collage du JSON) ---

        function toggleInstallSection() {
            const section = document.getElementById('install-section');
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
        }

        async function installAppFromJson() {
            const jsonText = document.getElementById('json-input').value.trim();
            if (!jsonText) return alert("Veuillez coller un manifeste JSON.");

            let appData;
            try {
                appData = JSON.parse(jsonText);
            } catch (e) {
                return alert("Erreur : Le texte collé n'est pas un JSON valide.");
            }

            // Vérification basique du Manifeste One App
            if (!appData.app_metadata || !appData.app_metadata.name) {
                return alert("Erreur : Le JSON ne semble pas être un .oneapp valide (metadata manquantes).");
            }

            const appName = appData.app_metadata.name;
            const fileName = `${appName}.oneapp`;

            document.getElementById('install-loader').style.display = 'block';

            try {
                // 1. Créer le sous-dossier au nom de l'app dans le dossier racine
                console.log(`Création du sous-dossier "${appName}"...`);
                const appFolderId = await getOrCreateFolder(appName, rootFolderId);

                // 2. Créer (Uploader) le fichier .oneapp dans ce sous-dossier
                console.log(`Upload du fichier ${fileName}...`);
                const boundary = '-------314159265358979323846';
                const delimiter = "\r\n--" + boundary + "\r\n";
                const close_delim = "\r\n--" + boundary + "--";

                const metadata = { name: fileName, mimeType: "application/json", parents: [appFolderId] };
                const multipartRequestBody =
                    delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata) +
                    delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(appData) + close_delim;

                await fetch(UPLOAD_API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${globalAccessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
                    body: multipartRequestBody
                });

                alert(`L'application "${appName}" a été installée avec succès !`);
                
                // 3. Rafraîchir l'interface
                document.getElementById('json-input').value = '';
                toggleInstallSection();
                document.getElementById('install-loader').style.display = 'none';
                await listInstalledApps();

            } catch (error) {
                console.error(error);
                alert("Erreur lors de l'installation sur Google Drive.");
                document.getElementById('install-loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
