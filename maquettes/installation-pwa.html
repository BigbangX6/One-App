<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Installer One App</title>
<style>
/* Maquette autonome : aucune ressource externe (ni police, ni image, ni script).
   Mise en page : une fenêtre d'installation (bas d'écran sur téléphone, centrée ailleurs),
   des étapes illustrées par de petits écrans dessinés en HTML/SVG, et la cible à toucher qui pulse.
   Couleurs reprises de One App (index.html). */
:root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-strong: #6d28d9;
    --accent-soft: #ede9fe;
    --accent-ring: rgba(139, 92, 246, 0.45);
    --on-accent: #ffffff;
    --mock-bg: #f2f2f7;
    --mock-surface: #ffffff;
    --mock-fg: #3a3a3c;
    --mock-dim: #aeaeb2;
    --ios-blue: #007aff;
    --ok: #16a34a;
    --scrim: rgba(17, 12, 34, 0.48);
    --shadow: 0 20px 60px rgba(30, 20, 60, 0.22);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius-l: 20px;
    --radius-m: 12px;
    --radius-s: 8px;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #000000; --surface: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --line: #38383a;
        --accent: #8b5cf6; --accent-hover: #7c3aed; --accent-strong: #c4b5fd; --accent-soft: #2e2445; --accent-ring: rgba(167, 139, 250, 0.5);
        --on-accent: #ffffff; --mock-bg: #2c2c2e; --mock-surface: #3a3a3c; --mock-fg: #e5e5ea; --mock-dim: #6e6e73;
        --ios-blue: #0a84ff; --ok: #4ade80; --scrim: rgba(0, 0, 0, 0.62); --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --line: #38383a;
    --accent: #8b5cf6; --accent-hover: #7c3aed; --accent-strong: #c4b5fd; --accent-soft: #2e2445; --accent-ring: rgba(167, 139, 250, 0.5);
    --on-accent: #ffffff; --mock-bg: #2c2c2e; --mock-surface: #3a3a3c; --mock-fg: #e5e5ea; --mock-dim: #6e6e73;
    --ios-blue: #0a84ff; --ok: #4ade80; --scrim: rgba(0, 0, 0, 0.62); --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.i { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: middle; }

/* --- Barre d'aperçu (propre à la maquette, à ne pas reprendre dans One App) --- */
.preview-bar {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 16px; border-bottom: 1px dashed var(--line); font-size: 13px; color: var(--muted);
}
.preview-bar strong { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.preview-bar label { display: flex; align-items: center; gap: 8px; }
.preview-bar select {
    font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-s); padding: 6px 8px; max-width: 100%;
}
.preview-bar .detected { margin-left: auto; }

/* --- Appareil simulé --- */
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
.device { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--bg); }
.stage.framed { padding: 20px 16px; }
.stage.framed .device {
    width: 390px; max-width: 100%; height: min(800px, 100%); border-radius: 44px; overflow: hidden;
    border: 10px solid #111; box-shadow: var(--shadow);
}
.stage.framed.tablet .device { width: 680px; height: min(860px, 100%); border-radius: 28px; }
.chrome { display: none; flex: none; background: var(--mock-bg); color: var(--mock-fg); padding: 8px 12px; gap: 6px; flex-direction: column; font-size: 13px; }
.stage.framed .chrome.on { display: flex; }
.chrome .m-row .i { width: 22px; height: 22px; }
.chrome .m-pill { font-size: 13px; padding: 8px 12px; }
.chrome-bottom { border-top: 1px solid var(--line); padding-bottom: 18px; }
.chrome-top { border-bottom: 1px solid var(--line); padding-top: 14px; }

.viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; container-type: inline-size; }

/* Fond : une page One App floutée, juste pour donner le contexte */
.page-ghost { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
.page-ghost .logo { width: 56px; height: 56px; color: var(--accent); }
.page-ghost h1 { margin: 0; font-size: 24px; font-weight: 600; }
.page-ghost p { margin: 0; color: var(--muted); font-size: 15px; }
.open-btn {
    margin-top: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s);
    padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center;
}
.open-btn .i { color: var(--accent); width: 18px; height: 18px; }

/* --- La fenêtre d'installation --- */
.overlay { position: absolute; inset: 0; background: var(--scrim); z-index: 10; }
.sheet {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--shadow);
    padding: 22px 20px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;
    animation: pop 0.28s cubic-bezier(.2, .9, .3, 1.1);
}
.grabber { display: none; width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin: -10px 0 -6px; }
@container (max-width: 560px) {
    .sheet {
        left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100%; max-height: calc(100% - 20px);
        border-radius: 24px 24px 0 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        animation: rise 0.32s cubic-bezier(.2, .9, .3, 1);
    }
    .grabber { display: block; }
}
@keyframes pop { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } }
@keyframes rise { from { transform: translateY(40%); opacity: 0; } }

.sheet:focus { outline: none; }
.sheet-head { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; }
.appicon {
    width: 56px; height: 56px; border-radius: 13px; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; box-shadow: 0 6px 16px var(--accent-ring);
}
.appicon .i { width: 62%; height: 62%; }
.sheet-head h2 { margin: 2px 0 4px; font-size: 21px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
.close-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--mock-bg); color: var(--muted);
    display: grid; place-items: center; cursor: pointer; margin: -4px -4px 0 0;
}
.close-btn .i { width: 16px; height: 16px; }

.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.perks li {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-strong); font-size: 13px; font-weight: 600;
}
.perks .i { width: 16px; height: 16px; }

.howto h3 { margin: 0; font-size: 17px; font-weight: 700; }
.howto .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.notice {
    margin: 0; padding: 12px 14px; border-radius: var(--radius-m); background: var(--mock-bg);
    font-size: 14px; line-height: 1.45;
}

.steps { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: step; }
.step {
    display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center;
    padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-m);
}
.step-txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.step-t { margin: 0; font-size: 16px; line-height: 1.3; display: flex; gap: 8px; align-items: baseline; }
.step-t b { font-weight: 700; }
.num {
    flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    font-size: 13px; font-weight: 700; display: inline-grid; place-items: center; transform: translateY(-1px);
}
.step.final .num { background: var(--ok); }
.step-d { margin: 0 0 0 32px; color: var(--muted); font-size: 14px; line-height: 1.4; }
.step-d b { color: var(--fg); }
.inline-btn {
    margin: 4px 0 0 32px; align-self: flex-start; border: none; background: var(--accent); color: var(--on-accent);
    border-radius: var(--radius-s); padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer;
    display: inline-flex; gap: 6px; align-items: center;
}
.inline-btn .i { width: 16px; height: 16px; }
@container (max-width: 360px) {
    .step { grid-template-columns: 1fr; }
    .step .mock { width: 100%; }
}

/* --- Petits écrans dessinés --- */
.mock {
    width: 140px; height: 92px; box-sizing: border-box; border-radius: 10px; background: var(--mock-bg);
    color: var(--mock-fg); padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
    font-size: 10.5px; line-height: 1.2; overflow: hidden; position: relative;
}
.mock.top { justify-content: flex-start; }
.mock.center { justify-content: center; }
.m-row { display: flex; align-items: center; justify-content: space-around; gap: 4px; }
.m-row > i { display: grid; place-items: center; padding: 3px; border-radius: 6px; font-style: normal; }
.m-row .i { width: 16px; height: 16px; }
.m-pill {
    background: var(--mock-surface); border-radius: 999px; padding: 5px 8px; text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: var(--mock-fg); min-width: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.grow { flex: 1; }
.m-list { background: var(--mock-surface); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
.m-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 5px 7px; white-space: nowrap; }
.m-item + .m-item { border-top: 1px solid var(--mock-bg); }
.m-item .i { width: 13px; height: 13px; }
.m-item.dim { color: var(--mock-dim); }
.m-nav { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 10px; padding: 2px 2px 0; }
.m-nav b { font-weight: 600; }
.m-blue { color: var(--ios-blue); padding: 2px 4px; border-radius: 5px; }
.m-app { display: flex; align-items: center; gap: 8px; background: var(--mock-surface); border-radius: 8px; padding: 6px; font-weight: 600; }
.appicon.sm { width: 26px; height: 26px; border-radius: 7px; box-shadow: none; }
.m-toggle { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--mock-surface); border-radius: 8px; padding: 6px 7px; }
.switch { width: 24px; height: 14px; border-radius: 999px; background: var(--ok); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--mock-surface); }
.m-home { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px 6px; justify-items: center; }
.m-home .tile { width: 24px; height: 24px; border-radius: 6px; background: var(--mock-dim); opacity: .45; }
.m-home .me { grid-column: span 2; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9.5px; font-weight: 600; padding: 3px 6px; border-radius: 8px; }
.m-dialog { background: var(--mock-surface); border-radius: 9px; padding: 7px; display: flex; flex-direction: column; gap: 6px; }
.m-dialog-t { font-weight: 700; }
.m-dialog .m-btns { display: flex; justify-content: flex-end; gap: 6px; }
.m-dialog .m-btns span { padding: 3px 7px; border-radius: 999px; }
.m-dialog .m-btns .go { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.m-dialog .m-btns .go.hit { background: var(--accent); color: var(--on-accent) !important; }
.m-scroll { display: flex; justify-content: center; color: var(--mock-dim); }
.m-scroll .i { width: 12px; height: 12px; }
.safari-tile { display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600; padding: 3px 6px; border-radius: 8px; }
.safari-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--mock-surface); color: var(--ios-blue); display: grid; place-items: center; }
.safari-icon .i { width: 24px; height: 24px; }

/* La cible à toucher : contour violet qui pulse */
.hit {
    color: var(--accent-strong) !important; background: var(--accent-soft);
    box-shadow: 0 0 0 2px var(--accent); border-radius: 6px; animation: pulse 1.6s ease-out infinite; font-weight: 700;
}
@keyframes pulse {
    0% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 2px var(--accent-ring); }
    70% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 9px transparent; }
    100% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 9px transparent; }
}

/* --- Bouton d'installation directe (Android, ordinateur) --- */
.native { display: flex; flex-direction: column; gap: 12px; }
.native-visual { display: flex; justify-content: center; }
.native-visual .mock { width: 220px; height: auto; padding: 12px; font-size: 12px; }
.big-btn {
    width: 100%; border: none; background: var(--accent); color: var(--on-accent); border-radius: var(--radius-m);
    padding: 15px 20px; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; gap: 10px; justify-content: center; align-items: center;
}
.big-btn:hover, .inline-btn:hover { background: var(--accent-hover); }
.big-btn .i { width: 20px; height: 20px; }
.help-txt { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
.fallback[hidden] { display: none; }

.secondary-row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.text-btn { border: none; background: none; color: var(--accent-strong); font-weight: 600; font-size: 14px; padding: 8px 12px; cursor: pointer; border-radius: var(--radius-s); }
.text-btn.quiet { color: var(--muted); font-weight: 500; }

/* Flèche qui montre où se trouve le vrai bouton du navigateur : toujours visible en bas de la fenêtre */
#pointer-bottom:empty { display: none; }
#pointer-bottom { position: sticky; bottom: -18px; margin: -10px -20px -18px; padding: 10px 20px 14px; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -10px 14px -6px var(--surface); }
@container (max-width: 560px) { #pointer-bottom { bottom: calc(-14px - env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-14px - env(safe-area-inset-bottom, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); } }
.pointer { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--accent-strong); font-weight: 700; font-size: 14px; text-align: center; }
.pointer.right { align-items: flex-end; text-align: right; }
.pointer .i { width: 28px; height: 28px; animation: bob 1.1s ease-in-out infinite; }
.pointer.right .i { margin-right: 6px; }
@keyframes bob { 50% { transform: translateY(6px); } }
.pointer-top {
    position: absolute; top: 10px; right: 16px; z-index: 11; display: flex; flex-direction: column; align-items: flex-end;
    background: var(--surface); color: var(--accent-strong); font-weight: 700; font-size: 14px; padding: 8px 12px; border-radius: var(--radius-m); box-shadow: var(--shadow);
}
.overlay.has-top .sheet { top: calc(50% + 34px); max-height: calc(100% - 100px); }
.pointer-top .i { width: 24px; height: 24px; animation: bobup 1.1s ease-in-out infinite; }
@keyframes bobup { 50% { transform: translateY(-5px); } }

.done-state { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; }
.done-state .badge { width: 52px; height: 52px; border-radius: 50%; background: var(--ok); color: var(--on-accent); display: grid; place-items: center; }
.done-state .badge .i { width: 28px; height: 28px; }
.done-state p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; max-width: 32ch; }

.toast {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
    .hit, .pointer .i, .pointer-top .i, .sheet { animation: none !important; }
}
</style>
</head>

        <symbol id="i-tabs" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="7.5" width="12" height="12.5" rx="2"/><path d="M8 4.5h10a2 2 0 0 1 2 2v10"/></g></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></g></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-install" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 7.5v6M9 11l3 3 3-3"/></g></symbol>
        <symbol id="i-phone-dl" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7v7M9.5 11.5 12 14l2.5-2.5"/></g></symbol>
        <symbol id="i-compass" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5z" fill="currentColor" fill-opacity=".25"/></g></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 4v15M6 13l6 6 6-6"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 20V5M6 11l6-6 6 6"/></symbol>
        <symbol id="i-chev-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    </defs>
</svg>

<div class="preview-bar">
    <strong>MAQUETTE</strong>
    <label for="device-select">Appareil simulé
        <select id="device-select">
            <option value="auto">Cet appareil (détection automatique)</option>
            <option value="ios26">iPhone, Safari iOS 26</option>
            <option value="ios">iPhone, Safari iOS 18 et avant</option>
            <option value="ipad">iPad, Safari</option>
            <option value="ios-other">iPhone, ouvert depuis une autre app</option>
            <option value="android">Android, Chrome</option>
            <option value="desktop">Ordinateur</option>
            <option value="installed">Déjà installée</option>
        </select>
    </label>
    <span class="detected" id="detected-label"></span>
</div>

<div class="stage" id="stage">
    <div class="device">
        <div class="chrome chrome-top" id="chrome-top"></div>
        <div class="viewport" id="viewport">
            <div class="page-ghost">
                <svg class="logo"><use href="#i-cloud"/></svg>
                <h1>One App</h1>
                <p>Votre Personal Cloud décentralisé</p>
                <button class="open-btn" id="open-btn" type="button"><svg class="i"><use href="#i-phone-dl"/></svg>Installer l'application</button>
            </div>

            <div class="overlay" id="overlay" hidden>
                <div class="pointer-top" id="pointer-top" hidden><svg class="i"><use href="#i-up"/></svg><span>Le bouton est ici</span></div>
                <section class="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
                    <div class="grabber"></div>
                    <header class="sheet-head">
                        <div class="appicon" aria-hidden="true"><svg class="i"><use href="#i-cloud"/></svg></div>
                        <div>
                            <h2 id="sheet-title">Installer One App</h2>
                            <p class="lede" id="sheet-lede">Ajoutez One App à votre écran d'accueil pour l'ouvrir d'un seul geste, comme une application.</p>
                        </div>
                        <button class="close-btn" id="close-btn" type="button" aria-label="Fermer"><svg class="i"><use href="#i-x"/></svg></button>
                    </header>
                    <ul class="perks" id="perks">
                        <li><svg class="i"><use href="#i-home"/></svg>Sur l'écran d'accueil</li>
                        <li><svg class="i"><use href="#i-wifi-off"/></svg>Marche sans Internet</li>
                        <li><svg class="i"><use href="#i-check-c"/></svg>Gratuit</li>
                    </ul>
                    <div id="sheet-body"></div>
                    <div class="secondary-row" id="secondary-row"></div>
                    <div id="pointer-bottom"></div>
                </section>
            </div>
            <div class="toast" id="toast" hidden></div>
        </div>
        <div class="chrome chrome-bottom" id="chrome-bottom"></div>
    </div>
</div>

<script>
(function () {
    const I = (id) => `<svg class="i" aria-hidden="true"><use href="#i-${id}"/></svg>`;
    const URL_TXT = 'github.io';
    const ICON_SM = `<span class="appicon sm">${I('cloud')}</span>`;

    // --- Petits écrans dessinés, un par geste ---
    const MOCKS = {
        shareBottom: `<div class="mock">
            <div class="m-pill">${URL_TXT}</div>
            <div class="m-row"><i>${I('back')}</i><i>${I('fwd')}</i><i class="hit">${I('share')}</i><i>${I('book')}</i><i>${I('tabs')}</i></div></div>`,
        moreBottom: `<div class="mock">
            <div class="m-row"><i>${I('back')}</i><div class="m-pill grow">${URL_TXT}</div><i class="hit">${I('more')}</i></div></div>`,
        shareTop: `<div class="mock top">
            <div class="m-row"><div class="m-pill grow">${URL_TXT}</div><i class="hit">${I('share')}</i><i>${I('plus')}</i></div></div>`,
        menuShare: `<div class="mock"><div class="m-list">
            <div class="m-item hit">Partager ${I('share')}</div>
            <div class="m-item">Ajouter un signet ${I('book')}</div>
            <div class="m-item dim">Rechercher ${I('search')}</div></div></div>`,
        sheetHome: `<div class="mock"><div class="m-list">
            <div class="m-item dim">Ajouter aux favoris ${I('star')}</div>
            <div class="m-item hit">Sur l'écran d'accueil ${I('plus-sq')}</div></div>
            <div class="m-scroll">${I('chev-down')}</div></div>`,
        add: `<div class="mock top">
            <div class="m-nav"><span class="m-blue">Annuler</span><span class="m-blue hit">Ajouter</span></div>
            <div class="m-app">${ICON_SM}One App</div></div>`,
        add26: `<div class="mock top">
            <div class="m-nav"><span class="m-blue">Annuler</span><span class="m-blue hit">Ajouter</span></div>
            <div class="m-app">${ICON_SM}One App</div>
            <div class="m-toggle">App web <span class="switch"></span></div></div>`,
        done: `<div class="mock center"><div class="m-home">
            <span class="tile"></span><span class="tile"></span><span class="tile"></span><span class="tile"></span>
            <span class="tile"></span><span class="me hit">${ICON_SM}One App</span><span class="tile"></span></div></div>`,
        copy: `<div class="mock center"><div class="m-pill">${URL_TXT}</div>
            <div class="m-row"><i class="hit">${I('copy')}&nbsp;Copier</i></div></div>`,
        safari: `<div class="mock center"><div class="m-home">
            <span class="tile"></span><span class="safari-tile hit"><span class="safari-icon">${I('compass')}</span>Safari</span><span class="tile"></span></div></div>`,
        paste: `<div class="mock top"><div class="m-pill">&nbsp;</div>
            <div class="m-row"><i class="hit">Coller et aller</i></div></div>`,
        kebab: `<div class="mock top">
            <div class="m-row"><i>${I('home')}</i><div class="m-pill grow">${URL_TXT}</div><i>${I('tabs')}</i><i class="hit">${I('kebab')}</i></div></div>`,
        menuInstall: `<div class="mock top"><div class="m-list">
            <div class="m-item dim">Nouvel onglet ${I('plus')}</div>
            <div class="m-item dim">Historique ${I('book')}</div>
            <div class="m-item hit">Ajouter à l'écran d'accueil ${I('phone-dl')}</div></div></div>`,
        confirm: `<div class="mock center"><div class="m-dialog">
            <span class="m-dialog-t">Installer l'application ?</span>
            <div class="m-app" style="padding:0">${ICON_SM}One App</div>
            <div class="m-btns"><span>Annuler</span><span class="go hit">Installer</span></div></div></div>`,
        addrInstall: `<div class="mock top">
            <div class="m-row"><div class="m-pill grow" style="justify-content:space-between">${URL_TXT}<span class="hit" style="display:grid;padding:2px">${I('install')}</span></div></div></div>`
    };

    const DONE_STEP = { m: 'done', final: true, t: "C'est fait !", d: "Ouvrez One App depuis sa nouvelle icône sur l'écran d'accueil, même sans Internet." };
    const HOME_STEP = { m: 'sheetHome', t: "Choisissez <b>Sur l'écran d'accueil</b>", d: 'Faites glisser la liste vers le haut si vous ne le voyez pas.' };

    // --- Les parcours, un par type d'appareil ---
    const FLOWS = {
        ios26: {
            kind: 'steps', device: 'iPhone', frame: 'phone', chrome: 'ios26', pointer: 'right',
            pointerText: 'Commencez ici : •••', alt: 'ios', altLabel: "Je ne vois pas •••, mais un carré avec une flèche",
            steps: [
                { m: 'moreBottom', t: 'Touchez <b>•••</b>', d: "Tout en bas à droite de l'écran, à côté de l'adresse du site." },
                { m: 'menuShare', t: 'Touchez <b>Partager</b>', d: 'Dans le menu qui vient de s\'ouvrir.' },
                HOME_STEP,
                { m: 'add26', t: 'Touchez <b>Ajouter</b>', d: "En haut à droite. Laissez l'option <b>Ouvrir en tant qu'app web</b> activée." },
                DONE_STEP
            ]
        },
        ios: {
            kind: 'steps', device: 'iPhone', frame: 'phone', chrome: 'ios', pointer: 'center',
            pointerText: 'Le bouton Partager est ici, tout en bas', alt: 'ios26', altLabel: 'Je ne vois pas ce bouton, mais •••',
            steps: [
                { m: 'shareBottom', t: 'Touchez le bouton <b>Partager</b>', d: "En bas de l'écran, au milieu : un carré avec une flèche vers le haut." },
                HOME_STEP,
                { m: 'add', t: 'Touchez <b>Ajouter</b>', d: 'En haut à droite.' },
                DONE_STEP
            ]
        },
        ipad: {
            kind: 'steps', device: 'iPad', frame: 'tablet', chrome: 'ipad', pointer: 'top',
            steps: [
                { m: 'shareTop', t: 'Touchez le bouton <b>Partager</b>', d: "En haut à droite de l'écran, à côté de l'adresse du site." },
                HOME_STEP,
                { m: 'add', t: 'Touchez <b>Ajouter</b>', d: 'En haut à droite.' },
                DONE_STEP
            ]
        },
        'ios-other': {
            kind: 'steps', device: 'iPhone', frame: 'phone', chrome: 'inapp',
            notice: "Cette page est ouverte dans une autre application que <b>Safari</b>. Sur iPhone, l'installation se fait uniquement depuis Safari.",
            title: "D'abord, ouvrez cette page dans Safari", sub: 'Ensuite, ce guide vous montrera la suite.',
            steps: [
                { m: 'copy', t: 'Copiez le lien de la page', d: 'Touchez le bouton ci-dessous.', action: 'copy' },
                { m: 'safari', t: 'Ouvrez l\'application <b>Safari</b>', d: 'Son icône est une boussole bleue.' },
                { m: 'paste', t: 'Collez le lien', d: "Touchez la barre d'adresse en haut, puis <b>Coller et aller</b>." }
            ]
        },
        android: {
            kind: 'native', device: 'Android', frame: 'phone', chrome: 'android',
            fallback: [
                { m: 'kebab', t: 'Touchez <b>⋮</b>', d: 'Les trois points, en haut à droite de Chrome.' },
                { m: 'menuInstall', t: "Choisissez <b>Ajouter à l'écran d'accueil</b>", d: "Ou <b>Installer l'application</b>, selon votre téléphone." },
                { m: 'confirm', t: 'Confirmez avec <b>Installer</b>', d: '' },
                DONE_STEP
            ]
        },
        desktop: {
            kind: 'native', device: 'ordinateur', frame: 'none',
            fallback: [
                { m: 'addrInstall', t: "Cliquez sur l'icône d'installation", d: "À droite de la barre d'adresse (Chrome, Edge)." },
                { m: 'confirm', t: 'Cliquez sur <b>Installer</b>', d: '' }
            ],
            note: 'Sur Safari (Mac) : menu <b>Fichier</b>, puis <b>Ajouter au Dock</b>.'
        },
        installed: { kind: 'installed', device: '', frame: 'none' }
    };

    // --- Détection de l'appareil ---
    function detect() {
        const ua = navigator.userAgent;
        const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (standalone) return 'installed';
        const isIPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        const isIOS = /iPhone|iPod/.test(ua) || isIPad;
        if (isIOS) {
            const otherApp = /CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|FBAN|FBAV|Instagram|LinkedInApp|Line\/|Snapchat|Gmail/.test(ua) || !/Safari\//.test(ua);
            if (otherApp) return 'ios-other';
            if (isIPad) return 'ipad';
            const v = parseInt((ua.match(/Version\/(\d+)/) || [])[1], 10);
            return v >= 26 ? 'ios26' : 'ios';
        }
        if (/Android/.test(ua)) return 'android';
        return 'desktop';
    }

    // Invite d'installation native (Chrome, Edge, Android) : on la garde pour notre bouton
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    window.addEventListener('appinstalled', () => { render('installed'); });

    const $ = (id) => document.getElementById(id);
    const detected = detect();
    let current = detected;

    function stepsHtml(steps) {
        let n = 0;
        return `<ol class="steps">${steps.map((s) => {
            if (!s.final) n++;
            const badge = s.final ? I('check') : n;
            const btn = s.action === 'copy' ? `<button type="button" class="inline-btn" data-action="copy">${I('copy')}Copier le lien</button>` : '';
            return `<li class="step${s.final ? ' final' : ''}">${MOCKS[s.m]}
                <div class="step-txt"><p class="step-t"><span class="num">${badge}</span><span>${s.t}</span></p>
                ${s.d ? `<p class="step-d">${s.d}</p>` : ''}${btn}</div></li>`;
        }).join('')}</ol>`;
    }

    function chromeHtml(kind) {
        if (kind === 'ios') return { bottom: `<div class="m-pill">${URL_TXT}</div><div class="m-row"><i>${I('back')}</i><i>${I('fwd')}</i><i>${I('share')}</i><i>${I('book')}</i><i>${I('tabs')}</i></div>` };
        if (kind === 'ios26') return { bottom: `<div class="m-row"><i>${I('back')}</i><div class="m-pill grow">${URL_TXT}</div><i>${I('more')}</i></div>` };
        if (kind === 'ipad') return { top: `<div class="m-row"><i>${I('back')}</i><i>${I('fwd')}</i><div class="m-pill grow">${URL_TXT}</div><i>${I('share')}</i><i>${I('plus')}</i><i>${I('tabs')}</i></div>` };
        if (kind === 'android') return { top: `<div class="m-row"><i>${I('home')}</i><div class="m-pill grow">${URL_TXT}</div><i>${I('tabs')}</i><i>${I('kebab')}</i></div>` };
        if (kind === 'inapp') return { top: `<div class="m-row"><i>${I('x')}</i><div class="m-pill grow">${URL_TXT}</div><i>${I('more')}</i></div>` };
        return {};
    }

    function render(key) {
        current = key;
        const f = FLOWS[key];
        const body = $('sheet-body');
        const sec = $('secondary-row');
        const pb = $('pointer-bottom');
        $('perks').hidden = f.kind === 'installed';
        $('sheet-lede').hidden = f.kind === 'installed';
        $('pointer-top').hidden = f.pointer !== 'top';
        $('overlay').classList.toggle('has-top', f.pointer === 'top');
        pb.innerHTML = '';
        sec.innerHTML = `<button type="button" class="text-btn quiet" data-action="close">Plus tard</button>`;

        if (f.kind === 'steps') {
            const count = f.steps.filter((s) => !s.final).length;
            body.innerHTML = `<div class="howto">
                ${f.notice ? `<p class="notice">${f.notice}</p><div style="height:14px"></div>` : ''}
                <h3>${f.title || `Comment faire sur ${f.device}`}</h3>
                <p class="sub">${f.sub || `${count} gestes dans Safari, moins d'une minute.`}</p>
                ${stepsHtml(f.steps)}</div>`;
            if (f.alt) sec.insertAdjacentHTML('afterbegin', `<button type="button" class="text-btn" data-alt="${f.alt}">${f.altLabel}</button>`);
            if (f.pointer === 'center' || f.pointer === 'right') {
                pb.innerHTML = `<div class="pointer ${f.pointer === 'right' ? 'right' : ''}"><span>${f.pointerText}</span>${I('down')}</div>`;
            }
        } else if (f.kind === 'native') {
            body.innerHTML = `<div class="native">
                <div class="native-visual">${MOCKS.confirm}</div>
                <button type="button" class="big-btn" data-action="install">${I(key === 'desktop' ? 'install' : 'phone-dl')}Installer One App</button>
                <p class="help-txt">Une petite fenêtre va s'ouvrir : ${key === 'desktop' ? 'cliquez' : 'touchez'} <b>Installer</b>.</p>
                <div class="fallback" id="fallback" hidden>
                    <p class="notice" id="fallback-msg">Si rien ne s'ouvre, installez One App à la main :</p>
                    ${stepsHtml(f.fallback)}
                    ${f.note ? `<p class="help-txt" style="margin-top:10px">${f.note}</p>` : ''}
                </div></div>`;
            sec.insertAdjacentHTML('afterbegin', `<button type="button" class="text-btn" data-action="fallback">Rien ne se passe ?</button>`);
        } else {
            body.innerHTML = `<div class="done-state"><span class="badge">${I('check')}</span>
                <h3 style="margin:0;font-size:18px">One App est déjà installée</h3>
                <p>Vous l'utilisez en ce moment depuis votre écran d'accueil. Elle fonctionne aussi sans Internet.</p></div>`;
            sec.innerHTML = `<button type="button" class="big-btn" data-action="close">Compris</button>`;
        }

        // Cadre d'appareil : seulement pour simuler un autre appareil sur un grand écran
        const stage = $('stage');
        const simulate = $('device-select').value !== 'auto' && f.frame !== 'none' && window.innerWidth >= 720;
        stage.classList.toggle('framed', simulate);
        stage.classList.toggle('tablet', simulate && f.frame === 'tablet');
        const ch = simulate ? chromeHtml(f.chrome) : {};
        $('chrome-top').innerHTML = ch.top || '';
        $('chrome-bottom').innerHTML = ch.bottom || '';
        $('chrome-top').classList.toggle('on', !!ch.top);
        $('chrome-bottom').classList.toggle('on', !!ch.bottom);
    }

    function open() { $('overlay').hidden = false; render(current); const s = document.querySelector('.sheet'); s.scrollTop = 0; s.focus({ preventScroll: true }); }
    function close() { $('overlay').hidden = true; $('open-btn').focus(); }

    let toastTimer;
    function toast(msg) {
        const t = $('toast'); t.textContent = msg; t.hidden = false;
        clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
    }

    async function copyLink() {
        try { await navigator.clipboard.writeText(location.href); toast('Lien copié'); }
        catch (e) {
            const ta = document.createElement('textarea'); ta.value = location.href; document.body.appendChild(ta); ta.select();
            let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
            ta.remove(); toast(ok ? 'Lien copié' : "Copie impossible : copiez l'adresse à la main");
        }
    }

    async function install() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            if (outcome === 'accepted') render('installed');
            return;
        }
        const fb = $('fallback');
        fb.hidden = false;
        $('fallback-msg').textContent = "L'installation automatique n'est pas disponible ici. Suivez plutôt ces étapes :";
        fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action], [data-alt]');
        if (!el) return;
        if (el.dataset.alt) { render(el.dataset.alt); document.querySelector('.sheet').scrollTop = 0; return; }
        const a = el.dataset.action;
        if (a === 'close') close();
        else if (a === 'copy') copyLink();
        else if (a === 'install') install();
        else if (a === 'fallback') { $('fallback').hidden = false; $('fallback').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    $('close-btn').addEventListener('click', close);
    $('open-btn').addEventListener('click', open);
    $('overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('overlay').hidden) close(); });

    $('device-select').addEventListener('change', (e) => { current = e.target.value === 'auto' ? detected : e.target.value; open(); });
    window.addEventListener('resize', () => render(current));

    const labels = { ios26: 'iPhone (iOS 26)', ios: 'iPhone (iOS 18 ou avant)', ipad: 'iPad', 'ios-other': 'iPhone hors Safari', android: 'Android', desktop: 'ordinateur', installed: 'déjà installée' };
    $('detected-label').textContent = 'Détecté : ' + labels[detected];
    open();
})();
</script>
</body>
</html>
