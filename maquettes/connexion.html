<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Connexion One App</title>
<style>
/* Page de connexion de One App, piste « vitrine » retenue : première visite (on explique
   ce que fait One App, comme Google l'exige), retour après l'heure de connexion,
   bandeau pendant l'utilisation, et carte simple après une déconnexion.
   Fichier autonome, aucune ressource externe. Reprend les couleurs et les cartes de index.html.
   Mise en page : barre de maquette en haut, puis l'écran choisi. */
:root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-google: Roboto, "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

    --bg: #f3f5f9;
    --page-bg: linear-gradient(180deg, #d9e7fd 0%, #e9f0fb 32%, #f3f5f9 70%);
    --card: #ffffff;
    --field: #f2f2f6;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --line: #e5e5ea;
    --hover: rgba(29, 29, 31, 0.05);
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-strong: #6d28d9;
    --accent-soft: #efe9fe;
    --accent-ring: rgba(139, 92, 246, 0.35);
    --on-accent: #ffffff;
    --ok: #16a34a;
    --ok-soft: #e3f6e9;
    --scrim: rgba(20, 16, 30, 0.38);
    --card-shadow: 0 0.5px 1px rgba(20, 30, 60, 0.06), 0 6px 22px rgba(20, 30, 60, 0.07);
    --pop-shadow: 0 10px 40px rgba(20, 30, 60, 0.2), 0 1px 3px rgba(20, 30, 60, 0.1);
    --icon-top: 96%;
    --icon-bottom: 86%;
    --icon-sat: 80%;
    --icon-gloss: rgba(255, 255, 255, 0.75);
    --icon-drop: 0.22;
    --dim: #c7c7cc;
    --g-bg: #ffffff;
    --g-border: #747775;
    --g-fg: #1f1f1f;
    --inverse: #2a2830;
    --on-inverse: #f5f4f8;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #000000; --page-bg: linear-gradient(180deg, #0c1a30 0%, #060c18 34%, #000000 72%); --card: #1c1c1e; --field: #2a2a2e;
        --fg: #f5f5f7; --muted: #a1a1a6; --line: #333338; --hover: rgba(245, 245, 247, 0.07); --accent-strong: #c4b5fd; --accent-soft: #2e2445;
        --accent-ring: rgba(167, 139, 250, 0.45); --ok: #4ade80; --ok-soft: #12301d; --scrim: rgba(0, 0, 0, 0.6);
        --card-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 6px 22px rgba(0, 0, 0, 0.5); --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.07);
        --icon-top: 36%; --icon-bottom: 24%; --icon-sat: 35%; --icon-gloss: rgba(255, 255, 255, 0.12); --icon-drop: 0.5; --dim: #48484d;
        --g-bg: #131314; --g-border: #8e918f; --g-fg: #e3e3e3; --inverse: #f5f4f8; --on-inverse: #1d1d1f;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #000000; --page-bg: linear-gradient(180deg, #0c1a30 0%, #060c18 34%, #000000 72%); --card: #1c1c1e; --field: #2a2a2e;
    --fg: #f5f5f7; --muted: #a1a1a6; --line: #333338; --hover: rgba(245, 245, 247, 0.07); --accent-strong: #c4b5fd; --accent-soft: #2e2445;
    --accent-ring: rgba(167, 139, 250, 0.45); --ok: #4ade80; --ok-soft: #12301d; --scrim: rgba(0, 0, 0, 0.6);
    --card-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 6px 22px rgba(0, 0, 0, 0.5); --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.07);
    --icon-top: 36%; --icon-bottom: 24%; --icon-sat: 35%; --icon-gloss: rgba(255, 255, 255, 0.12); --icon-drop: 0.5; --dim: #48484d;
    --g-bg: #131314; --g-border: #8e918f; --g-fg: #e3e3e3; --inverse: #f5f4f8; --on-inverse: #1d1d1f;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { isolation: isolate; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--page-bg); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent-strong); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 20px; height: 20px; fill: currentColor; flex: none; display: block; }

/* --- Barre de maquette --- */
.pv { flex: none; display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 8px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px dashed var(--line); background: var(--card); }
.pv strong { font-size: 10px; letter-spacing: 0.08em; }
.pv-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.pv-tabs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.pv-tabs button[aria-selected="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.pv label { display: inline-flex; gap: 6px; align-items: center; }
.pv select { font-size: 12px; padding: 2px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); }
.pv .sp { flex: 1; }
#stage { flex: 1; min-height: 0; overflow-y: auto; }

/* --- Commun --- */
.card { background: var(--card); border-radius: 24px; box-shadow: var(--card-shadow); }
.logo { width: 64px; height: 64px; color: var(--accent); }
.brand { display: inline-flex; align-items: center; gap: 8px; }
.brand .logo { width: 30px; height: 30px; }
.brand b { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.h-display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
.lead { color: var(--muted); margin: 0; text-wrap: pretty; }
.legal { align-items: center; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 14px; justify-content: center; flex-wrap: wrap; }
.legal a { color: var(--muted); text-decoration: none; }
.legal a:hover { color: var(--fg); text-decoration: underline; }

/* Bouton de connexion officiel Google (charte « Se connecter avec Google ») */
.signin { width: 100%; height: 48px; border-radius: 24px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; font-size: 16px; font-weight: 600; border: none; }
.signin.google { background: var(--g-bg); color: var(--g-fg); border: 1px solid var(--g-border); font-family: var(--font-google); font-weight: 500; font-size: 15px; }
.signin.google:hover { box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3); }
.signin.google svg { width: 20px; height: 20px; }
.install { border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 12px; }
.install:hover { background: var(--hover); color: var(--fg); }
.install.strong { color: var(--accent-strong); }
.discover { border: none; background: none; color: var(--accent-strong); font-weight: 600; font-size: 12.5px; padding: 0; line-height: inherit; }
.discover:hover { text-decoration: underline; }


/* Icône d'app (même rendu que l'accueil en cartes) */
.icon {
    --h: 265; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; line-height: 1; flex: none;
    background: linear-gradient(180deg, hsl(var(--h) var(--icon-sat) var(--icon-top)), hsl(var(--h) var(--icon-sat) var(--icon-bottom)));
    box-shadow: inset 0 1px 0 var(--icon-gloss), 0 1px 2px hsl(var(--h) 40% 30% / var(--icon-drop)), 0 4px 10px hsl(var(--h) 40% 40% / calc(var(--icon-drop) * 0.6));
}
.icon.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 15px; }
.icon.xs { width: 22px; height: 22px; border-radius: 6px; font-size: 12px; }
.appicon { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(180deg, #9a70fa, var(--accent)); color: var(--on-accent); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 6px 16px var(--accent-ring); flex: none; }
.appicon .i { width: 62%; height: 62%; }

/* --- Illustrations (dessinées en HTML) --- */
.vis { position: relative; height: 168px; border-radius: 18px; background: var(--field); display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 14px; }
/* 1. Une IA fabrique l'app */
.v-ai { display: flex; align-items: center; gap: 12px; }
.bubble { background: var(--card); border-radius: 16px 16px 16px 4px; padding: 10px 12px; font-size: 12.5px; max-width: 150px; box-shadow: var(--card-shadow); line-height: 1.35; }
.bubble small { display: block; color: var(--muted); font-size: 10.5px; font-weight: 600; margin-bottom: 3px; }
.arrow { color: var(--accent); }
.arrow .i { width: 26px; height: 26px; }
.v-ai .made { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; animation: popin 2.6s ease-in-out infinite; }
@keyframes popin { 0%, 15% { transform: scale(0.6); opacity: 0; } 30%, 85% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
/* 2. Rangé dans Drive */
.tree { background: var(--card); border-radius: 14px; padding: 8px 10px; font-size: 12.5px; width: min(250px, 100%); box-shadow: var(--card-shadow); }
.tree .r { display: flex; align-items: center; gap: 7px; padding: 3px 0; white-space: nowrap; }
.tree .r .i { width: 16px; height: 16px; color: var(--muted); }
.tree .r.d1 { padding-left: 16px; } .tree .r.d2 { padding-left: 32px; } .tree .r.d3 { padding-left: 48px; }
.tree .r.off { color: var(--dim); }
.tree .r.off .i { color: var(--dim); }
.tree .r.on { color: var(--fg); font-weight: 600; }
.tree .r.on .i { color: var(--accent); }
.tree .r .tag { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft); border-radius: 999px; padding: 1px 7px; }
.tree .r .tag.no { color: var(--muted); background: transparent; border: 1px solid var(--line); }
/* Autorisation Google (ce que la fenêtre de Google affichera) */
.consent { background: var(--card); border-radius: 14px; padding: 12px 14px; width: min(290px, 100%); box-shadow: var(--card-shadow); font-size: 12px; display: flex; flex-direction: column; gap: 10px; }
.consent .top { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; }
.consent .top svg { width: 16px; height: 16px; }
.consent .ask { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--field); line-height: 1.35; }
.consent .ask .i { width: 18px; height: 18px; color: var(--accent); margin-top: 1px; }
.consent .btns { display: flex; justify-content: flex-end; gap: 8px; font-weight: 600; }
.consent .btns span { padding: 4px 10px; border-radius: 999px; color: var(--muted); }
.consent .btns span.go { background: #0b57d0; color: #fff; }
/* 3. Partage */
.v-share { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.linkpill { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 7px 14px 7px 10px; font-size: 12px; box-shadow: var(--card-shadow); max-width: 100%; }
.linkpill .i { width: 16px; height: 16px; color: var(--accent); }
.linkpill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.people { display: flex; align-items: center; }
.person { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; border: 2px solid var(--field); margin-left: -8px; }
.person:first-child { margin-left: 0; }
.seg2 { display: flex; background: var(--card); border-radius: 10px; padding: 3px; font-size: 11.5px; font-weight: 600; box-shadow: var(--card-shadow); }
.seg2 span { padding: 4px 10px; border-radius: 8px; color: var(--muted); }
.seg2 span.on { background: var(--accent-soft); color: var(--accent-strong); }
/* 4. Téléphone */
.phone { width: 84px; height: 138px; border-radius: 18px; border: 3px solid var(--fg); background: var(--card); padding: 18px 9px 9px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; align-content: start; position: relative; margin-right: 70px; }
.phone::before { content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 24px; height: 4px; border-radius: 2px; background: var(--fg); }
.phone .t { width: 100%; aspect-ratio: 1; border-radius: 6px; background: var(--dim); opacity: 0.6; }
.phone .me { width: 100%; aspect-ratio: 1; border-radius: 6px; background: linear-gradient(180deg, #9a70fa, var(--accent)); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); animation: bob 2s ease-in-out infinite; }
.phone .me .i { width: 70%; height: 70%; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.offline-badge { position: absolute; left: calc(100% + 10px); top: 46px; background: var(--card); border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 600; display: flex; gap: 5px; align-items: center; box-shadow: var(--card-shadow); white-space: nowrap; }
.offline-badge .i { width: 14px; height: 14px; color: var(--ok); }

/* =========================================================
   A · LA VITRINE
   ========================================================= */
.pa { max-width: 980px; margin: 0 auto; padding: 22px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.pa-hero { max-width: 560px; width: 100%; margin: 6px auto 0; padding: 36px 36px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pa-hero .name { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: -4px; }
.pa-hero h1 { font-size: clamp(27px, 4.4vw, 36px); line-height: 1.12; }
.pa-hero .lead { font-size: 16px; max-width: 42ch; margin-bottom: 8px; }
.pa-hero .signin { max-width: 380px; }
.scroll-hint { border: none; background: none; color: var(--muted); font-size: 13px; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 4px; padding: 4px 8px; border-radius: 10px; }
.scroll-hint .i { animation: hint 1.6s ease-in-out infinite; }
@keyframes hint { 50% { transform: translateY(3px); } }
.sec-title { text-align: center; margin: 22px 0 2px; }
.sec-title h2 { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; margin: 0; }
.sec-title p { margin: 4px 0 0; color: var(--muted); }
.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.feature { padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 12px; }
.feature .txt { padding: 0 8px; }
.feature h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.feature h3 .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.feature p { margin: 0; color: var(--muted); }
.trust { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; padding: 26px 28px; align-items: center; }
.trust h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
.trust p { margin: 0 0 10px; color: var(--muted); }
.trust ul { list-style: none; padding: 0; margin: 12px 0 14px; display: flex; flex-direction: column; gap: 8px; }
.trust li { display: flex; gap: 10px; align-items: flex-start; }
.trust li .i { width: 18px; height: 18px; color: var(--ok); margin-top: 1px; }
.trust .vis { height: auto; min-height: 200px; }
.pa-end { text-align: center; padding: 24px 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pa-end h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.pa-end .signin { max-width: 380px; }

/* =========================================================
   RETOUR (déjà venu) : la carte simple d'aujourd'hui
   ========================================================= */
.pr { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 32px; }
.pr-card { width: min(420px, 100%); padding: 38px 28px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pr-card h1 { font-family: var(--font-display); font-size: 26px; margin: 8px 0 0; }
.pr-card .lead { margin: 0 0 20px; }
.pr-card .install { margin-top: 6px; }
.pr-card .legal { margin-top: 10px; }

/* --- Reconnexion : tout dit « 1 heure » --- */
.hour { width: 76px; height: 76px; position: relative; display: grid; place-items: center; margin-bottom: 4px; }
.hour svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hour b { position: relative; font-family: var(--font-display); font-size: 21px; color: var(--accent-strong); letter-spacing: -0.02em; }
.pr-card.ended h1 { font-size: 23px; line-height: 1.2; text-wrap: balance; }
.pr-card.ended .lead { margin-bottom: 18px; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.why { width: 100%; margin-top: 12px; border-radius: 14px; background: var(--field); text-align: left; font-size: 13.5px; }
.why summary { cursor: pointer; list-style: none; padding: 10px 14px; font-weight: 600; color: var(--accent-strong); display: flex; align-items: center; gap: 8px; }
.why summary::-webkit-details-marker { display: none; }
.why summary .i { width: 18px; height: 18px; color: var(--accent-strong); }
.why summary .i:last-child { margin-left: auto; color: var(--muted); transition: transform 0.2s; }
.why[open] summary .i:last-child { transform: rotate(180deg); }
.why p { margin: 0; padding: 0 14px 12px; color: var(--muted); line-height: 1.5; }
.signin.compact { width: auto; height: 38px; padding: 0 16px 0 12px; font-size: 14px; gap: 10px; border-radius: 19px; flex: none; }
.signin.compact svg { width: 18px; height: 18px; }

/* Accueil (pendant l'utilisation), en version réduite */
.uh { max-width: 1000px; margin: 0 auto; padding: 14px 20px 40px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; }
.uh .brand { grid-column: 1 / -1; padding: 2px 4px; }
.uh .card { padding: 20px; }
.u-acc { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.u-acc b { font-family: var(--font-display); font-size: 18px; }
.u-acc .mail { color: var(--muted); font-size: 13px; }
.u-status { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--field); }
.u-status .i { width: 16px; height: 16px; color: var(--ok); }
.u-status.soon { background: var(--accent-soft); color: var(--accent-strong); }
.u-status.soon .i { color: var(--accent-strong); }
.u-status.off .i { color: var(--muted); }
.u-renew { border: none; background: none; color: var(--accent-strong); font-weight: 700; font-size: 12.5px; padding: 0 0 0 4px; text-decoration: underline; text-underline-offset: 2px; }
.u-apps { display: flex; gap: 14px; flex-wrap: wrap; align-content: flex-start; }
.u-apps .a { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; width: 64px; }
.u-docs { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 2px; }
.u-docs .d { display: flex; align-items: center; gap: 12px; padding: 7px 4px; font-weight: 500; }
.u-docs .d span:not(.icon) { flex: 1; min-width: 0; }
.u-docs .d em { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 400; }
.sbanner { position: sticky; top: 0; z-index: 5; margin: 10px auto 0; max-width: 1000px; width: calc(100% - 40px); background: var(--card); border-radius: 18px; box-shadow: var(--pop-shadow); padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; animation: pop 0.25s ease-out; }
.sbanner .clock { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; flex: none; }
.sbanner .clock .i { width: 20px; height: 20px; }
.sbanner .txt { flex: 1; min-width: 220px; font-size: 14px; line-height: 1.4; }
.sbanner .txt b { display: block; }
.sbanner .txt span { color: var(--muted); }
.sbanner .why { flex-basis: 100%; margin: 2px 0 0; }
.sbanner .why summary { padding: 8px 12px; }

/* --- Fenêtre d'installation (résumé) --- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade 0.15s; }
.dialog { width: min(440px, 100%); background: var(--card); border-radius: 24px; padding: 22px 20px 16px; box-shadow: var(--pop-shadow); display: flex; flex-direction: column; gap: 16px; animation: pop 0.22s cubic-bezier(.2, .9, .3, 1.1); }
.dialog .head { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; }
.dialog h2 { margin: 2px 0 4px; font-size: 21px; }
.dialog p { margin: 0; color: var(--muted); }
.x-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--field); color: var(--muted); display: grid; place-items: center; }
.x-btn .i { width: 16px; height: 16px; }
.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.perks li { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 13px; font-weight: 600; }
.perks .i { width: 16px; height: 16px; }
.big { height: 50px; border: none; border-radius: 14px; background: linear-gradient(180deg, #9a70fa, var(--accent)); color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 14px var(--accent-ring); }
.later { align-self: center; border: none; background: none; color: var(--muted); padding: 6px 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--inverse); color: var(--on-inverse); border-radius: 14px; padding: 10px 16px; font-size: 14px; box-shadow: var(--pop-shadow); max-width: calc(100vw - 32px); animation: fade 0.15s; }
@keyframes pop { from { opacity: 0; transform: scale(0.97); } }
@keyframes fade { from { opacity: 0; } }

/* --- Téléphone --- */
@media (max-width: 760px) {
    .pa { padding: 12px 12px 28px; gap: 12px; }
    .pa-hero { padding: 26px 20px 18px; border-radius: 22px; }
    .features { grid-template-columns: 1fr; gap: 12px; }
    .trust { grid-template-columns: 1fr; padding: 20px 18px; }
    .trust .vis { order: -1; }
    .pr { padding-top: 8vh; }
    .uh { grid-template-columns: 1fr; padding: 10px 12px 28px; gap: 12px; }
    .sbanner { width: calc(100% - 24px); }
    .sbanner .signin.compact { width: 100%; justify-content: center; }
    .scrim { align-items: flex-end; padding: 0; }
    .dialog { border-radius: 24px 24px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<div class="pv">
    <strong>MAQUETTE · CONNEXION</strong>
    <div class="pv-tabs" role="tablist" id="pv-tabs"></div>
    <span class="sp"></span>

<div id="stage"></div>

<script>
(function () {
    const I = (id) => `<svg class="i" aria-hidden="true"><use href="#i-${id}"/></svg>`;
    const G = `<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;
    const S = { view: 'a', loggedOut: false, use: 'soon', renewedAt: null };
    const stage = document.getElementById('stage');

    // Bouton officiel « Se connecter avec Google » (charte Google : seuls ces libellés sont permis)
    const signin = (label, act = 'signin', extra = '') => `<button class="signin google ${extra}" data-act="${act}">${G}${label || 'Se connecter avec Google'}</button>`;
    const hhmm = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const inMin = (m) => hhmm(new Date(Date.now() + m * 60000));
    const WHY = (open) => `<details class="why" ${open ? 'open' : ''}><summary>${I('clock')}Pourquoi toutes les heures ?${I('down')}</summary>
        <p>One App n'a pas de serveur : vos données vont directement de votre appareil à votre Google Drive. Dans ce cas, Google ne donne accès à votre Drive que pour une heure à la fois. C'est une protection de votre compte, pas une panne.</p></details>`;
    const HOUR = `<div class="hour" aria-hidden="true"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="33" fill="var(--accent-soft)"/><path d="M38 9a29 29 0 1 1-27.6 20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/><path d="M5.5 25.5 10.6 30l4.7-5.8" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>1 h</b></div>`;
    const installBtn = (strong) => `<button class="install ${strong ? 'strong' : ''}" data-act="install">${I('install')}Installer l'application</button>`;
    const legal = `<div class="legal"><a href="../confidentialite.html" target="_blank" rel="noopener">Confidentialité</a></div>`;

    // ---------- Les 4 illustrations ----------
    const VIS = {
        ai: `<div class="vis" aria-hidden="true"><div class="v-ai">
                <div class="bubble"><small>Vous, à une IA</small>« Une app pour suivre mon budget du mois »</div>
                <span class="arrow">${I('arrow')}</span>
                <div class="made"><span class="icon" style="--h:145">💰</span>Budget</div></div></div>`,
        drive: `<div class="vis" aria-hidden="true"><div class="tree">
                <div class="r">${I('drive')}<b>Mon Drive</b></div>
                <div class="r d1 off">${I('folder')}Photos<span class="tag no">invisible</span></div>
                <div class="r d1 off">${I('folder')}Factures<span class="tag no">invisible</span></div>
                <div class="r d1 on">${I('folder')}One App<span class="tag">One App</span></div>
                <div class="r d2 on"><span class="icon xs" style="--h:145">💰</span>Budget</div>
                <div class="r d3">${I('doc')}Budget 2026</div></div></div>`,
        share: `<div class="vis" aria-hidden="true"><div class="v-share">
                <div class="linkpill">${I('link')}<span>bigbangx6.github.io/One-App/?file=…</span></div>
                <div class="people"><span class="person" style="background:#7b5e3b">A</span><span class="person" style="background:#1a73e8">C</span><span class="person" style="background:#0f9d58">L</span></div>
                <div class="seg2"><span class="on">Lecture</span><span>Modification</span></div></div></div>`,
        consent: `<div class="vis" aria-hidden="true"><div class="consent">
                <div class="top">${G}One App souhaite accéder à votre compte Google</div>
                <div class="ask">${I('folder')}<span>Consulter, modifier, créer et supprimer <b>uniquement</b> les fichiers Google Drive que vous utilisez avec cette application</span></div>
                <div class="btns"><span>Annuler</span><span class="go">Continuer</span></div></div></div>`,
        phone: `<div class="vis" aria-hidden="true"><div class="phone">
                <span class="t"></span><span class="t"></span><span class="t"></span><span class="t"></span><span class="me">${I('cloud')}</span><span class="t"></span>
                <span class="offline-badge">${I('wifi-off')}Sans Internet</span></div></div>`
    };
    const FEATS = [
        ['ai', 'Créez vos apps avec une IA', "Demandez à ChatGPT, Claude ou Gemini l'outil dont vous avez besoin : un budget, un agenda, une liste de courses. Collez sa réponse dans One App, l'app est prête."],
        ['drive', 'Tout est rangé dans votre Drive', "Chaque app et chaque document sont des fichiers dans un dossier « One App » de votre Google Drive. One App n'a pas de serveur : rien n'est stocké ailleurs."],
        ['share', 'Partagez comme un fichier Drive', 'Envoyez un lien : vos proches consultent ou modifient le même document, toujours à jour.'],
        ['phone', 'Sur votre téléphone, même sans Internet', "Installez One App sur l'écran d'accueil. Vos modifications sont gardées sur l'appareil et partent dans Drive au retour du réseau."]
    ];
    const TRUST = `
        <div><h2>Pourquoi se connecter avec Google ?</h2>
            <p>One App enregistre vos apps et vos documents dans <b>votre</b> Google Drive. Google vous demandera une autorisation limitée :</p>
            <ul>
                <li>${I('check-c')}<span>One App voit seulement les fichiers qu'il crée, ou ceux que vous choisissez d'ouvrir avec lui.</span></li>
                <li>${I('check-c')}<span>Le reste de votre Drive reste invisible pour One App.</span></li>
                <li>${I('check-c')}<span>Vos données ne sont ni vendues, ni utilisées pour de la publicité.</span></li>
                <li>${I('clock')}<span>Par sécurité, chaque connexion dure <b>1 heure</b>. Ensuite, un clic suffit pour la renouveler.</span></li>
            </ul>
            <a href="../confidentialite.html" target="_blank" rel="noopener">Lire les règles de confidentialité</a></div>
        ${VIS.consent}`;

    // ---------- A · La vitrine ----------
    function viewA() {
        return `<div class="pa">
            <section class="card pa-hero">
                <svg class="i logo"><use href="#i-cloud"/></svg>
                <div class="name">One App</div>
                <h1 class="h-display">Vos propres applications, rangées dans votre Google&nbsp;Drive</h1>
                <p class="lead">Décrivez l'outil dont vous avez besoin à une IA, collez sa réponse : One App en fait une application. Vos données restent chez vous.</p>
                ${signin()}
                ${installBtn()}
                <button class="scroll-hint" data-act="scroll">Comment ça marche ?${I('down')}</button>
            </section>
            <div class="sec-title" id="how"><h2>Comment ça marche</h2><p>Quatre idées, pas de jargon.</p></div>
            <div class="features">${FEATS.map(([v, t, d], k) => `<article class="card feature">${VIS[v]}<div class="txt"><h3><span class="n">${k + 1}</span>${t}</h3><p>${d}</p></div></article>`).join('')}</div>
            <section class="card trust">${TRUST}</section>
            <section class="card pa-end"><h2>Prêt à essayer ?</h2><p class="lead">Gratuit, avec votre compte Google.</p>${signin()}${installBtn()}${legal}</section>
        </div>`;
    }

    // ---------- Retour : déconnecté volontairement (la carte simple) ----------
    function viewR() {
        return `<div class="pr"><section class="card pr-card">
            <svg class="i logo"><use href="#i-cloud"/></svg>
            <h1>One App</h1>
            <p class="lead">Vos propres applications, dans votre Google Drive</p>
            ${signin()}
            ${installBtn()}
            <div class="legal"><a href="../confidentialite.html" target="_blank" rel="noopener">Confidentialité</a><span aria-hidden="true">·</span><button class="discover" data-act="discover">Qu'est-ce que One App ?</button></div>
        </section></div>`;
    }

    // ---------- Retour après plus d'une heure : on renouvelle ----------
    function viewX() {
        return `<div class="pr"><section class="card pr-card ended">
            ${HOUR}
            <h1>Votre heure de connexion est terminée</h1>
            <p class="lead">Google limite chaque connexion à <b>1 heure</b>. Continuez pour la renouveler une heure de plus : vos apps et vos modifications vous attendent.</p>
            ${signin('Continuer avec Google', 'renew-screen')}
            <p class="note">Vous n'avez rien à autoriser de nouveau : en général, un clic suffit.</p>
            ${WHY()}
            ${installBtn()}
            <div class="legal"><a href="../confidentialite.html" target="_blank" rel="noopener">Confidentialité</a><span aria-hidden="true">·</span><button class="discover" data-act="other-account">Changer de compte</button></div>
        </section></div>`;
    }

    // ---------- Pendant l'utilisation : prévenir avant, renouveler sans rien perdre ----------
    function viewU() {
        const until = S.renewedAt || inMin(5);
        const status = S.use === 'ended'
            ? `<span class="u-status off">${I('clock')}Connexion à renouveler</span>`
            : S.use === 'soon'
                ? `<span class="u-status soon">${I('clock')}Encore 5 min<button class="u-renew" data-act="renew-early">Prolonger d'1 h</button></span>`
                : `<span class="u-status">${I('check-c')}Connecté jusqu'à ${until}</span>`;
        const banner = S.use === 'ended' ? `<div class="sbanner" role="alert">
                <span class="clock">${I('clock')}</span>
                <div class="txt"><b>Votre heure de connexion Google est terminée.</b><span>Vos modifications sont gardées sur cet appareil. Continuez pour la renouveler une heure.</span></div>
                ${signin('Continuer avec Google', 'renew-banner', 'compact')}
                ${WHY()}
            </div>` : '';
        const apps = [['Budget', '💰', 145], ['Agenda', '📅', 215], ['Recettes', '🍳', 30], ['Courses', '🛒', 180]];
        return `${banner}<div class="uh">
            <div class="brand"><svg class="i logo"><use href="#i-cloud"/></svg><b>One App</b></div>
            <section class="card u-acc"><b>Alex Martin</b><span class="mail">alex.martin@gmail.com</span>${status}</section>
            <section class="card u-apps">${apps.map(([n, e, h]) => `<div class="a"><span class="icon" style="--h:${h}">${e}</span>${n}</div>`).join('')}</section>
            <section class="card u-docs">
                <div class="d"><span class="icon sm" style="--h:145">💰</span><span>Budget 2026</span><em>À l'instant</em></div>
                <div class="d"><span class="icon sm" style="--h:215">📅</span><span>Planning octobre</span><em>09:15</em></div>
                <div class="d"><span class="icon sm" style="--h:30">🍳</span><span>Gratin dauphinois</span><em>Hier</em></div>
            </section>
            <label style="grid-column:1/-1;justify-self:center;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center">Maquette :
                <select id="pv-use"><option value="soon" ${S.use === 'soon' ? 'selected' : ''}>Il reste 5 min</option><option value="ended" ${S.use === 'ended' ? 'selected' : ''}>Heure terminée</option><option value="ok" ${S.use === 'ok' ? 'selected' : ''}>Connexion active</option></select></label>
        </div>`;
    }

    const VIEWS = { a: ['Première visite', viewA], x: ['Retour après 1 h', viewX], u: ["Pendant l'utilisation", viewU], r: ['Après déconnexion', viewR] };
    function render(keep) {
        const top = stage.scrollTop;
        document.getElementById('pv-tabs').innerHTML = Object.entries(VIEWS).map(([k, [n]]) => `<button role="tab" aria-selected="${S.view === k}" data-view="${k}">${n}</button>`).join('');
        stage.innerHTML = VIEWS[S.view][1]();
        stage.scrollTop = keep ? top : 0;
    }

    function installDialog() {
        const el = document.createElement('div');
        el.className = 'scrim';
        el.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ins-t">
            <div class="head"><span class="appicon">${I('cloud')}</span><div><h2 id="ins-t">Installer One App</h2><p>Ajoutez One App à votre écran d'accueil pour l'ouvrir d'un seul geste, comme une application.</p></div>
            <button class="x-btn" data-close aria-label="Fermer">${I('close')}</button></div>
            <ul class="perks"><li>${I('home')}Sur l'écran d'accueil</li><li>${I('wifi-off')}Marche sans Internet</li><li>${I('check-c')}Gratuit</li></ul>
            <button class="big" data-close>${I('install')}Installer One App</button>
            <button class="later" data-close>Plus tard</button></div>`;
        el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-close]')) el.remove(); });
        document.body.appendChild(el);
        el.querySelector('.big').focus();
    }
    let tt;
    function toast(msg) {
        document.querySelector('.toast')?.remove();
        const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
        document.body.appendChild(t); clearTimeout(tt); tt = setTimeout(() => t.remove(), 2600);
    }

    document.addEventListener('click', (e) => {
        const t = e.target.closest('[data-view],[data-act]');
        if (!t) return;
        if (t.dataset.view) { S.view = t.dataset.view; return render(); }
        switch (t.dataset.act) {
            case 'signin': return toast('Ouvre la fenêtre Google de connexion');
            case 'install': return installDialog();
            case 'renew-screen': S.view = 'u'; S.use = 'ok'; S.renewedAt = inMin(60); render(); return toast(`Connexion renouvelée jusqu'à ${S.renewedAt}`);
            case 'renew-banner':
            case 'renew-early': S.use = 'ok'; S.renewedAt = inMin(60); render(true); return toast(`Connexion renouvelée jusqu'à ${S.renewedAt}. Vos modifications sont envoyées dans Drive.`);
            case 'other-account': return toast('Ouvre la fenêtre Google pour choisir un autre compte');
            case 'scroll': return document.getElementById('how').scrollIntoView({ behavior: 'smooth', block: 'start' });
            case 'discover': S.view = 'a'; return render();
        }
    });
    document.addEventListener('change', (e) => { if (e.target.id === 'pv-use') { S.use = e.target.value; S.renewedAt = null; render(true); } });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.querySelector('.scrim')?.remove();
    });

    document.getElementById('pv-theme').addEventListener('change', (e) => {
        if (e.target.value === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', e.target.value);
    });
    render();
})();
</script>
</body>
</html>
