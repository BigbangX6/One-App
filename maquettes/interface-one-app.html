<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>One App, nouvelle interface</title>
<style>
/* Maquette autonome de l'interface One App, style Google Workspace (Material 3).
   Aucune ressource externe. Rien n'est relié à Google Drive : les données sont fictives.
   Mise en page : barre du haut (logo, recherche, compte) + rail de navigation à gauche
   + une grande surface blanche arrondie pour le contenu, comme Drive.
   Les documents s'ouvrent en plein écran avec un bandeau façon Google Docs. */
:root {
    --font: "Google Sans Text", "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --font-display: "Google Sans", "Google Sans Display", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --logo: #8b5cf6;

    /* Neutres (teinte violette) */
    --bg: #f9f7fd;
    --surface: #ffffff;
    --surface-low: #f3f0fa;
    --surface-high: #ebe7f5;
    --on-surface: #1f1f1f;
    --on-surface-var: #444746;
    --outline: #747775;
    --divider: #e3e1e8;
    --hover: rgba(31, 31, 31, 0.08);
    --inverse: #303033;
    --on-inverse: #f2f2f2;
    --scrim: rgba(0, 0, 0, 0.32);
    --danger: #b3261e;
    --danger-soft: #fce8e6;
    --ok: #146c2e;
    --warn: #7a4f00;
    --warn-soft: #fff1d6;
    --code-bg: #1e1e24;
    --code-fg: #d7d5e0;
    --code-dim: #7c7a88;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
    --shadow-3: 0 4px 8px 3px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.3);

    /* Couleur principale (violet One App, façon Material 3) */
    --primary: #6b46c1;
    --on-primary: #ffffff;
    --primary-soft: #eaddff;
    --on-primary-soft: #21005d;
    --nav-active: #e5d9fb;
    --on-nav-active: #21005d;

    /* L'app de l'utilisateur, affichée dans le cadre */
    --app-bg: #ffffff;
    --app-card: #f6f6f8;
    --app-fg: #222222;
    --app-dim: #77777f;
    --app-accent: #0f9d58;
    --app-red: #d93025;
}
:root[data-tint="blue"] {
    --bg: #f8fafd; --surface-low: #f0f4f9; --surface-high: #e9eef6; --divider: #e1e3e1;
    --primary: #0b57d0; --on-primary: #ffffff; --primary-soft: #d3e3fd; --on-primary-soft: #041e49;
    --nav-active: #c2e7ff; --on-nav-active: #001d35;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #1b1b1c; --surface: #131314; --surface-low: #1e1f20; --surface-high: #282a2c;
        --on-surface: #e3e3e3; --on-surface-var: #c4c7c5; --outline: #8e918f; --divider: #3a3b3d;
        --hover: rgba(227, 227, 227, 0.08); --inverse: #e3e3e3; --on-inverse: #1f1f1f; --scrim: rgba(0, 0, 0, 0.6);
        --danger: #f2b8b5; --danger-soft: #3c1513; --ok: #6dd58c; --warn: #ffd88a; --warn-soft: #3a2d10;
        --code-bg: #0e0e11; --code-fg: #d7d5e0; --code-dim: #6c6a78;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.6), 0 1px 3px 1px rgba(0, 0, 0, 0.3);
        --shadow-2: 0 1px 2px rgba(0, 0, 0, 0.6), 0 2px 6px 2px rgba(0, 0, 0, 0.3);
        --shadow-3: 0 4px 8px 3px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.6);
        --primary: #d0bcff; --on-primary: #381e72; --primary-soft: #4f378b; --on-primary-soft: #eaddff;
        --nav-active: #4a3880; --on-nav-active: #eaddff;
        --app-bg: #1c1c1f; --app-card: #26262a; --app-fg: #ececf1; --app-dim: #9a9aa3; --app-accent: #5bd28f; --app-red: #f28b82;
        color-scheme: dark;
    }
    :root:not([data-theme="light"])[data-tint="blue"] {
        --primary: #a8c7fa; --on-primary: #062e6f; --primary-soft: #0842a0; --on-primary-soft: #d3e3fd;
        --nav-active: #004a77; --on-nav-active: #c2e7ff;
    }
}
:root[data-theme="dark"] {
    --bg: #1b1b1c; --surface: #131314; --surface-low: #1e1f20; --surface-high: #282a2c;
    --on-surface: #e3e3e3; --on-surface-var: #c4c7c5; --outline: #8e918f; --divider: #3a3b3d;
    --hover: rgba(227, 227, 227, 0.08); --inverse: #e3e3e3; --on-inverse: #1f1f1f; --scrim: rgba(0, 0, 0, 0.6);
    --danger: #f2b8b5; --danger-soft: #3c1513; --ok: #6dd58c; --warn: #ffd88a; --warn-soft: #3a2d10;
    --code-bg: #0e0e11; --code-fg: #d7d5e0; --code-dim: #6c6a78;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.6), 0 1px 3px 1px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, 0.6), 0 2px 6px 2px rgba(0, 0, 0, 0.3);
    --shadow-3: 0 4px 8px 3px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.6);
    --primary: #d0bcff; --on-primary: #381e72; --primary-soft: #4f378b; --on-primary-soft: #eaddff;
    --nav-active: #4a3880; --on-nav-active: #eaddff;
    --app-bg: #1c1c1f; --app-card: #26262a; --app-fg: #ececf1; --app-dim: #9a9aa3; --app-accent: #5bd28f; --app-red: #f28b82;
    color-scheme: dark;
}
:root[data-theme="dark"][data-tint="blue"] {
    --primary: #a8c7fa; --on-primary: #062e6f; --primary-soft: #0842a0; --on-primary-soft: #d3e3fd;
    --nav-active: #004a77; --on-nav-active: #c2e7ff;
}

/* --- Base --- */
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
    margin: 0; background: var(--bg); color: var(--on-surface); font-family: var(--font); font-size: 14px;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.i { width: 24px; height: 24px; flex: none; fill: currentColor; display: block; }
.i.s20 { width: 20px; height: 20px; }
.i.s18 { width: 18px; height: 18px; }

/* --- Barre de la maquette (à ne pas reprendre) --- */
.preview-bar {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 16px;
    font-size: 12px; color: var(--on-surface-var); border-bottom: 1px dashed var(--outline); background: var(--surface-low);
}
.preview-bar strong { color: var(--on-surface); letter-spacing: 0.06em; font-size: 11px; }
.preview-bar label { display: inline-flex; align-items: center; gap: 6px; }
.preview-bar select { font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--divider); background: var(--surface); max-width: 46vw; }

/* --- Éléments communs --- */
.icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--on-surface-var);
    display: inline-grid; place-items: center; flex: none; position: relative;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn:disabled { opacity: 0.38; cursor: default; background: transparent; }
.btn {
    height: 40px; border-radius: 20px; padding: 0 24px; border: none; font-weight: 500; letter-spacing: 0.01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; flex: none;
}
.btn .i { width: 18px; height: 18px; margin-left: -6px; }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.filled:hover { box-shadow: var(--shadow-1); filter: brightness(1.06); }
.btn.tonal { background: var(--nav-active); color: var(--on-nav-active); }
.btn.tonal:hover { box-shadow: var(--shadow-1); }
.btn.outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.btn.outlined:hover, .btn.text:hover { background: var(--hover); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
.btn.danger { background: var(--danger); color: var(--surface); }
.avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #7b5e3b; color: #fff; font-weight: 500; font-size: 15px;
    display: grid; place-items: center; flex: none;
}
.avatar.lg { width: 80px; height: 80px; font-size: 36px; }
.app-tile {
    width: 40px; height: 40px; border-radius: 10px; background: var(--primary-soft); display: grid; place-items: center;
    font-size: 22px; line-height: 1; flex: none;
}
.app-tile.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 16px; }
.logo { width: 40px; height: 40px; color: var(--logo); }
.logo-word { font-family: var(--font-display); font-size: 22px; color: var(--on-surface-var); white-space: nowrap; }
.chip {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--outline); background: transparent; font-size: 14px; font-weight: 500; color: var(--on-surface-var);
}
.chip:hover { background: var(--hover); }
.chip .i { width: 18px; height: 18px; }
.badge-shared { display: inline-flex; color: var(--on-surface-var); }
.badge-shared .i { width: 16px; height: 16px; }

/* --- Écran de connexion (façon page de connexion Google) --- */
.center-screen { flex: 1; overflow: auto; display: grid; place-items: center; padding: 24px 16px; }
.signin {
    width: min(448px, 100%); background: var(--surface); border-radius: 28px; padding: 40px 40px 32px;
    display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--divider);
}
.signin .logo { width: 48px; height: 48px; }
.signin h1 { font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1.25; margin: 8px 0 0; text-wrap: balance; }
.signin p { margin: 0; color: var(--on-surface-var); font-size: 16px; line-height: 1.5; }
.g-btn {
    height: 48px; border-radius: 24px; border: 1px solid var(--outline); background: var(--surface); color: var(--on-surface);
    display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 500; font-size: 15px; margin-top: 16px;
}
.g-btn:hover { background: var(--hover); }
.g-btn svg { width: 20px; height: 20px; }
.signin .fine { font-size: 13px; display: flex; gap: 10px; align-items: flex-start; color: var(--on-surface-var); margin-top: 8px; line-height: 1.45; }
.signin .fine .i { width: 18px; height: 18px; margin-top: 1px; color: var(--ok); }
.shared-card { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--surface-low); }
.shared-card b { display: block; font-weight: 500; font-size: 15px; }
.shared-card span { color: var(--on-surface-var); font-size: 13px; }

/* --- Coquille façon Drive --- */
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 256px 1fr; grid-template-rows: 64px auto 1fr; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 6px; width: 240px; flex: none; padding-left: 8px; background: none; border: none; }
.brand .logo { width: 36px; height: 36px; }
.menu-btn { display: none; }
.search {
    flex: 1; max-width: 720px; height: 48px; border-radius: 24px; background: var(--surface-high); display: flex; align-items: center;
    gap: 4px; padding: 0 6px; min-width: 0;
}
.search:focus-within { background: var(--surface); box-shadow: var(--shadow-1); }
.search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 16px; height: 100%; }
.search input::placeholder { color: var(--on-surface-var); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.sync-pill {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px;
    color: var(--on-surface-var); border: none; background: transparent;
}
.sync-pill:hover { background: var(--hover); }
.sync-pill .i { width: 20px; height: 20px; }
.sync-pill.offline { background: var(--warn-soft); color: var(--warn); }
.avatar-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; display: grid; place-items: center; }
.avatar-btn:hover { background: var(--hover); }

.banner-slot { grid-column: 1 / -1; }
.banner {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 0 16px 8px; padding: 10px 12px 10px 16px; border-radius: 12px;
    background: var(--warn-soft); color: var(--warn); font-size: 14px;
}
.banner .i { width: 20px; height: 20px; }
.banner span { flex: 1; min-width: 200px; }
.banner .btn.text { color: var(--warn); font-weight: 600; }

.rail { padding: 8px 16px 16px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.new-btn {
    height: 56px; border-radius: 16px; border: none; background: var(--surface); color: var(--on-surface); box-shadow: var(--shadow-1);
    display: inline-flex; align-items: center; gap: 12px; padding: 0 20px 0 16px; font-size: 14px; font-weight: 500; align-self: flex-start; margin: 0 0 16px 4px;
}
.new-btn:hover { box-shadow: var(--shadow-2); background: var(--surface-low); }
.nav-item {
    height: 32px; border-radius: 16px; border: none; background: transparent; display: flex; align-items: center; gap: 16px;
    padding: 0 12px 0 16px; font-size: 14px; color: var(--on-surface); text-align: left; width: 100%;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--nav-active); color: var(--on-nav-active); font-weight: 600; }
.nav-item .i { width: 20px; height: 20px; }
.nav-sep { height: 1px; background: var(--divider); margin: 12px 0 12px 16px; }
.nav-label { font-size: 12px; color: var(--on-surface-var); padding: 0 16px 6px; font-weight: 500; }
.nav-app .app-tile { width: 22px; height: 22px; font-size: 13px; border-radius: 6px; background: transparent; }
.rail-foot { margin-top: auto; padding: 16px 16px 0; font-size: 12px; color: var(--on-surface-var); line-height: 1.5; }

.content { background: var(--surface); border-radius: 16px; margin: 0 16px 16px 0; overflow-y: auto; min-width: 0; padding: 4px 24px 32px; }
.content-head { position: sticky; top: 0; z-index: 2; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 16px 0 8px; flex-wrap: wrap; }
.content-head h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; line-height: 1.3; flex: 1; min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; font-family: var(--font-display); font-size: 24px; }
.crumbs button { border: none; background: transparent; border-radius: 20px; padding: 2px 10px; font-weight: 400; display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.crumbs button:hover { background: var(--hover); }
.crumbs .muted { color: var(--on-surface-var); }
.crumbs .i { color: var(--on-surface-var); }
.crumbs .cur { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-t { font-size: 14px; font-weight: 500; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; color: var(--on-surface); }

/* Cartes d'applications façon « dossiers suggérés » */
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.app-card {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px 10px 12px; border-radius: 12px; background: var(--surface-low);
    border: none; text-align: left; min-width: 0;
}
.app-card:hover { background: var(--surface-high); }
.app-card .txt { flex: 1; min-width: 0; }
.app-card b { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-card span { font-size: 12px; color: var(--on-surface-var); }
.app-card.add { background: transparent; border: 1px dashed var(--outline); color: var(--on-surface-var); }
.app-card.add .app-tile { background: transparent; color: var(--primary); }
.app-card.add:hover { background: var(--hover); }

/* Liste de documents façon Drive */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-weight: 500; font-size: 14px; color: var(--on-surface); padding: 0 8px; height: 48px; border-bottom: 1px solid var(--divider); }
.table td { padding: 0 8px; height: 48px; border-bottom: 1px solid var(--divider); color: var(--on-surface-var); white-space: nowrap; }
.table tr.row { cursor: pointer; }
.table tr.row:hover td { background: var(--hover); }
.table td.name { color: var(--on-surface); font-weight: 500; width: 55%; }
.table .name-in { display: flex; align-items: center; gap: 14px; min-width: 0; }
.table .name-in > span { overflow: hidden; text-overflow: ellipsis; }
.table .sub { display: none; font-weight: 400; font-size: 12px; color: var(--on-surface-var); }
.table td.act { width: 48px; text-align: right; }
.table .app-cell { display: inline-flex; gap: 8px; align-items: center; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 48px 16px; color: var(--on-surface-var); }
.empty .art { width: 120px; height: 120px; border-radius: 50%; background: var(--surface-low); display: grid; place-items: center; font-size: 52px; }
.empty h2 { margin: 8px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--on-surface); }
.empty p { margin: 0; max-width: 40ch; line-height: 1.5; }

.fab {
    display: none; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; height: 56px; min-width: 56px; padding: 0 20px 0 16px;
    border-radius: 16px; border: none; background: var(--primary-soft); color: var(--on-primary-soft); box-shadow: var(--shadow-3);
    align-items: center; gap: 12px; font-weight: 500;
}

/* --- Document ouvert, bandeau façon Google Docs --- */
.doc { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.docbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 12px 8px 8px; min-width: 0; }
.doc-home { width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; display: grid; place-items: center; flex: none; }
.doc-home:hover { background: var(--hover); }
.doc-home .app-tile { width: 36px; height: 36px; font-size: 20px; }
.doc-titles { display: flex; flex-direction: column; min-width: 0; flex: 1; padding-left: 4px; }
.doc-title-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
.doc-title {
    font-family: var(--font-display); font-size: 18px; border: 1px solid transparent; border-radius: 4px; padding: 1px 6px; margin-left: -7px;
    background: transparent; min-width: 0; width: 100%; max-width: 360px; outline: none; text-overflow: ellipsis;
}
.doc-title:hover { border-color: var(--outline); }
.doc-title:focus { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.doc-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--on-surface-var); min-width: 0; white-space: nowrap; }
.status-btn { display: inline-flex; align-items: center; gap: 4px; border: none; background: transparent; padding: 2px 6px; margin-left: -6px; border-radius: 4px; color: var(--on-surface-var); font-size: 13px; }
.status-btn:hover { background: var(--hover); }
.status-btn .i { width: 18px; height: 18px; }
.status-btn.offline { color: var(--warn); }
.status-btn.error { color: var(--danger); }
.status-btn.saving .i { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
.doc-actions { display: flex; align-items: center; gap: 2px; flex: none; }
.vsep { width: 1px; height: 24px; background: var(--divider); margin: 0 6px; }
.mode-chip {
    height: 40px; border-radius: 20px; border: none; background: transparent; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 12px;
    color: var(--on-surface-var); font-weight: 500;
}
.mode-chip:hover { background: var(--hover); }
.mode-chip .i { width: 20px; height: 20px; }
.share-btn { margin-left: 6px; }
.share-btn .i { margin-left: -4px; }
.ro-bar {
    flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 12px 8px; padding: 6px 8px 6px 16px; border-radius: 12px;
    background: var(--surface-high); color: var(--on-surface); font-size: 14px;
}
.ro-bar .i { width: 20px; height: 20px; color: var(--on-surface-var); }
.ro-bar span { flex: 1; min-width: 180px; }
.doc-body { flex: 1; min-height: 0; display: flex; gap: 0; }
.frame { flex: 1; min-width: 0; background: var(--app-bg); color: var(--app-fg); border-radius: 16px 16px 0 0; margin: 0 12px; overflow: auto; box-shadow: var(--shadow-1); position: relative; }
.preview-tag {
    position: sticky; top: 12px; margin: 12px auto -44px; z-index: 2; width: max-content; display: flex; align-items: center; gap: 8px;
    background: var(--inverse); color: var(--on-inverse); padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 500;
}
.preview-tag .i { width: 18px; height: 18px; }

/* Barre de l'historique façon Docs */
.histbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; flex-wrap: wrap; }
.histbar h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-panel {
    width: 300px; flex: none; background: var(--surface); border-radius: 16px 0 0 0; display: flex; flex-direction: column; overflow: hidden;
    margin-left: -4px; box-shadow: var(--shadow-1);
}
.hist-head { padding: 16px 20px 8px; font-family: var(--font-display); font-size: 18px; }
.hist-list { overflow-y: auto; padding: 0 8px 16px; }
.hist-group { font-size: 12px; font-weight: 500; color: var(--on-surface-var); padding: 14px 12px 6px; }
.hist-item { width: 100%; border: none; background: transparent; text-align: left; padding: 10px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 3px; }
.hist-item:hover { background: var(--hover); }
.hist-item.sel { background: var(--nav-active); color: var(--on-nav-active); }
.hist-item b { font-weight: 500; font-size: 14px; }
.hist-item .cur { font-size: 12px; font-style: italic; color: var(--on-surface-var); }
.hist-item .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-surface-var); }
.hist-item .dot { width: 8px; height: 8px; border-radius: 50%; }

/* --- App fictive affichée dans le cadre --- */
.mini { padding: 28px clamp(16px, 4vw, 40px) 40px; max-width: 880px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.mini-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mini h2 { margin: 0; font-size: 22px; font-weight: 700; }
.mini-btn { border: none; background: var(--app-accent); color: var(--app-bg); border-radius: 8px; padding: 9px 14px; font-weight: 600; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
.mini-card { background: var(--app-card); border-radius: 12px; padding: 14px 16px; }
.mini-card span { font-size: 12px; color: var(--app-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.mini-card b { display: block; font-size: 24px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.mini-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.mini-table td, .mini-table th { padding: 10px 6px; border-bottom: 1px solid var(--app-card); text-align: left; }
.mini-table th { font-size: 12px; color: var(--app-dim); font-weight: 600; }
.mini-table td:last-child, .mini-table th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.mini-table .neg { color: var(--app-red); }
.mini-table .pos { color: var(--app-accent); }
.mini-list { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-direction: column; gap: 8px; }
.mini-list li { background: var(--app-card); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.mini-list .when { font-size: 12px; color: var(--app-dim); min-width: 74px; font-variant-numeric: tabular-nums; }
.mini-wrap { overflow-x: auto; }

/* --- Éditeur de code d'une app --- */
.editor-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; gap: 12px; padding: 0 12px 12px; }
.guide { background: var(--surface); border-radius: 16px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.guide h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.guide > p { margin: 0 0 12px; color: var(--on-surface-var); line-height: 1.5; }
.gstep { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--divider); }
.gnum { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--on-primary-soft); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.gstep > div > b { font-weight: 500; display: block; margin: 4px 0 4px; }
.gstep p b { font-weight: 600; color: var(--on-surface); }
.gstep p { margin: 0 0 10px; color: var(--on-surface-var); line-height: 1.5; font-size: 13px; }
.gstep p:last-child { margin-bottom: 0; }
.code-pane { background: var(--code-bg); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.code-top { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; color: var(--code-dim); font-size: 13px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.code-top span { flex: 1; }
.code-top .icon-btn { color: var(--code-dim); width: 36px; height: 36px; }
.code-top .icon-btn:hover { background: rgba(255, 255, 255, 0.08); }
.code-pane textarea { flex: 1; min-height: 240px; border: none; outline: none; resize: none; background: transparent; color: var(--code-fg); font-family: var(--font-mono); font-size: 13px; line-height: 1.6; padding: 14px 16px; white-space: pre; }

/* --- Menus, dialogues, snackbar --- */
.menu {
    position: fixed; z-index: 60; min-width: 220px; max-width: calc(100vw - 16px); background: var(--surface-low); border-radius: 8px;
    box-shadow: var(--shadow-2); padding: 8px 0; animation: fade 0.12s ease-out;
}
:root[data-theme="dark"] .menu { background: var(--surface-high); }
.menu button { width: 100%; height: 40px; border: none; background: transparent; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left; font-size: 14px; color: var(--on-surface); }
.menu button:hover { background: var(--hover); }
.menu button .i { width: 20px; height: 20px; color: var(--on-surface-var); }
.menu button.danger, .menu button.danger .i { color: var(--danger); }
.menu button.checked { font-weight: 600; }
.menu button .desc { display: block; font-size: 12px; color: var(--on-surface-var); font-weight: 400; }
.menu button.tall { height: auto; padding-top: 8px; padding-bottom: 8px; }
.menu hr { border: none; height: 1px; background: var(--divider); margin: 8px 0; }
.menu .ck { margin-left: auto; color: var(--primary); }
@keyframes fade { from { opacity: 0; transform: scale(0.98); } }

.account {
    position: fixed; z-index: 60; right: 8px; top: 60px; width: min(400px, calc(100vw - 16px)); background: var(--surface-low); border-radius: 28px;
    box-shadow: var(--shadow-3); padding: 12px; animation: fade 0.12s ease-out;
}
.account-mail { text-align: center; font-size: 14px; font-weight: 500; padding: 8px 40px 16px; color: var(--on-surface); position: relative; }
.account-mail .icon-btn { position: absolute; right: 0; top: -2px; }
.account-id { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 18px; }
.account-id .hello { font-family: var(--font-display); font-size: 22px; }
.account-rows { background: var(--surface); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.account-rows button { border: none; background: var(--surface); display: flex; align-items: center; gap: 14px; padding: 16px 20px; font-size: 14px; text-align: left; }
.account-rows button:hover { background: var(--hover); }
.account-rows .i { color: var(--on-surface-var); }
.account-foot { text-align: center; font-size: 12px; color: var(--on-surface-var); padding: 14px 8px 4px; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fadein 0.15s; }
.scrim.clear { background: transparent; }
@keyframes fadein { from { opacity: 0; } }
.dialog {
    width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 28px; padding: 24px;
    box-shadow: var(--shadow-3); display: flex; flex-direction: column; gap: 16px; animation: fade 0.18s ease-out;
}
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
.dialog h2 span { flex: 1; min-width: 0; }
.dialog .lead { margin: -6px 0 0; color: var(--on-surface-var); line-height: 1.5; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 8px; }
.dialog-actions .spacer { flex: 1; }
.access { display: flex; gap: 14px; align-items: flex-start; padding: 8px 0; }
.access-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-high); color: var(--on-surface-var); }
.access-ic.open { background: #c4eed0; color: #0d652d; }
:root[data-theme="dark"] .access-ic.open { background: #0f5223; color: #c4eed0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .access-ic.open { background: #0f5223; color: #c4eed0; } }
.access-ic .i { width: 20px; height: 20px; }
.access-main { flex: 1; min-width: 0; }
.dd { border: none; background: transparent; border-radius: 4px; padding: 4px 4px 4px 8px; margin-left: -8px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
.dd:hover { background: var(--hover); }
.dd .i { width: 20px; height: 20px; }
.access-main p { margin: 2px 0 0; font-size: 13px; color: var(--on-surface-var); }
.role { border: none; background: transparent; border-radius: 4px; display: inline-flex; align-items: center; gap: 2px; padding: 6px 4px 6px 10px; color: var(--on-surface-var); font-weight: 500; }
.role:hover { background: var(--hover); }
.subt { font-size: 16px; font-weight: 500; margin: 4px 0 -4px; }
.qr { display: flex; gap: 16px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface-low); }
.qr canvas { width: 116px; height: 116px; border-radius: 8px; background: #fff; flex: none; image-rendering: pixelated; }
.qr p { margin: 0; color: var(--on-surface-var); line-height: 1.5; font-size: 13px; }
.steps-v { display: flex; flex-direction: column; gap: 0; }
.steps-v .gstep:first-child { border-top: none; }
.ex { display: inline-block; margin-top: 2px; padding: 6px 10px; border-radius: 8px; background: var(--surface-low); font-size: 13px; color: var(--on-surface); }
.field { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--outline); border-radius: 8px; background: transparent; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; }
.field:focus { outline: none; border: 2px solid var(--primary); padding: 9px 11px; }
.pick-list { display: flex; flex-direction: column; gap: 4px; }
.pick { display: flex; align-items: center; gap: 12px; border: none; background: transparent; padding: 8px 10px; border-radius: 12px; text-align: left; font-size: 15px; }
.pick:hover { background: var(--hover); }

.snackbar {
    position: fixed; left: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 80; max-width: min(560px, calc(100vw - 32px)); background: var(--inverse); color: var(--on-inverse);
    border-radius: 4px; box-shadow: var(--shadow-3); display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; min-height: 48px; font-size: 14px;
    animation: snack 0.2s ease-out;
}
.snackbar span { flex: 1; padding: 8px 0; }
.snackbar .btn.text { color: var(--primary-soft); }
@keyframes snack { from { transform: translateY(12px); opacity: 0; } }

/* --- Petits écrans --- */
@media (max-width: 1100px) { .doc-actions .label-wide { display: none; } }
@media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .rail {
        position: fixed; left: 0; top: 0; bottom: 0; width: 300px; max-width: 86vw; z-index: 55; background: var(--surface); border-radius: 0 16px 16px 0;
        padding-top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-105%); transition: transform 0.22s ease; box-shadow: var(--shadow-3);
    }
    .rail.open { transform: none; }
    .rail .new-btn { display: none; }
    .rail-head { display: flex !important; }
    .menu-btn { display: inline-grid; }
    .brand { width: auto; }
    .brand .logo-word { display: none; }
    .content { margin: 0; border-radius: 16px 16px 0 0; padding: 0 16px 96px; }
    .fab { display: inline-flex; }
    .sync-pill .lbl { display: none; }
    .table th.hide-sm, .table td.hide-sm { display: none; }
    .table .sub { display: block; }
    .table td { height: 60px; }
    .table td.name { width: auto; }
    .editor-body { grid-template-columns: 1fr; overflow-y: auto; }
    .app-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .app-card { flex-wrap: wrap; position: relative; padding: 12px; gap: 10px; }
    .app-card .txt { flex-basis: 100%; }
    .app-card .icon-btn { position: absolute; top: 4px; right: 4px; }
    .app-card.add { grid-column: 1 / -1; flex-wrap: nowrap; }
    .app-card.add .txt { flex-basis: auto; }
    .code-pane { min-height: 360px; }
    .hist-panel { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 46%; border-radius: 24px 24px 0 0; z-index: 20; margin: 0; box-shadow: var(--shadow-3); }
    .crumbs, .content-head h1 { font-size: 20px; }
}
@media (max-width: 640px) {
    .doc-actions .hide-xs { display: none; }
    .share-btn { width: 40px; padding: 0; }
    .share-btn .txt { display: none; }
    .share-btn .i { margin: 0; }
    .mode-chip .txt { display: none; }
    .frame { margin: 0; border-radius: 12px 12px 0 0; }
    .ro-bar { margin: 0 8px 8px; }
    .signin { padding: 32px 24px 24px; }
    .doc-title { font-size: 16px; }
    .search { height: 44px; }
    .snackbar { left: 16px; right: 16px; }
}
.rail-head { display: none; align-items: center; gap: 6px; padding: 0 8px 16px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<div id="root" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>

<script>
(function () {
    // --- Données fictives ---
    const ME = { first: 'Alex', email: 'alex.martin@gmail.com', initial: 'A' };
    const APPS = [
        { id: 'budget', name: 'Budget', icon: '💰' },
        { id: 'agenda', name: 'Agenda partagé', icon: '📅', shared: 'Camille' },
        { id: 'recettes', name: 'Recettes', icon: '🍳' },
        { id: 'courses', name: 'Liste de courses', icon: '🛒' },
        { id: 'notes', name: 'Notes de réunion', icon: '📝' },
        { id: 'sport', name: 'Suivi sport', icon: '🏃' }
    ];
    const DOCS = [
        { id: 'b26', app: 'budget', name: 'Budget 2026', mod: '10:42', who: 'moi' },
        { id: 'plan', app: 'agenda', name: 'Planning octobre', mod: '09:15', who: 'Camille', shared: true, readonly: true },
        { id: 'gratin', app: 'recettes', name: 'Gratin dauphinois', mod: 'hier', who: 'moi' },
        { id: 'sem', app: 'courses', name: 'Courses de la semaine', mod: 'hier', who: 'moi' },
        { id: 'b25', app: 'budget', name: 'Budget 2025', mod: '28 sept.', who: 'moi' },
        { id: 'cr', app: 'notes', name: 'Réunion équipe du 24/09', mod: '24 sept.', who: 'moi' },
        { id: 'tarte', app: 'recettes', name: 'Tarte aux pommes', mod: '12 sept.', who: 'moi' },
        { id: 'bvac', app: 'budget', name: 'Vacances en Bretagne', mod: '3 août', who: 'moi' }
    ];
    const HISTORY = [
        { g: "Aujourd'hui", items: [{ t: "1 oct., 10:42", cur: true, who: 'Alex Martin', c: '#7b5e3b' }, { t: '1 oct., 08:05', who: 'Alex Martin', c: '#7b5e3b' }] },
        { g: 'Hier', items: [{ t: '30 sept., 18:12', who: 'Alex Martin', c: '#7b5e3b' }, { t: '30 sept., 12:47', who: 'Sam (téléphone)', c: '#1a73e8' }] },
        { g: 'Septembre', items: [{ t: '22 sept., 21:30', who: 'Alex Martin', c: '#7b5e3b' }, { t: '2 sept., 09:00', who: 'Alex Martin', c: '#7b5e3b' }] }
    ];
    const appOf = (id) => APPS.find((a) => a.id === id);
    const docsOf = (appId) => DOCS.filter((d) => d.app === appId);

    // --- État ---
    const S = {
        screen: 'home', nav: 'home', appId: 'budget', docId: 'b26', query: '', mode: 'edit',
        net: 'online', status: 'saved', histSel: 0, shareLevel: 'private', shareRole: 'reader', showQr: false, dialog: null, drawer: false
    };

    const $ = (s, r = document) => r.querySelector(s);
    const I = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const G_LOGO = `<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;

    // --- Statut de synchronisation (comme le petit nuage de Google Docs) ---
    const STATUS = {
        saved: { icon: 'cloud-done', txt: 'Enregistré dans Drive', cls: '' },
        saving: { icon: 'sync', txt: 'Enregistrement…', cls: 'saving' },
        offline: { icon: 'cloud-off', txt: 'Hors connexion · enregistré sur cet appareil', cls: 'offline' },
        error: { icon: 'error', txt: "Échec de l'envoi · nouvel essai dans 10 s", cls: 'error' }
    };
    function docStatus() { return S.net === 'offline' ? 'offline' : S.status; }

    // =========================================================
    //  ÉCRANS
    // =========================================================
    function viewLogin() {
        return `<div class="center-screen"><div class="signin">
            <svg class="i logo"><use href="#i-cloud"/></svg>
            <h1>Bienvenue dans One App</h1>
            <p>Vos applications sur mesure, enregistrées dans votre Google Drive.</p>
            <button class="g-btn" data-go="home">${G_LOGO}Continuer avec Google</button>
            <div class="fine">${I('shield')}<span>One App n'a pas de serveur. Vos fichiers restent dans votre Drive, dans un dossier « One App ».</span></div>
        </div></div>`;
    }

    function viewInvite() {
        return `<div class="center-screen"><div class="signin">
            <svg class="i logo"><use href="#i-cloud"/></svg>
            <h1>Camille vous a partagé un document</h1>
            <div class="shared-card"><span class="app-tile">📅</span><div><b>Planning octobre</b><span>Ouvert avec l'app Agenda partagé · Lecture seule</span></div></div>
            <button class="g-btn" data-go="doc-ro">${G_LOGO}Continuer avec Google pour l'ouvrir</button>
            <div class="fine">${I('info')}<span>Le document et son app seront ajoutés à votre One App. Rien n'est copié : vous voyez toujours la dernière version.</span></div>
        </div></div>`;
    }

    function shellTop() {
        const st = S.net === 'offline'
            ? `<button class="sync-pill offline" data-act="sync-info" title="Hors connexion">${I('cloud-off')}<span class="lbl">Hors connexion</span></button>`
            : `<button class="sync-pill" data-act="sync-info" title="Tout est enregistré dans Drive">${I('cloud-done')}<span class="lbl">À jour</span></button>`;
        return `<header class="topbar">
            <button class="icon-btn menu-btn" data-act="drawer" aria-label="Menu">${I('menu')}</button>
            <button class="brand" data-go="home" aria-label="Accueil One App"><svg class="i logo"><use href="#i-cloud"/></svg><span class="logo-word">One App</span></button>
            <label class="search">
                <span class="icon-btn" aria-hidden="true">${I('search')}</span>
                <input id="q" type="search" placeholder="Rechercher une app ou un document" value="${esc(S.query)}" autocomplete="off">
                ${S.query ? `<button class="icon-btn" data-act="clear-q" aria-label="Effacer">${I('close')}</button>` : ''}
            </label>
            <div class="top-right">${st}
                <button class="avatar-btn" data-act="account" aria-label="Compte Google : ${ME.email}"><span class="avatar">${ME.initial}</span></button>
            </div>
        </header>
        <div class="banner-slot">${S.net === 'expired' ? `<div class="banner">${I('error')}<span>Votre session Google a expiré. Vos modifications sont gardées sur cet appareil.</span><button class="btn text" data-act="reconnect">Se reconnecter</button></div>` : ''}</div>`;
    }

    function rail() {
        const appsNav = APPS.map((a) => `<button class="nav-item nav-app ${S.screen === 'app' && S.appId === a.id ? 'active' : ''}" data-app="${a.id}"><span class="app-tile">${a.icon}</span>${esc(a.name)}</button>`).join('');
        return `<nav class="rail ${S.drawer ? 'open' : ''}" aria-label="Navigation">
            <div class="rail-head"><svg class="i logo"><use href="#i-cloud"/></svg><span class="logo-word">One App</span></div>
            <button class="new-btn" data-act="new">${I('add')}Nouveau</button>
            <button class="nav-item ${S.screen === 'home' && S.nav === 'home' ? 'active' : ''}" data-nav="home">${I('home', 's20')}Accueil</button>
            <button class="nav-item ${S.screen === 'home' && S.nav === 'shared' ? 'active' : ''}" data-nav="shared">${I('people', 's20')}Partagés avec moi</button>
            <div class="nav-sep"></div>
            <div class="nav-label">Mes applications</div>
            ${appsNav}
            <div class="rail-foot">Vos données sont dans<br><b>Mon Drive › One App</b></div>
        </nav>`;
    }

    function docRow(d, showApp = true) {
        const a = appOf(d.app);
        return `<tr class="row" data-doc="${d.id}">
            <td class="name"><div class="name-in"><span class="app-tile sm">${a.icon}</span><span>${esc(d.name)}
                ${d.shared ? `<span class="badge-shared" title="Partagé par ${d.who}">${I('people')}</span>` : ''}
                <span class="sub">${showApp ? esc(a.name) + ' · ' : ''}${d.mod}</span></span></div></td>
            ${showApp ? `<td class="hide-sm"><span class="app-cell">${esc(a.name)}</span></td>` : ''}
            <td class="hide-sm">${d.mod}${d.who !== 'moi' ? ` · ${esc(d.who)}` : ''}</td>
            <td class="act"><button class="icon-btn" data-docmenu="${d.id}" aria-label="Actions pour ${esc(d.name)}">${I('more', 's20')}</button></td>
        </tr>`;
    }

    function viewHome() {
        const q = S.query.trim().toLowerCase();
        const sharedOnly = S.nav === 'shared';
        let apps = APPS.filter((a) => (!sharedOnly || a.shared) && (!q || a.name.toLowerCase().includes(q)));
        let docs = DOCS.filter((d) => (!sharedOnly || d.shared) && (!q || d.name.toLowerCase().includes(q) || appOf(d.app).name.toLowerCase().includes(q)));
        const title = q ? `Résultats pour « ${esc(S.query)} »` : sharedOnly ? 'Partagés avec moi' : `Bonjour ${ME.first}`;
        const appCards = apps.map((a) => {
            const n = docsOf(a.id).length;
            return `<div class="app-card" role="button" tabindex="0" data-app="${a.id}"><span class="app-tile">${a.icon}</span>
                <div class="txt"><b>${esc(a.name)}${a.shared ? `<span class="badge-shared" title="Partagée par ${a.shared}">${I('people')}</span>` : ''}</b>
                <span>${n ? n + ' document' + (n > 1 ? 's' : '') : 'Aucun document'}${a.shared ? ' · de ' + a.shared : ''}</span></div>
                <button class="icon-btn" data-appmenu="${a.id}" aria-label="Actions pour ${esc(a.name)}">${I('more', 's20')}</button></div>`;
        }).join('');
        const addCard = !q && !sharedOnly ? `<button class="app-card add" data-act="create"><span class="app-tile">${I('add')}</span><div class="txt"><b>Créer une app</b><span>Avec l'aide d'une IA</span></div></button>` : '';
        const nothing = !apps.length && !docs.length;
        return `<main class="content">
            <div class="content-head"><h1>${title}</h1></div>
            ${nothing ? `<div class="empty"><div class="art">🔍</div><h2>Aucun résultat</h2><p>Vérifiez l'orthographe ou cherchez le nom d'une app.</p></div>` : ''}
            ${apps.length || addCard ? `<div class="section-t">Applications</div><div class="app-grid">${appCards}${addCard}</div>` : ''}
            ${docs.length ? `<div class="section-t">${q ? 'Documents' : 'Documents récents'}</div>
            <table class="table"><thead><tr><th>Nom</th><th class="hide-sm">Application</th><th class="hide-sm">Modifié</th><th></th></tr></thead>
            <tbody>${docs.map((d) => docRow(d)).join('')}</tbody></table>` : ''}
        </main>`;
    }

    function viewApp() {
        const a = appOf(S.appId);
        const docs = docsOf(a.id).filter((d) => !S.query || d.name.toLowerCase().includes(S.query.toLowerCase()));
        const list = docs.length
            ? `<table class="table"><thead><tr><th>Nom</th><th class="hide-sm">Modifié</th><th></th></tr></thead><tbody>${docs.map((d) => docRow(d, false)).join('')}</tbody></table>`
            : `<div class="empty"><div class="art">${a.icon}</div><h2>Aucun document pour l'instant</h2><p>Un document garde vos données. Vous pouvez en créer autant que vous voulez avec la même app.</p>
               <button class="btn filled" data-act="new-doc">${I('add')}Nouveau document</button></div>`;
        return `<main class="content">
            <div class="content-head">
                <div class="crumbs"><button class="muted" data-go="home">Accueil</button>${I('chev')}

    function qrCanvas() {
        const c = document.createElement('canvas');
        const n = 25; c.width = n; c.height = n;
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, n, n); x.fillStyle = '#111';
        let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (rnd() > 0.52) x.fillRect(i, j, 1, 1);
        [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => {
            x.fillStyle = '#fff'; x.fillRect(a - 1 < 0 ? a : a - 1, b - 1 < 0 ? b : b - 1, 9, 9);
            x.fillStyle = '#111'; x.fillRect(a, b, 7, 7); x.fillStyle = '#fff'; x.fillRect(a + 1, b + 1, 5, 5); x.fillStyle = '#111'; x.fillRect(a + 2, b + 2, 3, 3);
        });
        return c.toDataURL();
    }

    // =========================================================
    //  MENUS
    // =========================================================
    let menuEl = null;
    function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
    function openMenu(anchor, items) {
        closeMenu();
        menuEl = document.createElement('div');
        menuEl.className = 'menu';
        menuEl.setAttribute('role', 'menu');
        menuEl.innerHTML = items.map((it) => it === '-' ? '<hr>' :
            `<button role="menuitem" class="${it.danger ? 'danger' : ''} ${it.desc ? 'tall' : ''} ${it.checked ? 'checked' : ''}" data-mi="${it.id}">${I(it.icon)}<span>${it.label}${it.desc ? `<span class="desc">${it.desc}</span>` : ''}</span>${it.checked ? `<span class="ck">${I('check', 's20')}</span>` : ''}</button>`).join('');
        document.body.appendChild(menuEl);
        const r = anchor.getBoundingClientRect();
        const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
        let left = Math.min(r.left, window.innerWidth - w - 8);
        let top = r.bottom + 4;
        if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
        menuEl.style.left = Math.max(8, left) + 'px';
        menuEl.style.top = top + 'px';
        menuEl.addEventListener('click', (e) => {
            const b = e.target.closest('[data-mi]'); if (!b) return;
            const it = items.find((x) => x.id === b.dataset.mi); closeMenu(); it.run && it.run();
        });
        menuEl.querySelector('button')?.focus();
    }

    // =========================================================
    //  RENDU
    // =========================================================
    const root = $('#root');
    let pop = null;
    function render() {
        let html;
        const sc = S.screen;
        if (sc === 'login') html = viewLogin();
        else if (sc === 'invite') html = viewInvite();
        else if (sc === 'home') html = shell(viewHome());
        else if (sc === 'app') html = shell(viewApp());
        else if (sc === 'doc' || sc === 'history') html = viewDoc();
        else if (sc === 'editor') html = viewEditor();
        if (S.dialog) {
            const d = { share: dialogShare, create: dialogCreate, newdoc: dialogNewDoc, delapp: dialogConfirmDeleteApp }[S.dialog]();
            html += `<div class="scrim" data-act="scrim">${d}</div>`;
        }
        if (pop === 'account') html += `<div class="scrim clear" data-act="close-pop"></div>${accountCard()}`;
        const active = document.activeElement && document.activeElement.id === 'q';
        root.innerHTML = html;
        if (active) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
        syncPreviewSelect();
    }

    function syncPreviewSelect() {
        let v = S.screen;
        if (S.dialog === 'share') v = 'share';
        else if (S.dialog === 'create') v = 'create';
        else if (v === 'doc' && DOCS.find((d) => d.id === S.docId).readonly) v = 'doc-ro';
        const sel = $('#pv-screen');
        if ([...sel.options].some((o) => o.value === v)) sel.value = v;
    }

    let snackTimer;
    function snack(msg, action) {
        document.querySelector('.snackbar')?.remove();
        const el = document.createElement('div');
        el.className = 'snackbar'; el.setAttribute('role', 'status');
        el.innerHTML = `<span>${msg}</span>${action ? `<button class="btn text">${action}</button>` : ''}<button class="icon-btn" style="color:inherit" aria-label="Fermer">${I('close', 's20')}</button>`;
        el.addEventListener('click', (e) => { if (e.target.closest('button')) el.remove(); });
        document.body.appendChild(el);
        clearTimeout(snackTimer); snackTimer = setTimeout(() => el.remove(), 4000);
    }

    function go(screen, extra = {}) {
        Object.assign(S, { dialog: null, drawer: false }, extra, { screen });
        pop = null; closeMenu(); render();
        const c = $('.content'); if (c) c.scrollTop = 0;
    }

    // --- Menus contextuels ---
    function docMenu(anchor, id) {
        const d = DOCS.find((x) => x.id === id);

            { id: 'share', icon: 'people', label: 'Partager', run: () => { S.docId = id; S.dialog = 'share'; render(); } },
            '-',
            { id: 'del', icon: 'delete', label: 'Placer dans la corbeille', danger: true, run: () => snack(`« ${esc(d.name)} » a été placé dans la corbeille`, 'Annuler') }
        ]);
    }
    function appMenu(anchor, id) {
        const a = appOf(id);
        S.appId = id;
        const items = [
            { id: 'new', icon: 'add', label: 'Nouveau document', run: () => go('doc', { docId: docsOf(id)[0]?.id || 'b26' }) },
            { id: 'open', icon: 'folder', label: 'Voir les documents', run: () => go('app', { appId: id }) }
        ];
        if (!a.shared) items.push({ id: 'edit', icon: 'code', label: "Modifier l'app", run: () => go('editor', { appId: id }) });
        items.push({ id: 'drive', icon: 'open', label: 'Ouvrir dans Google Drive', run: () => snack('Ouvre le dossier de l\'app dans Google Drive') }, '-');
        items.push(a.shared
            ? { id: 'rm', icon: 'delete', label: 'Retirer de mon One App', danger: true, run: () => snack(`« ${esc(a.name)} » retirée. L'original de ${a.shared} n'est pas touché.`, 'Annuler') }

        openMenu(anchor, items);

    // --- Clics ---
    document.addEventListener('click', (e) => {
        if (menuEl && !e.target.closest('.menu')) { closeMenu(); if (!e.target.closest('[data-docmenu],[data-appmenu],[data-act$="more"],[data-act="mode"],[data-act="new"],[data-act^="share-"]')) return; }
        const t = e.target.closest('[data-go],[data-act],[data-nav],[data-app],[data-doc],[data-docmenu],[data-appmenu],[data-hist],[data-newdoc]');
        if (!t) return;
        if (t.dataset.docmenu) { e.stopPropagation(); return docMenu(t, t.dataset.docmenu); }
        if (t.dataset.appmenu) { e.stopPropagation(); return appMenu(t, t.dataset.appmenu); }
        if (t.dataset.go) {
            const extra = {};
            if (t.dataset.go === 'doc-ro') return go('doc', { docId: 'plan' });
            if (t.dataset.go === 'home') extra.nav = 'home';
            if (t.dataset.go === 'history') extra.histSel = 0;
            if (t.dataset.appGo) extra.appId = t.dataset.appGo;
            return go(t.dataset.go, extra);
        }
        if (t.dataset.nav) return go('home', { nav: t.dataset.nav, query: '' });
        if (t.dataset.app) return go('app', { appId: t.dataset.app });
        if (t.dataset.doc) return go('doc', { docId: t.dataset.doc });
        if (t.dataset.hist) { S.histSel = +t.dataset.hist; return render(); }
        if (t.dataset.newdoc) { const a = appOf(t.dataset.newdoc); go('doc', { docId: docsOf(a.id)[0]?.id || 'b26' }); return snack(`Nouveau document « Sans titre » créé avec ${esc(a.name)}`); }
        act(t.dataset.act, t, e);
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { if (menuEl) closeMenu(); else if (S.dialog || pop || S.drawer) { S.dialog = null; pop = null; S.drawer = false; render(); } }
        if (e.key === 'Enter' && e.target.matches('.app-card[data-app]')) go('app', { appId: e.target.dataset.app });
        if (e.key === 'Enter' && e.target.id === 'doc-title') e.target.blur();
    });
    document.addEventListener('input', (e) => {
        if (e.target.id === 'q') { S.query = e.target.value; render(); }
    });
    document.addEventListener('change', (e) => {
        if (e.target.id === 'doc-title') snack('Document renommé');
    });

    function act(a, el, e) {
        switch (a) {
            case 'drawer': S.drawer = !S.drawer; return render();
            case 'clear-q': S.query = ''; return render();
            case 'account': pop = 'account'; return render();
            case 'close-pop': pop = null; return render();
            case 'scrim': if (e.target === el) { S.dialog = null; render(); } return;
            case 'close-dialog': S.dialog = null; return render();
            case 'new':
                return openMenu(el, [
                    { id: 'doc', icon: 'doc', label: 'Nouveau document', desc: 'Avec une de vos apps', run: () => { S.dialog = 'newdoc'; render(); } },
                    { id: 'app', icon: 'spark', label: 'Créer une app', desc: "Avec l'aide d'une IA", run: () => { S.dialog = 'create'; render(); } }
                ]);
            case 'create': S.dialog = 'create'; return render();
            case 'new-doc': go('doc', { docId: docsOf(S.appId)[0]?.id || 'b26' }); return snack(`Nouveau document « Sans titre » créé avec ${esc(appOf(S.appId).name)}`);
            case 'edit-app': return go('editor');
            case 'sync-info': return snack(S.net === 'offline' ? 'Hors connexion. Vos modifications sont sur cet appareil et partiront dès le retour du réseau.' : 'Tout est enregistré dans votre Google Drive.');
            case 'reconnect': $('#pv-net').value = 'online'; S.net = 'online'; render(); return snack('Reconnecté. 2 modifications envoyées dans Drive.');
            case 'cycle-status': {
                if (S.net === 'offline') return snack('Hors connexion : changez « Réseau » dans la barre de maquette pour voir les autres états.');
                const order = ['saved', 'saving', 'error'];
                S.status = order[(order.indexOf(S.status) + 1) % order.length]; return render();
            }
            case 'undo': return snack('Modification annulée');
            case 'redo': return;
            case 'mode':
                return openMenu(el, [
                    { id: 'edit', icon: 'edit', label: 'Modification', desc: 'Modifier le document', checked: S.mode === 'edit', run: () => { S.mode = 'edit'; render(); } },
                    { id: 'view', icon: 'eye', label: 'Lecture', desc: 'Consulter sans risque de modifier', checked: S.mode === 'view', run: () => { S.mode = 'view'; render(); } }
                ]);
            case 'share': S.dialog = 'share'; return render();
            case 'share-level':
                return openMenu(el, [
                    { id: 'p', icon: 'lock', label: 'Limité', desc: 'Vous seul pouvez ouvrir', checked: S.shareLevel === 'private', run: () => { S.shareLevel = 'private'; render(); } },
                    { id: 'l', icon: 'globe', label: 'Tous les utilisateurs qui ont le lien', desc: 'Pas besoin de compte Google pour regarder', checked: S.shareLevel === 'link', run: () => { S.shareLevel = 'link'; render(); snack('Accès mis à jour'); } }
                ]);
            case 'share-role':
                return openMenu(el, [
                    { id: 'r', icon: 'eye', label: 'Lecteur', checked: S.shareRole === 'reader', run: () => { S.shareRole = 'reader'; render(); } },
                    { id: 'w', icon: 'edit', label: 'Éditeur', checked: S.shareRole === 'writer', run: () => { S.shareRole = 'writer'; render(); } }
                ]);
            case 'copy-link': return snack(S.shareLevel === 'private' ? 'Lien copié. Seul vous pourrez l\'ouvrir tant que l\'accès est « Limité ».' : 'Lien copié');
            case 'qr': S.showQr = !S.showQr; return render();
            case 'native-share': return snack('Ouvre le menu de partage du téléphone (Messages, WhatsApp, e-mail…)');
            case 'docbar-more': {
                const doc = DOCS.find((d) => d.id === S.docId);
                const items = [];
                if (window.innerWidth <= 640) items.push({ id: 'h', icon: 'history', label: 'Historique des versions', run: () => go('history', { histSel: 0 }) });
                if (!doc.readonly) items.push({ id: 'rn', icon: 'edit', label: 'Renommer', run: () => $('#doc-title').select() });
                items.push({ id: 'cp', icon: 'copy', label: 'Créer une copie', run: () => snack(`Copie de « ${esc(doc.name)} » créée`, 'Ouvrir') });
                if (!doc.readonly) items.push({ id: 'ed', icon: 'code', label: "Modifier l'app", run: () => go('editor', { appId: doc.app }) });
                items.push({ id: 'dr', icon: 'open', label: 'Ouvrir dans Google Drive', run: () => snack('Ouvre le fichier dans Google Drive') });
                if (!doc.readonly) items.push('-', { id: 'del', icon: 'delete', label: 'Placer dans la corbeille', danger: true, run: () => { go('app', { appId: doc.app }); snack(`« ${esc(doc.name)} » a été placé dans la corbeille`, 'Annuler'); } });
                return openMenu(el, items);
            }
            case 'copy-doc': return snack('Copie créée dans votre One App. Vous pouvez la modifier.', 'Ouvrir');
            case 'restore': go('doc'); return snack('Version du ' + HISTORY.flatMap((g) => g.items)[S.histSel].t + ' restaurée', 'Annuler');
            case 'hist-copy': return snack('Copie de cette version créée', 'Ouvrir');
            case 'editor-more':
                return openMenu(el, [
                    { id: 'h', icon: 'history', label: 'Versions précédentes', run: () => snack("Affiche l'historique du code de l'app") },
                    { id: 'c', icon: 'copy', label: "Créer une copie de l'app", run: () => snack("Copie de l'app créée") },
                    { id: 'd', icon: 'download', label: 'Télécharger le fichier .html', run: () => snack('Téléchargement du fichier') },
                    '-',
                    { id: 'x', icon: 'delete', label: "Supprimer l'app", danger: true, run: () => { S.dialog = 'delapp'; render(); } }
                ]);
            case 'copy-code': return snack("Code et règles copiés. Collez-les dans votre IA.");
            case 'paste': return snack('Code remplacé par le contenu du presse-papiers', 'Annuler');
            case 'clear-code': { const c = $('#code'); if (c) c.value = ''; return snack('Éditeur vidé', 'Annuler'); }
            case 'save-code': go('app'); return snack(`« ${esc(appOf(S.appId).name)} » est à jour. Tous ses documents utilisent la nouvelle version.`);
            case 'copy-rules': return snack('Règles copiées. Collez-les dans votre IA.');
            case 'install-app': S.dialog = null; go('app', { appId: 'sport' }); return snack('App « Suivi sport » créée dans votre Drive');
            case 'do-delete-app': { const n = appOf(S.appId).name; go('home', { nav: 'home' }); return snack(`« ${esc(n)} » a été placée dans la corbeille`, 'Annuler'); }
            case 'install': pop = null; render(); return snack("Ouvre la fenêtre « Installer One App » (voir la maquette dédiée)");
            case 'open-drive': pop = null; render(); return snack('Ouvre Mon Drive › One App');
            case 'logout': pop = null; return go('login');
        }
    }

    // --- Barre de maquette ---
    $('#pv-screen').addEventListener('change', (e) => {
        const v = e.target.value;
        if (v === 'doc') return go('doc', { docId: 'b26' });
        if (v === 'doc-ro') return go('doc', { docId: 'plan' });
        if (v === 'history') return go('history', { docId: 'b26', histSel: 2 });
        if (v === 'share') { go('doc', { docId: 'b26' }); S.dialog = 'share'; return render(); }
        if (v === 'create') { go('home', { nav: 'home' }); S.dialog = 'create'; return render(); }
        if (v === 'app') return go('app', { appId: S.appId || 'budget' });
        if (v === 'editor') return go('editor', { appId: 'budget' });
        go(v, { nav: 'home' });
    });
    $('#pv-net').addEventListener('change', (e) => { S.net = e.target.value; render(); });
    $('#pv-tint').addEventListener('change', (e) => {
        if (e.target.value === 'blue') document.documentElement.setAttribute('data-tint', 'blue'); else document.documentElement.removeAttribute('data-tint');
    });
    $('#pv-theme').addEventListener('change', (e) => {
        if (e.target.value === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', e.target.value);
    });
    window.addEventListener('resize', closeMenu);

    render();
})();
</script>
</body>
</html>
